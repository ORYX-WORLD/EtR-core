etr_hostname: etr-core
etr_user: oryx
etr_repo: /home/oryx/EtR-core
etr_display: ':1'
etr_remote_display: ':2'
etr_remote_geometry: '1280x720x24'
etr_framebuffer: /dev/fb1
etr_framebuffer_name: fb_ili9486
etr_framebuffer_width: 480
etr_framebuffer_height: 320
etr_framebuffer_bpp: 16
etr_runner_service: actions.runner.ORYX-WORLD-EtR-core.etr-core.service
etr_runner_root: /home/oryx/actions-runner/actions-runner
etr_expected_kernel_regex: '^6\.18\.39\+rpt-rpi-(v8|2712)$'
etr_critical_services:
  - spi-desktop.service
  - etr-remote-desktop.service
  - etr-vnc.service
  - etr-remote-screen.service
etr_managed_files:
  - src: src/deploy/raspi/start_spi_desktop.sh
    dest: /usr/local/bin/start_spi_desktop.sh
    mode: '0755'
  - src: src/deploy/raspi/spi-desktop.service
    dest: /etc/systemd/system/spi-desktop.service
    mode: '0644'
  - src: src/deploy/raspi/start_remote_desktop.sh
    dest: /usr/local/bin/start_remote_desktop.sh
    mode: '0755'
  - src: src/deploy/raspi/etr-remote-desktop.service
    dest: /etc/systemd/system/etr-remote-desktop.service
    mode: '0644'
  - src: src/deploy/raspi/etr-vnc.service
    dest: /etc/systemd/system/etr-vnc.service
    mode: '0644'
  - src: src/deploy/raspi/etr-remote-screen.service
    dest: /etc/systemd/system/etr-remote-screen.service
    mode: '0644'
  - src: src/deploy/raspi/etr-sd-factory-launch.sh
    dest: /usr/local/bin/etr-sd-factory-launch.sh
    mode: '0755'
  - src: src/deploy/raspi/etr-sd-factory.service
    dest: /etc/systemd/system/etr-sd-factory.service
    mode: '0644'

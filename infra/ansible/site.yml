---
- name: EtR declarative state
  hosts: etr-core
  gather_facts: true
  become: true

  pre_tasks:
    - name: Verify target identity
      ansible.builtin.assert:
        that:
          - ansible_facts['hostname'] == etr_hostname
          - ansible_facts['architecture'] in ['aarch64', 'arm64']
        fail_msg: 'Refusing to manage a host that is not the EtR Raspberry.'

    - name: Read active kernel
      ansible.builtin.command: uname -r
      register: etr_kernel
      changed_when: false
      check_mode: false

    - name: Verify active kernel
      ansible.builtin.assert:
        that:
          - etr_kernel.stdout is match(etr_expected_kernel_regex)
        fail_msg: 'Unexpected Raspberry kernel: {{ etr_kernel.stdout }}'

    - name: Read framebuffer name
      ansible.builtin.slurp:
        src: /sys/class/graphics/fb1/name
      register: etr_fb_name

    - name: Read framebuffer geometry
      ansible.builtin.slurp:
        src: /sys/class/graphics/fb1/virtual_size
      register: etr_fb_size

    - name: Read framebuffer depth
      ansible.builtin.slurp:
        src: /sys/class/graphics/fb1/bits_per_pixel
      register: etr_fb_bpp

    - name: Verify physical SPI framebuffer
      ansible.builtin.assert:
        that:
          - (etr_fb_name.content | b64decode | trim) == etr_framebuffer_name
          - (etr_fb_size.content | b64decode | trim) == (etr_framebuffer_width | string) + ',' + (etr_framebuffer_height | string)
          - (etr_fb_bpp.content | b64decode | trim) == (etr_framebuffer_bpp | string)
        fail_msg: 'Physical SPI framebuffer does not match the EtR hardware contract.'

  tasks:
    - name: Keep critical deployed files identical to GitHub
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: root
        mode: "{{ item.mode }}"
        backup: true
      loop: "{{ etr_managed_files }}"

    - name: Ensure critical EtR services are enabled and running
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ etr_critical_services }}"

    - name: Ensure GitHub runner service is enabled and running
      ansible.builtin.systemd_service:
        name: "{{ etr_runner_service }}"
        enabled: true
        state: started

    - name: Verify runner installation directory
      ansible.builtin.stat:
        path: "{{ etr_runner_root }}/bin/Runner.Listener"
      register: etr_runner_listener

    - name: Assert runner binary exists
      ansible.builtin.assert:
        that:
          - etr_runner_listener.stat.exists
        fail_msg: 'GitHub runner installation is missing from the declared path.'

    - name: Observe LXDE sessions and their displays
      ansible.builtin.shell: |
        set -euo pipefail
        for pid in $(pgrep -x lxsession || true); do
          [ -r "/proc/$pid/environ" ] || continue
          display=$(tr '\0' '\n' < "/proc/$pid/environ" | sed -n 's/^DISPLAY=//p' | head -n1)
          args=$(tr '\0' ' ' < "/proc/$pid/cmdline")
          case "$args" in
            *"lxsession -s LXDE -e LXDE"*) printf '%s\n' "$display" ;;
          esac
        done | sort
      args:
        executable: /bin/bash
      register: etr_lxde_displays
      changed_when: false
      check_mode: false

    - name: Verify physical and remote desktop topology
      ansible.builtin.assert:
        that:
          - etr_lxde_displays.stdout_lines | select('equalto', etr_display) | list | length == 1
          - etr_lxde_displays.stdout_lines | select('equalto', etr_remote_display) | list | length == 1
          - etr_lxde_displays.stdout_lines | length == 2
        fail_msg: 'Display topology drift: expected one LXDE on {{ etr_display }} and one on {{ etr_remote_display }}, observed {{ etr_lxde_displays.stdout_lines }}.'

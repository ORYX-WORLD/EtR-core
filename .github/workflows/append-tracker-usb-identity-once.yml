name: Consigner le correctif d'identification USB

on:
  push:
    branches:
      - fix/sd-usb-identity-path
    paths:
      - .github/workflows/append-tracker-usb-identity-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sd-usb-identity-path
          fetch-depth: 0

      - name: Ajouter le suivi et retirer ce workflow ponctuel
        shell: bash
        run: |
          set -euo pipefail
          marker='| ETR-044 | Identification du port USB du lecteur |'
          if ! grep -Fq "$marker" docs/PROJECT_TRACKER.md; then
            cat >> docs/PROJECT_TRACKER.md <<'EOF'
          | ETR-044 | Identification du port USB du lecteur | La première exécution de la récupération pré-copie s'est arrêtée avant l'effacement car le lien SCSI `/sys/class/block/sda/device` ne remontait pas de nœud contenant directement `idVendor` et `idProduct` | P0 | Correctif en PR | La carte et le lecteur étaient pourtant présents sur `/dev/sda`, 31,3 Go, USB `1908:0226`, mais `inspect_physical_target` a retourné `lecteur USB cible non identifiable` | Ajout d'un repli par `udevadm info --query=path`, extraction du nœud physique `1-1.1` depuis DEVPATH, puis vérification dans `/sys/bus/usb/devices`; diagnostic enrichi et test avec le chemin udev réel du banc | Valider la CI, déployer puis relancer le même travail pour atteindre l'effacement et observer la récupération bornée en cas de nouveau décrochage |
          EOF
          fi
          rm -f .github/workflows/append-tracker-usb-identity-once.yml
          git config user.name 'EtR tracker automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/PROJECT_TRACKER.md .github/workflows/append-tracker-usb-identity-once.yml
          git commit -m 'docs: consigner l'identification USB par DEVPATH'
          git push origin HEAD:fix/sd-usb-identity-path

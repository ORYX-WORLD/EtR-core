name: Déclencher le test humain après le nouveau vérificateur

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-trigger-human-e2e-after-account-lookup.yml
  workflow_dispatch:

concurrency:
  group: etr-trigger-human-e2e-after-account-lookup
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  wait_and_dispatch:
    name: Attendre la nouvelle révision puis lancer le parcours humain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GATEWAY_URL: https://etr-remote-gateway-7n72m5gopq-ew.a.run.app
      PREVIOUS_REVISION: etr-remote-gateway-00024-f8d

    steps:
      - name: Attendre une révision neuve avec un Raspberry permanent
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          mkdir -p /tmp/etr-account-lookup-trigger
          for attempt in $(seq 1 240); do
            status=$(curl -sS -o /tmp/etr-account-lookup-trigger/health.json -w '%{http_code}' \
              "$GATEWAY_URL/api/health" || echo 000)
            if [ "$status" = "200" ] && python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/etr-account-lookup-trigger/health.json', encoding='utf-8'))
          revision=str(data.get('revision') or '')
          assert data.get('ok') is True
          assert data.get('service') == 'etr-remote-gateway'
          assert revision and revision != os.environ['PREVIOUS_REVISION']
          assert int(data.get('devices', 0)) >= 1
          assert int(data.get('viewers', 0)) == 0
          PY
            then
              ready=true
              break
            fi
            sleep 5
          done
          cat /tmp/etr-account-lookup-trigger/health.json 2>/dev/null | python3 -m json.tool || true
          [ "$ready" = true ] || {
            echo "::error::La nouvelle révision avec un EtR permanent n'est pas prête"
            exit 1
          }

      - name: Lancer le test humain vérifié
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run etr-remote-viewer-human-live-e2e.yml --ref main

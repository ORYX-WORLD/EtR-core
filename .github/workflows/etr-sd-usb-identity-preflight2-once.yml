name: Relancer le précontrôle USB sans checkout du runner

on:
  push:
    branches:
      - fix/sd-usb-identity-path
    paths:
      - .github/workflows/etr-sd-usb-identity-preflight2-once.yml

concurrency:
  group: etr-sd-usb-identity-preflight2
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Cloner la branche dans un espace temporaire propre
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/etr-sd-usb-identity-source /tmp/etr-sd-usb-identity-preflight2
          mkdir -p /tmp/etr-sd-usb-identity-preflight2
          git clone --depth 1 --branch fix/sd-usb-identity-path \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/etr-sd-usb-identity-source

      - name: Identifier la carte directement et dans le sandbox systemd
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-usb-identity-preflight2
          source=/tmp/etr-sd-usb-identity-source
          lsusb > "$work/lsusb.txt"
          lsusb -t > "$work/lsusb-tree.txt"
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > "$work/lsblk.txt"
          udevadm info --query=path --name /dev/sda > "$work/devpath.txt"
          udevadm info --query=property --name /dev/sda > "$work/udev-properties.txt"
          readlink -f /sys/class/block/sda/device > "$work/sysfs-device.txt"

          sudo env PYTHONPATH="$source" PYTHONDONTWRITEBYTECODE=1 /usr/bin/python3 - <<'PY' > "$work/direct.json"
          import json
          from src.deploy.raspi.etr_sd_factory_preparation_recovery import inspect_physical_target
          print(json.dumps(inspect_physical_target('/dev/sda').__dict__,ensure_ascii=False,indent=2))
          PY

          unit="etr-sd-usb-identity-preflight2-${GITHUB_RUN_ID}"
          sudo systemd-run --quiet --wait --collect --pipe --unit="$unit" \
            -p Type=oneshot -p User=root -p Group=root \
            -p NoNewPrivileges=true -p PrivateTmp=true \
            -p ProtectHome=read-only -p ProtectSystem=strict \
            -p PrivateDevices=false \
            -p RestrictAddressFamilies='AF_UNIX AF_INET AF_INET6 AF_NETLINK' \
            /usr/bin/env PYTHONPATH="$source" PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 -c \
            'import json; from src.deploy.raspi.etr_sd_factory_preparation_recovery import inspect_physical_target; print(json.dumps(inspect_physical_target("/dev/sda").__dict__, ensure_ascii=False, indent=2))' \
            > "$work/sandbox.json"

          python3 - <<'PY'
          import json
          direct=json.load(open('/tmp/etr-sd-usb-identity-preflight2/direct.json',encoding='utf-8'))
          sandbox=json.load(open('/tmp/etr-sd-usb-identity-preflight2/sandbox.json',encoding='utf-8'))
          for value in (direct,sandbox):
              assert value['disk_path'] == '/dev/sda', value
              assert value['disk_size'] == 31268536320, value
              assert value['usb_node'], value
              assert value['vendor_id'] in {'14cd','1908'}, value
              assert value['product_id'] in {'1212','0226'}, value
          assert direct['usb_node'] == sandbox['usb_node'], (direct,sandbox)
          PY

      - name: Publier la preuve et retirer ce workflow ponctuel
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-usb-identity-preflight2
          python3 - <<'PY' > /tmp/etr-sd-usb-identity-preflight.json
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          base=Path('/tmp/etr-sd-usb-identity-preflight2')
          def data(name):
              try:return json.loads((base/name).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(name):
              try:return (base/name).read_text(encoding='utf-8',errors='replace')[-12000:]
              except OSError:return ''
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'direct':data('direct.json'),
              'sandbox':data('sandbox.json'),
              'devpath':text('devpath.txt').strip() or None,
              'sysfsDevice':text('sysfs-device.txt').strip() or None,
              'udevProperties':text('udev-properties.txt'),
              'lsusb':text('lsusb.txt'),
              'lsusbTree':text('lsusb-tree.txt'),
              'lsblk':text('lsblk.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-usb-identity-preflight.json

          cd /tmp/etr-sd-usb-identity-source
          git fetch origin fix/sd-usb-identity-path
          git reset --hard origin/fix/sd-usb-identity-path
          mkdir -p .github/deployment
          cp /tmp/etr-sd-usb-identity-preflight.json .github/deployment/etr-sd-usb-identity-preflight.json
          rm -f .github/workflows/etr-sd-usb-identity-preflight2-once.yml
          git config user.name 'EtR USB identity preflight 2'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-usb-identity-preflight.json \
                  .github/workflows/etr-sd-usb-identity-preflight2-once.yml
          git commit -m 'chore: record USB identity preflight 2 [skip ci]'
          git pull --rebase origin fix/sd-usb-identity-path
          git push origin HEAD:fix/sd-usb-identity-path

name: Sonder la passerelle publique EtR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gateway/**
      - .github/workflows/etr-gateway-public-probe.yml

concurrency:
  group: etr-gateway-public-probe
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  probe:
    name: Lire les réponses publiques exactes
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GATEWAY_URL: https://etr-remote-gateway-7n72m5gopq-ew.a.run.app

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Attendre la route de santé publique versionnée
        id: wait_health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-public-probe
          ready=false
          for attempt in $(seq 1 120); do
            status=$(curl -sS -D /tmp/etr-public-probe/api_health.headers \
              -o /tmp/etr-public-probe/api_health.body \
              -w '%{http_code}' "$GATEWAY_URL/api/health" || echo 000)
            printf '%s' "$status" > /tmp/etr-public-probe/api_health.status
            if [ "$status" = "200" ] && python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-public-probe/api_health.body', encoding='utf-8'))
          assert data.get('ok') is True
          assert data.get('service') == 'etr-remote-gateway'
          assert data.get('version') == '1.1.0'
          assert data.get('enrollment') == 'v1'
          assert data.get('admin') == 'v1'
          PY
            then
              ready=true
              break
            fi
            sleep 5
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          cat /tmp/etr-public-probe/api_health.body 2>/dev/null | python3 -m json.tool || true
          [ "$ready" = true ] || {
            echo "::error::La route /api/health versionnée n'est pas disponible après 10 minutes"
            exit 1
          }

      - name: Sonder les autres routes publiques
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          request() {
            local name=$1
            local method=$2
            local path=$3
            local data=${4:-}
            if [ -n "$data" ]; then
              curl -sS -D "/tmp/etr-public-probe/${name}.headers" \
                -o "/tmp/etr-public-probe/${name}.body" \
                -w '%{http_code}' -X "$method" "$GATEWAY_URL$path" \
                -H 'Content-Type: application/json' -d "$data" \
                > "/tmp/etr-public-probe/${name}.status" || true
            else
              curl -sS -D "/tmp/etr-public-probe/${name}.headers" \
                -o "/tmp/etr-public-probe/${name}.body" \
                -w '%{http_code}' -X "$method" "$GATEWAY_URL$path" \
                > "/tmp/etr-public-probe/${name}.status" || true
            fi
          }
          request root GET /
          request compatibility_health GET /healthz
          request enrollment POST /api/enrollment/request '{}'
          request admin GET /api/admin/session
          for name in root api_health compatibility_health enrollment admin; do
            echo "=== $name HTTP $(cat /tmp/etr-public-probe/${name}.status 2>/dev/null || echo 000) ==="
            cat "/tmp/etr-public-probe/${name}.body" 2>/dev/null || true
            echo
          done

      - name: Déclencher la réparation Edge
        if: steps.wait_health.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run etr-remote-screen-repair-fast.yml --ref main

      - name: Publier le diagnostic public
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          python3 - <<'PY' > /tmp/gateway-public-probe-last.json
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('/tmp/etr-public-probe')
          def text(name, suffix):
              try:return (root/f'{name}.{suffix}').read_text(encoding='utf-8',errors='replace')[:8000]
              except OSError:return ''
          def status(name):
              try:return int(text(name,'status').strip() or 0)
              except ValueError:return 0
          def body(name):
              raw=text(name,'body')
              try:return json.loads(raw)
              except Exception:return raw
          report={
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'commit':os.getenv('GITHUB_SHA'),
              'jobStatus':os.getenv('JOB_STATUS'),
              'gatewayUrl':os.getenv('GATEWAY_URL'),
              'responses':{
                  name:{'status':status(name),'body':body(name),'headers':text(name,'headers')}
                  for name in ('root','api_health','compatibility_health','enrollment','admin')
              }
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          cat /tmp/gateway-public-probe-last.json
          git fetch origin main
          git checkout -B public-probe-report origin/main
          mkdir -p .github/deployment
          cp /tmp/gateway-public-probe-last.json .github/deployment/gateway-public-probe-last.json
          git config user.name "EtR public gateway probe"
          git config user.email "actions@users.noreply.github.com"
          git add .github/deployment/gateway-public-probe-last.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record EtR public gateway probe [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

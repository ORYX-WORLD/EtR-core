name: Lire une fois l'état protégé de la fabrique microSD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-sd-read-state-once.yml

permissions:
  contents: write

jobs:
  read:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Lire les fichiers root sans les modifier
        shell: bash
        run: |
          set -euo pipefail
          sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-protected-state.json 2>/dev/null || printf '{}\n' > /tmp/etr-sd-protected-state.json
          sudo cat /var/lib/etr-core/sd-factory-request.json > /tmp/etr-sd-protected-request.json 2>/dev/null || printf '{}\n' > /tmp/etr-sd-protected-request.json
          sudo cat /var/lib/etr-core/sd-factory-rsync.log > /tmp/etr-sd-protected-rsync.log 2>/dev/null || : > /tmp/etr-sd-protected-rsync.log
          sudo journalctl -u etr-sd-factory-worker.service -o cat --since '2026-08-03 15:40:00' --no-pager > /tmp/etr-sd-protected-journal.txt 2>&1 || true
          python3 - <<'PY' > /tmp/etr-sd-protected-report.json
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          def data(path):
              try:return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(path, limit=30000):
              try:return Path(path).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'state':data('/tmp/etr-sd-protected-state.json'),
              'request':data('/tmp/etr-sd-protected-request.json'),
              'rsyncLog':text('/tmp/etr-sd-protected-rsync.log'),
              'journal':text('/tmp/etr-sd-protected-journal.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-protected-report.json

      - name: Publier puis retirer le workflow ponctuel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/etr-sd-protected-repo
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-protected-repo
          cd /tmp/etr-sd-protected-repo
          mkdir -p .github/deployment
          cp /tmp/etr-sd-protected-report.json .github/deployment/etr-sd-protected-state.json
          rm -f .github/workflows/etr-sd-read-state-once.yml
          git config user.name 'EtR SD protected state reader'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-protected-state.json .github/workflows/etr-sd-read-state-once.yml
          git commit -m 'chore: record protected SD state and remove one-shot workflow [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

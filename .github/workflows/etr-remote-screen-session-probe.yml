name: Sonder la session écran distante EtR

# Relance après la correction de l'autorisation appareil : attendre une révision
# Cloud Run différente de celle qui renvoyait HTTP 500, puis comparer RTDB et
# l'upgrade WebSocket avec exactement la même session technique.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/remote_screen_probe.py
      - gateway/device-authorization.mjs
      - .github/workflows/etr-remote-screen-session-probe.yml

concurrency:
  group: etr-remote-screen-session-probe
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  probe:
    name: Comparer RTDB et la négociation WebSocket
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 22
    env:
      GATEWAY_ORIGIN: https://etr-remote-gateway-7n72m5gopq-ew.a.run.app
      PREVIOUS_GATEWAY_REVISION: etr-remote-gateway-00017-m2d
      EXPECTED_GATEWAY_VERSION: 1.1.1

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Attendre la nouvelle révision Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-remote-session-probe
          ready=false
          for attempt in $(seq 1 180); do
            status=$(curl -sS -o /tmp/etr-remote-session-probe/gateway-health.json -w '%{http_code}' \
              "$GATEWAY_ORIGIN/api/health" || echo 000)
            if [ "$status" = "200" ] && \
               PREVIOUS_GATEWAY_REVISION="$PREVIOUS_GATEWAY_REVISION" \
               EXPECTED_GATEWAY_VERSION="$EXPECTED_GATEWAY_VERSION" \
               python3 - <<'PY'
          import json, os
          data=json.load(open('/tmp/etr-remote-session-probe/gateway-health.json', encoding='utf-8'))
          assert data.get('ok') is True
          assert data.get('service') == 'etr-remote-gateway'
          assert data.get('version') == os.environ['EXPECTED_GATEWAY_VERSION']
          revision=str(data.get('revision') or '')
          assert revision
          assert revision != os.environ['PREVIOUS_GATEWAY_REVISION']
          PY
            then
              ready=true
              break
            fi
            sleep 5
          done
          [ "$ready" = true ] || {
            cat /tmp/etr-remote-session-probe/gateway-health.json 2>/dev/null || true
            echo "::error::La nouvelle révision Cloud Run n'est pas devenue publique après 15 minutes"
            exit 1
          }
          python3 -m json.tool /tmp/etr-remote-session-probe/gateway-health.json

      - name: Actualiser le dépôt installé
        shell: bash
        run: |
          set -euo pipefail
          install_dir=/home/oryx/EtR-core
          sudo -u oryx -H git -C "$install_dir" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$install_dir" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$install_dir" stash push --include-untracked -m "Sauvegarde avant sonde session écran $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$install_dir" fetch origin main
          sudo -u oryx -H git -C "$install_dir" checkout main
          sudo -u oryx -H git -C "$install_dir" pull --ff-only origin main

      - name: Arrêter temporairement le relais et sonder la session
        id: probe
        shell: bash
        run: |
          set +e
          sudo systemctl stop etr-remote-screen.service
          sleep 1
          sudo -u oryx -H bash -c '
            set -a
            source /etc/etr-core/firebase-bridge.env
            set +a
            cd /home/oryx/EtR-core
            ./.venv/bin/python src/remote_screen_probe.py \
              --token-file /var/lib/etr-core/firebase-auth.json \
              --output /tmp/etr-remote-session-probe/report.json
          ' > /tmp/etr-remote-session-probe/stdout.txt 2> /tmp/etr-remote-session-probe/stderr.txt
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          sudo chown -R "$(id -u):$(id -g)" /tmp/etr-remote-session-probe
          sudo systemctl restart etr-remote-screen.service
          exit 0

      - name: Publier le résultat sûr
        if: always()
        shell: bash
        env:
          PROBE_EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          if [ -s /tmp/etr-remote-session-probe/report.json ]; then
            cp /tmp/etr-remote-session-probe/report.json /tmp/etr-remote-screen-session-last.json
          else
            python3 - <<'PY' > /tmp/etr-remote-screen-session-last.json
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          try: stderr=Path('/tmp/etr-remote-session-probe/stderr.txt').read_text(encoding='utf-8',errors='replace')[-3000:]
          except OSError: stderr=''
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'installationId':None,
              'uidPresent':False,
              'deviceAccess':{'status':0,'value':None,'matches':False},
              'websocket':{'connected':False,'status':0,'error':'probe_failed','message':stderr},
          },ensure_ascii=False,indent=2))
          PY
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path=Path('/tmp/etr-remote-screen-session-last.json')
          data=json.loads(path.read_text(encoding='utf-8'))
          data['probeExitCode']=int(os.getenv('PROBE_EXIT_CODE') or 0)
          try:
              data['gatewayHealth']=json.loads(Path('/tmp/etr-remote-session-probe/gateway-health.json').read_text(encoding='utf-8'))
          except Exception:
              data['gatewayHealth']=None
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          cat /tmp/etr-remote-screen-session-last.json

          git fetch origin main
          git checkout -B remote-session-probe-report origin/main
          mkdir -p .github/deployment
          cp /tmp/etr-remote-screen-session-last.json .github/deployment/etr-remote-screen-session-last.json
          git config user.name "EtR remote session probe"
          git config user.email "actions@users.noreply.github.com"
          git add .github/deployment/etr-remote-screen-session-last.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record EtR remote screen session probe [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Exiger RTDB et WebSocket
        shell: bash
        env:
          PROBE_EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        run: |
          set -euo pipefail
          [ "${PROBE_EXIT_CODE:-5}" = "0" ] || {
            echo "::error::La sonde session écran a échoué ; lire etr-remote-screen-session-last.json"
            exit 1
          }

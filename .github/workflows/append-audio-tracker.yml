name: Ajouter le suivi audio EtR

on:
  push:
    branches: [feat/etr-audio-jbl]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajouter la ligne de suivi
        shell: bash
        run: |
          set -euo pipefail
          marker='| ETR-037 | Audio Bluetooth et microphone |'
          if grep -Fq "$marker" docs/PROJECT_TRACKER.md; then
            exit 0
          fi
          printf '%s\n' '| ETR-037 | Audio Bluetooth et microphone | La JBL Go 3 ne présentait pas de sink BlueZ et le microphone n’était pas exploité par EtR | P0 | Implémenté, validation physique en cours | La pile PipeWire/WirePlumber est installée, la JBL connue est associée et reconnectée automatiquement, le microphone est capturé en continu avec niveaux RMS/crête et un échantillon roulant de 5 s en RAM | Services `etr-jbl-connect` et `etr-audio-monitor`, API `/api/v1/audio`, preuve ARM64 sans archivage audio | Confirmer la connexion A2DP, identifier la source micro réelle et contrôler l’activité vocale sur le banc |' >> docs/PROJECT_TRACKER.md
          git config user.name 'EtR audio tracker'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/PROJECT_TRACKER.md
          git commit -m 'docs: suivre l’intégration audio EtR'
          git push

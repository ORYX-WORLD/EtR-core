name: Diagnostiquer puis redéployer la reprise USB microSD

on:
  push:
    branches:
      - ops/deploy-sd-usb-resume
    paths:
      - .github/workflows/etr-sd-usb-resume-retry-once.yml

concurrency:
  group: etr-sd-usb-resume-retry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose-deploy-start:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 90
    env:
      REPO: /home/oryx/EtR-core
      REPORT_BRANCH: ops/deploy-sd-usb-resume
      EXPECTED_SIZE: "31268536320"

    steps:
      - name: Préparer les preuves et actualiser main
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-usb-resume-retry
          rm -rf "$work"
          mkdir -p "$work"
          date +%s > "$work/start-epoch"
          lsusb > "$work/lsusb-before.txt" || true
          lsusb -t > "$work/lsusb-tree-before.txt" || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > "$work/lsblk-before.txt"

          current=$(sudo systemctl show -p ActiveState --value etr-sd-factory-worker.service 2>/dev/null || echo inactive)
          printf '%s\n' "$current" > "$work/worker-before.txt"
          if [[ "$current" =~ ^(active|activating|reloading|deactivating)$ ]]; then
            echo "::error::Une fabrication est déjà active ($current). Aucun arrêt forcé."
            exit 1
          fi
          sudo systemctl stop etr-sd-factory.service 2>/dev/null || true
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true

          sudo -u oryx -H git -C "$REPO" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$REPO" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$REPO" stash push --include-untracked \
              -m "Sauvegarde avant diagnostic reprise USB $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$REPO" fetch origin main
          sudo -u oryx -H git -C "$REPO" checkout main
          sudo -u oryx -H git -C "$REPO" reset --hard origin/main
          sudo -u oryx -H git -C "$REPO" rev-parse HEAD > "$work/installed-commit.txt"
          find "$REPO/src/deploy/raspi" -maxdepth 1 -name 'etr_sd_factory*.py' -printf '%f\n' | sort > "$work/factory-files.txt"

      - name: Diagnostiquer la syntaxe et les tests sans masquer l'erreur
        id: checks
        shell: bash
        run: |
          set -u
          work=/tmp/etr-sd-usb-resume-retry
          cd "$REPO" || exit 91

          python3 -m py_compile \
            src/deploy/raspi/etr_sd_factory_fast.py \
            src/deploy/raspi/etr_sd_factory_state.py \
            src/deploy/raspi/etr_sd_factory_usb_resume.py \
            src/deploy/raspi/etr_sd_factory_worker.py \
            > "$work/pycompile.txt" 2>&1
          py_code=$?
          echo "py_code=$py_code" >> "$GITHUB_OUTPUT"

          if [ -x "$REPO/.venv/bin/python" ]; then
            "$REPO/.venv/bin/python" -m unittest discover -s tests -p 'test_sd_factory*.py' -v \
              > "$work/tests.txt" 2>&1
            test_code=$?
          else
            printf '.venv/bin/python absent\n' > "$work/tests.txt"
            test_code=127
          fi
          echo "test_code=$test_code" >> "$GITHUB_OUTPUT"
          cat "$work/pycompile.txt"
          cat "$work/tests.txt"
          [ "$py_code" = 0 ] && [ "$test_code" = 0 ]

      - name: Tester la perte et la reprise sur un disque virtuel
        id: looptest
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-usb-resume-retry
          loopwork=$work/loop
          image=$loopwork/card.img
          root=$loopwork/root
          mkdir -p "$root"
          truncate -s 256M "$image"
          printf 'label: dos\nunit: sectors\n\nstart=2048, type=83\n' | sudo sfdisk "$image" > "$work/loop-sfdisk.txt" 2>&1
          loop=$(sudo losetup --find --show --partscan "$image")
          printf '%s\n' "$loop" > "$loopwork/initial-loop"
          partition="${loop}p1"
          for attempt in $(seq 1 50); do
            [ -b "$partition" ] && break
            sleep 0.2
          done
          test -b "$partition"
          sudo mkfs.ext4 -F -L etr_resume_test "$partition" > "$work/loop-mkfs.txt" 2>&1
          sudo mount "$partition" "$root"
          sudo mkdir -p "$root/home/oryx/EtR-core"
          printf 'partial-data\n' | sudo tee "$root/home/oryx/EtR-core/probe.txt" >/dev/null

          set +e
          sudo env \
            PYTHONPATH="$REPO" \
            ETR_RESUME_TEST_IMAGE="$image" \
            ETR_RESUME_TEST_INITIAL_LOOP="$loop" \
            ETR_RESUME_TEST_ROOT="$root" \
            "$REPO/.venv/bin/python" - <<'PY' > "$work/loop-recovery.txt" 2>&1
          import json
          import os
          import subprocess
          import threading
          import time
          from pathlib import Path
          from src.deploy.raspi.etr_sd_factory_usb_resume import inspect_target, recover_target_mount

          image = os.environ['ETR_RESUME_TEST_IMAGE']
          initial_loop = os.environ['ETR_RESUME_TEST_INITIAL_LOOP']
          root = Path(os.environ['ETR_RESUME_TEST_ROOT']).resolve()
          deep = root / 'home/oryx/EtR-core'
          identity = inspect_target(str(deep))
          assert Path(identity.mountpoint) == root, (identity.mountpoint, root)
          subprocess.run(['/usr/bin/umount', str(root)], check=True)
          subprocess.run(['/usr/sbin/losetup', '-d', initial_loop], check=True)

          holder = {}
          def reconnect():
              time.sleep(3)
              result = subprocess.run(
                  ['/usr/sbin/losetup', '--find', '--show', '--partscan', image],
                  check=True, text=True, capture_output=True,
              )
              holder['loop'] = result.stdout.strip()
              subprocess.run(['/usr/bin/udevadm', 'settle'], check=False)

          thread = threading.Thread(target=reconnect, daemon=True)
          thread.start()
          messages = []
          recovered = recover_target_mount(
              identity,
              progress=lambda value: (messages.append(value), print(value)),
              attempt=1,
              maximum=2,
              timeout_seconds=30,
              stable_seconds=2,
          )
          thread.join(timeout=10)
          assert Path(recovered.mountpoint) == root, recovered
          assert (deep / 'probe.txt').read_text().strip() == 'partial-data'
          actual = subprocess.run(
              ['/usr/bin/findmnt', '-n', '-o', 'TARGET', '--target', str(deep)],
              check=True, text=True, capture_output=True,
          ).stdout.strip()
          assert Path(actual).resolve() == root, (actual, root)
          assert any(v.startswith('Pause USB') for v in messages)
          assert any(v.startswith('Contrôle du système de fichiers') for v in messages)
          assert any(v.startswith('Reprise de la copie') for v in messages)
          print(json.dumps({'status':'success','mountpoint':str(root),'newLoop':holder.get('loop')}, indent=2))
          PY
          loop_code=$?
          set -e
          echo "loop_code=$loop_code" >> "$GITHUB_OUTPUT"
          cat "$work/loop-recovery.txt"

          sudo umount "$root" 2>/dev/null || true
          while read -r device; do
            [ -n "$device" ] || continue
            sudo losetup -d "$device" 2>/dev/null || true
          done < <(sudo losetup -j "$image" | cut -d: -f1)
          rm -rf "$loopwork"
          [ "$loop_code" = 0 ]

      - name: Installer la fabrique corrigée
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-cleanup.sh" /usr/local/bin/etr-sd-factory-cleanup
          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-launch.sh" /usr/local/bin/etr-sd-factory-launch.sh
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory-worker.service" /etc/systemd/system/etr-sd-factory-worker.service
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory.service" /etc/systemd/system/etr-sd-factory.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true
          systemd-analyze verify /etc/systemd/system/etr-sd-factory-worker.service /etc/systemd/system/etr-sd-factory.service
          sudo systemctl restart etr-sd-factory.service

      - name: Détecter la carte et lancer effacement formatage écriture
        id: start
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-usb-resume-retry
          lsusb | grep -E '14cd:1212|1908:0226' | tee "$work/reader.txt"
          cd "$REPO"
          sudo .venv/bin/python - <<'PY' > "$work/request.json"
          import json
          import uuid
          from src.deploy.raspi import etr_sd_factory_core as core
          from src.deploy.raspi.etr_sd_factory_state import write_request

          expected = 31268536320
          devices = core.lsblk_data()
          source = core.source_disk(devices)
          matches = [d for d in core.candidate_disks(devices, source) if d.size == expected]
          if len(matches) != 1:
              raise SystemExit('Cible microSD ambiguë ou absente: ' + repr([(d.path,d.size,d.transport,d.removable) for d in core.candidate_disks(devices, source)]))
          disk = matches[0]
          request = {
              'job_id': str(uuid.uuid4()),
              'device': disk.path,
              'disk_label': disk.label,
              'size_bytes': disk.size,
              'copy_wifi': bool(core.active_wifi_profile()),
          }
          write_request(request)
          print(json.dumps(request, ensure_ascii=False, indent=2))
          PY
          job_id=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-usb-resume-retry/request.json"))["job_id"])')
          target=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-usb-resume-retry/request.json"))["device"])')
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          sudo systemctl start --no-block etr-sd-factory-worker.service

      - name: Attendre le début de l'écriture ou un résultat terminal
        id: state
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-usb-resume-retry
          reached=false
          terminal=false
          observed=""
          : > "$work/status-history.txt"
          for attempt in $(seq 1 600); do
            if sudo test -s /var/lib/etr-core/sd-factory-state.json; then
              sudo cat /var/lib/etr-core/sd-factory-state.json > "$work/state.json"
              observed=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-usb-resume-retry/state.json")).get("status", ""))')
              printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$observed" >> "$work/status-history.txt"
              case "$observed" in
                copying_root|copying_boot|paused_usb|checking_filesystem|resuming_copy|configuring|verifying|syncing|finalizing|ready)
                  reached=true; break ;;
                failed|cancelled|interrupted)
                  terminal=true; break ;;
              esac
            fi
            sleep 1
          done
          echo "reached=$reached" >> "$GITHUB_OUTPUT"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          echo "observed=$observed" >> "$GITHUB_OUTPUT"
          sudo cat /var/lib/etr-core/sd-factory-state.json 2>/dev/null || true
          [ "$reached" = true ]

      - name: Publier les preuves détaillées et retirer ce workflow
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          PY_CODE: ${{ steps.checks.outputs.py_code }}
          TEST_CODE: ${{ steps.checks.outputs.test_code }}
          LOOP_CODE: ${{ steps.looptest.outputs.loop_code }}
          JOB_ID: ${{ steps.start.outputs.job_id }}
          TARGET: ${{ steps.start.outputs.target }}
          REACHED: ${{ steps.state.outputs.reached }}
          TERMINAL: ${{ steps.state.outputs.terminal }}
          OBSERVED: ${{ steps.state.outputs.observed }}
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-usb-resume-retry
          start_epoch=$(cat "$work/start-epoch" 2>/dev/null || echo 0)
          sudo cat /var/lib/etr-core/sd-factory-state.json > "$work/state.json" 2>/dev/null || printf '{}\n' > "$work/state.json"
          sudo cat /var/lib/etr-core/sd-factory-rsync.log > "$work/rsync.log" 2>/dev/null || : > "$work/rsync.log"
          sudo systemctl show etr-sd-factory-worker.service -p MainPID -p ActiveState -p SubState -p Result > "$work/worker.txt" 2>&1 || true
          sudo journalctl -u etr-sd-factory-worker.service --since "@${start_epoch}" --no-pager > "$work/journal.txt" 2>&1 || true
          sudo journalctl -k --since "@${start_epoch}" --no-pager > "$work/kernel.txt" 2>&1 || true
          lsusb > "$work/lsusb-after.txt" || true
          lsusb -t > "$work/lsusb-tree-after.txt" || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > "$work/lsblk-after.txt"

          python3 - <<'PY' > /tmp/etr-sd-usb-resume-deploy.json
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          base=Path('/tmp/etr-sd-usb-resume-retry')
          def data(name):
              try:return json.loads((base/name).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(name,limit=30000):
              try:return (base/name).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          kernel=text('kernel.txt')
          state=data('state.json')
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'installedCommit':text('installed-commit.txt').strip() or None,
              'pythonCompileExit':int(os.getenv('PY_CODE') or 999),
              'unitTestsExit':int(os.getenv('TEST_CODE') or 999),
              'loopRecoveryExit':int(os.getenv('LOOP_CODE') or 999),
              'loopRecoveryTestPassed':os.getenv('LOOP_CODE') == '0',
              'jobId':os.getenv('JOB_ID') or None,
              'target':os.getenv('TARGET') or None,
              'writePhaseReached':os.getenv('REACHED') == 'true',
              'terminalBeforeWrite':os.getenv('TERMINAL') == 'true',
              'observedStatus':os.getenv('OBSERVED') or state.get('status'),
              'state':state,
              'capacityResetDetected':bool(re.search(r'capacity change from .* to 0|access beyond end of device',kernel,re.I)),
              'ioErrorDetected':bool(re.search(r'I/O error|Input/output error|Buffer I/O error',kernel,re.I)),
              'factoryFiles':text('factory-files.txt'),
              'pycompile':text('pycompile.txt'),
              'tests':text('tests.txt'),
              'loopRecovery':text('loop-recovery.txt'),
              'statusHistory':text('status-history.txt'),
              'reader':text('reader.txt'),
              'worker':text('worker.txt'),
              'journal':text('journal.txt'),
              'kernel':kernel,
              'rsyncLogTail':text('rsync.log'),
              'lsusbBefore':text('lsusb-before.txt'),
              'lsusbAfter':text('lsusb-after.txt'),
              'lsusbTreeAfter':text('lsusb-tree-after.txt'),
              'lsblkBefore':text('lsblk-before.txt'),
              'lsblkAfter':text('lsblk-after.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-usb-resume-deploy.json

          rm -rf /tmp/etr-sd-usb-resume-retry-report
          git clone --depth 1 --branch "$REPORT_BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-usb-resume-retry-report
          cd /tmp/etr-sd-usb-resume-retry-report
          mkdir -p .github/deployment
          cp /tmp/etr-sd-usb-resume-deploy.json .github/deployment/etr-sd-usb-resume-deploy.json
          rm -f .github/workflows/etr-sd-usb-resume-retry-once.yml
          git config user.name 'EtR SD USB resume retry deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-usb-resume-deploy.json .github/workflows/etr-sd-usb-resume-retry-once.yml
          git commit -m 'chore: record detailed SD USB resume deployment [skip ci]'
          git pull --rebase origin "$REPORT_BRANCH"
          git push origin HEAD:"$REPORT_BRANCH"

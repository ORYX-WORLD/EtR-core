name: Déployer le parcours Wi-Fi EtR
# Déploiement physique révision 7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-deploy.yml
      - src/wifi_portal.py
      - src/remote_screen_agent.py
      - src/firebase_bridge.py
      - gateway/**
      - src/deploy/raspi/**
      - requirements.txt

concurrency:
  group: etr-physical-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: Installer sur le Raspberry EtR
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 35

    steps:
      - name: Préparer le dépôt de suivi
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Vérifier l'agent et les droits
        shell: bash
        run: |
          set -euo pipefail
          echo "Hôte : $(hostname)"
          echo "Utilisateur : $(whoami)"
          uname -a
          sudo -n true
          id oryx

      - name: Actualiser le code installé
        shell: bash
        run: |
          set -euo pipefail
          install_dir=/home/oryx/EtR-core
          repo_url=https://github.com/ORYX-WORLD/EtR-core.git

          if [ ! -d "$install_dir/.git" ]; then
            sudo -u oryx -H git clone "$repo_url" "$install_dir"
          else
            sudo -u oryx -H git -C "$install_dir" remote set-url origin "$repo_url"
            if [ -n "$(sudo -u oryx -H git -C "$install_dir" status --porcelain)" ]; then
              sudo -u oryx -H git -C "$install_dir" stash push --include-untracked -m "Sauvegarde automatique avant déploiement $(date -u +%Y%m%dT%H%M%SZ)"
            fi
            sudo -u oryx -H git -C "$install_dir" fetch origin main
            sudo -u oryx -H git -C "$install_dir" checkout main
            sudo -u oryx -H git -C "$install_dir" pull --ff-only origin main
          fi

      - name: Installer le portail Wi-Fi tactile
        shell: bash
        run: |
          set -euo pipefail
          sudo -u oryx -H bash /home/oryx/EtR-core/src/deploy/raspi/setup_etr.sh

      - name: Vérifier le fonctionnement
        shell: bash
        run: |
          set -euo pipefail
          for service in etr.service etr-wifi-portal.service spi-desktop.service etr-kiosk.service; do
            for attempt in $(seq 1 60); do
              if sudo systemctl is-active --quiet "$service"; then
                break
              fi
              sleep 2
            done
            sudo systemctl is-active --quiet "$service"
            echo "$service : actif"
          done

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8090/api/status > /tmp/etr-wifi-status.json; then
              break
            fi
            sleep 2
          done
          test -s /tmp/etr-wifi-status.json
          python3 -m json.tool /tmp/etr-wifi-status.json
          curl -fsS http://127.0.0.1:8090/ | grep -q "Connecter cet EtR"
          echo "Portail Wi-Fi tactile : opérationnel"

          if grep -q '^ETR_REMOTE_GATEWAY_WSS=.' /etc/etr-core/firebase-bridge.env 2>/dev/null; then
            for service in etr-vnc.service etr-remote-screen.service; do
              sudo systemctl is-active --quiet "$service"
              echo "$service : actif"
            done
            sudo ss -ltnp | grep -q '127.0.0.1:5900'
            if sudo ss -ltnp | grep -qE '0\.0\.0\.0:5900|\[::\]:5900'; then
              echo "Le port VNC ne doit pas être exposé" >&2
              exit 1
            fi
            echo "Écran distant EtR : relais sortant opérationnel"
          else
            echo "Écran distant EtR : en attente de l'URL WSS de passerelle"
          fi

      - name: Publier le compte rendu
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p .github/deployment
          {
            echo "date_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "job_status=${{ job.status }}"
            echo "host=$(hostname)"
            echo "installed_commit=$(sudo -u oryx -H git -C /home/oryx/EtR-core rev-parse HEAD 2>/dev/null || echo unavailable)"
            for service in etr.service etr-wifi-portal.service spi-desktop.service etr-kiosk.service etr-vnc.service etr-remote-screen.service; do
              state=$(sudo systemctl show "$service" -p ActiveState -p SubState -p Result --no-pager 2>/dev/null | tr '\n' ',' | sed 's/,$//')
              echo "$service=$state"
            done
            echo "wifi_portal_http=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/ 2>/dev/null || echo 000)"
          } > .github/deployment/etr-last-deploy.txt

          git config user.name "EtR deployment agent"
          git config user.email "actions@users.noreply.github.com"
          git add .github/deployment/etr-last-deploy.txt
          git commit -m "chore: record EtR deployment result" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

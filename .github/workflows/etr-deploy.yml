name: Déployer l'application EtR complète
# Déploiement physique révision 15 - sans actions/checkout sur le runner Edge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-deploy.yml
      - src/**
      - dashboard/**
      - tests/**
      - requirements.txt

concurrency:
  group: etr-physical-deploy
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  deploy:
    name: Installer et vérifier sur le Raspberry EtR
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    env:
      ETR_INSTALL_DIR: /home/oryx/EtR-core
      ETR_GATEWAY_ORIGIN: https://etr-remote-gateway-7n72m5gopq-ew.a.run.app
      FIREBASE_DATABASE_URL: https://oryx-froid-industriel-default-rtdb.europe-west1.firebasedatabase.app
      ETR_REPORT_PATH: /tmp/etr-last-deploy.txt

    steps:
      - name: Vérifier l'agent et préparer la révision exacte sans workspace Actions
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true
          id oryx
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -d "$ETR_INSTALL_DIR/.git"
          sudo -u oryx -H git -C "$ETR_INSTALL_DIR" remote set-url origin \
            https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$ETR_INSTALL_DIR" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$ETR_INSTALL_DIR" stash push --include-untracked \
              -m "Sauvegarde avant déploiement $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$ETR_INSTALL_DIR" fetch --prune origin main
          sudo -u oryx -H git -C "$ETR_INSTALL_DIR" cat-file -e "${GITHUB_SHA}^{commit}"
          sudo -u oryx -H git -C "$ETR_INSTALL_DIR" checkout --detach "$GITHUB_SHA"
          [ "$(sudo -u oryx -H git -C "$ETR_INSTALL_DIR" rev-parse HEAD)" = "$GITHUB_SHA" ]

      - name: Installer et produire la preuve Edge complète
        shell: bash
        run: bash "$ETR_INSTALL_DIR/src/deploy/raspi/etr_physical_deploy.sh"

      - name: Publier la preuve depuis un clone temporaire isolé
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          script="$ETR_INSTALL_DIR/src/deploy/raspi/publish_physical_deploy_report.sh"
          if [ ! -x "$script" ]; then
            echo "::error::Script de publication de preuve absent"
            exit 1
          fi
          bash "$script"

name: Réparer immédiatement l'écran distant EtR

# Relance explicite après publication de la révision viewer OIDC 00019.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-remote-screen-repair-fast.yml
      - src/remote_screen_agent.py
      - src/remote_screen_identity.py
      - src/remote_screen_runtime.py
      - src/deploy/raspi/repair_remote_screen.sh
      - src/deploy/raspi/etr-remote-screen.service

concurrency:
  group: etr-remote-screen-repair-fast
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    name: Réinstaller le relais et prouver la connexion WSS
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 12
    env:
      GATEWAY_URL: https://etr-remote-gateway-7n72m5gopq-ew.a.run.app

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Actualiser le dépôt installé
        shell: bash
        run: |
          set -euo pipefail
          install_dir=/home/oryx/EtR-core
          sudo -u oryx -H git -C "$install_dir" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$install_dir" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$install_dir" stash push --include-untracked -m "Sauvegarde avant réparation écran $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$install_dir" fetch origin main
          sudo -u oryx -H git -C "$install_dir" checkout main
          sudo -u oryx -H git -C "$install_dir" pull --ff-only origin main

      - name: Vérifier que la passerelle applicative répond
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          mkdir -p /tmp/etr-screen-fast
          for attempt in $(seq 1 60); do
            status=$(curl -sS -o /tmp/etr-screen-fast/admin.json -w '%{http_code}' \
              "$GATEWAY_URL/api/admin/session" || echo 000)
            if [ "$status" = "401" ] && python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-screen-fast/admin.json', encoding='utf-8'))
          assert data.get('code') == 'auth/id-token-missing'
          PY
            then
              ready=true
              break
            fi
            sleep 2
          done
          [ "$ready" = true ] || { cat /tmp/etr-screen-fast/admin.json 2>/dev/null || true; exit 1; }

      - name: Réparer l'identité et les unités du Raspberry
        id: repair
        shell: bash
        run: |
          set +e
          start_epoch=$(date +%s)
          echo "start_epoch=$start_epoch" >> "$GITHUB_OUTPUT"
          bash /home/oryx/EtR-core/src/deploy/raspi/repair_remote_screen.sh \
            > /tmp/etr-screen-fast/repair.stdout \
            2> /tmp/etr-screen-fast/repair.stderr
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/etr-screen-fast/repair.stdout || true
          cat /tmp/etr-screen-fast/repair.stderr >&2 || true
          output=$(cat /tmp/etr-screen-fast/repair.stdout 2>/dev/null || true)
          installation_id=$(sed -n 's/^ETR_INSTALLATION_ID=//p' <<<"$output" | tail -n 1)
          echo "installation_id=$installation_id" >> "$GITHUB_OUTPUT"
          [ "$code" = "0" ] || {
            echo "::error::La réparation écran a échoué avec le code $code"
            exit "$code"
          }
          [[ "$installation_id" =~ ^[A-Za-z0-9._-]{2,80}$ ]] || {
            echo "::error::Identité EtR invalide : $installation_id"
            exit 1
          }

      - name: Vérifier VNC et attendre la connexion WSS
        id: verify
        shell: bash
        env:
          INSTALLATION_ID: ${{ steps.repair.outputs.installation_id }}
          START_EPOCH: ${{ steps.repair.outputs.start_epoch }}
        run: |
          set -euo pipefail
          for service in etr-vnc.service etr-remote-screen.service; do
            ready=false
            for attempt in $(seq 1 45); do
              if sudo systemctl is-active --quiet "$service"; then
                ready=true
                break
              fi
              sleep 2
            done
            [ "$ready" = true ] || {
              sudo systemctl status "$service" --no-pager -l || true
              exit 1
            }
          done
          sudo ss -H -ltnp | grep -qE '(127\.0\.0\.1|\[::1\]):5901'
          ! sudo ss -H -ltnp | grep -qE '(0\.0\.0\.0|\[::\]):5901'
          nc -z -w 3 127.0.0.1 5901
          connected=false
          for attempt in $(seq 1 90); do
            journal=$(sudo journalctl -u etr-remote-screen.service --since "@${START_EPOCH}" --no-pager 2>/dev/null || true)
            if grep -Fq "Installation $INSTALLATION_ID connected to the remote gateway" <<<"$journal"; then
              connected=true
              break
            fi
            sleep 2
          done
          echo "connected=$connected" >> "$GITHUB_OUTPUT"
          if [ "$connected" != true ]; then
            sudo journalctl -u etr-remote-screen.service --since "@${START_EPOCH}" --no-pager || true
            exit 1
          fi
          journal=$(sudo journalctl -u etr-remote-screen.service --since "@${START_EPOCH}" --no-pager)
          ! grep -Fq 'server rejected WebSocket connection: HTTP 500' <<<"$journal"
          curl -fsS "$GATEWAY_URL/api/health" > /tmp/etr-screen-fast/gateway-health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-screen-fast/gateway-health.json', encoding='utf-8'))
          assert int(data.get('devices', 0)) >= 1
          PY

      - name: Publier la preuve
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          INSTALLATION_ID: ${{ steps.repair.outputs.installation_id }}
          REPAIR_EXIT_CODE: ${{ steps.repair.outputs.exit_code }}
          CONNECTED: ${{ steps.verify.outputs.connected }}
          START_EPOCH: ${{ steps.repair.outputs.start_epoch }}
        run: |
          set +e
          mkdir -p /tmp/etr-screen-fast
          sudo journalctl -u etr-remote-screen.service --since "@${START_EPOCH:-0}" --no-pager \
            | sed -E 's/(Bearer |idToken|refreshToken)[^ ]+/<secret-masque>/g' \
            > /tmp/etr-screen-fast/journal.txt
          python3 - <<'PY' > /tmp/etr-remote-screen-fast-last.json
          import json, os, re, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          def command(args):
              try:return subprocess.run(args,check=False,capture_output=True,text=True,timeout=8).stdout.strip()
              except Exception:return ''
          def safe(path, limit=12000):
              try:value=Path(path).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
              value=re.sub(r'(?i)(idToken|refreshToken|FIREBASE_API_KEY)=\S+',r'\1=<secret-masque>',value)
              value=re.sub(r'(?i)Bearer\s+\S+','Bearer <secret-masque>',value)
              return value
          try: health=json.loads(Path('/tmp/etr-screen-fast/gateway-health.json').read_text(encoding='utf-8'))
          except Exception: health={}
          report={
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'host':command(['hostname']),
              'installedCommit':command(['sudo','-u','oryx','-H','git','-C','/home/oryx/EtR-core','rev-parse','HEAD']) or None,
              'installationId':os.getenv('INSTALLATION_ID') or None,
              'repairExitCode':int(os.getenv('REPAIR_EXIT_CODE') or 999),
              'connected':os.getenv('CONNECTED') == 'true',
              'gatewayUrl':os.getenv('GATEWAY_URL'),
              'gatewayHealth':health,
              'firebaseBridgeService':command(['systemctl','is-active','etr-firebase-bridge.service']),
              'remoteScreenService':command(['systemctl','is-active','etr-remote-screen.service']),
              'vncService':command(['systemctl','is-active','etr-vnc.service']),
              'repairStdout':safe('/tmp/etr-screen-fast/repair.stdout'),
              'repairStderr':safe('/tmp/etr-screen-fast/repair.stderr'),
              'journal':safe('/tmp/etr-screen-fast/journal.txt'),
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-remote-screen-fast-last.json
          git fetch origin main
          git checkout -B remote-fast-report origin/main
          mkdir -p .github/deployment
          cp /tmp/etr-remote-screen-fast-last.json .github/deployment/etr-remote-screen-fast-last.json
          git config user.name "EtR remote screen fast repair"
          git config user.email "actions@users.noreply.github.com"
          git add .github/deployment/etr-remote-screen-fast-last.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record EtR remote screen fast repair [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

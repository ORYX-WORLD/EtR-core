name: EtR - gateway health probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/etr-gateway-health-now.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe EtR gateway health
        shell: bash
        run: |
          set -euo pipefail
          url='https://etr-remote-gateway-7n72m5gopq-ew.a.run.app/api/health'
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$url" | tee /tmp/health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data.get('ok') is True
          print('service=', data.get('service'))
          print('revision=', data.get('revision'))
          print('devices=', data.get('devices'))
          print('viewers=', data.get('viewers'))
          PY

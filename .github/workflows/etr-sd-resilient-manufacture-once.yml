name: Fabriquer une microSD EtR avec reprise USB complète

on:
  push:
    branches:
      - ops/validate-sd-resilient-manufacture
    paths:
      - .github/workflows/etr-sd-resilient-manufacture-once.yml

concurrency:
  group: etr-sd-resilient-manufacture
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manufacture:
    name: Effacer, formater, écrire, reprendre et vérifier
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 120
    env:
      REPO: /home/oryx/EtR-core
      REPORT_BRANCH: ops/validate-sd-resilient-manufacture
      EXPECTED_SIZE: "31268536320"

    steps:
      - name: Préparer les preuves sans interrompre une fabrication active
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-resilient-manufacture
          rm -rf "$work"
          mkdir -p "$work/pycache"
          date +%s > "$work/start-epoch"
          lsusb > "$work/lsusb-before.txt" || true
          lsusb -t > "$work/lsusb-tree-before.txt" || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > "$work/lsblk-before.txt"

          active=$(sudo systemctl show -p ActiveState --value etr-sd-factory-worker.service 2>/dev/null || echo inactive)
          printf '%s\n' "$active" > "$work/worker-before.txt"
          if [[ "$active" =~ ^(active|activating|reloading|deactivating)$ ]]; then
            echo "::error::Une fabrication microSD est déjà active ($active). Aucun arrêt forcé."
            exit 1
          fi
          sudo systemctl stop etr-sd-factory.service 2>/dev/null || true
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true

      - name: Actualiser le Raspberry sur la version fusionnée
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-resilient-manufacture
          sudo -u oryx -H git -C "$REPO" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$REPO" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$REPO" stash push --include-untracked \
              -m "Sauvegarde avant fabrication microSD résiliente $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$REPO" fetch origin main
          sudo -u oryx -H git -C "$REPO" checkout main
          sudo -u oryx -H git -C "$REPO" reset --hard origin/main
          sudo -u oryx -H git -C "$REPO" rev-parse HEAD > "$work/installed-commit.txt"

      - name: Vérifier la syntaxe et les contrats microSD localement
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-resilient-manufacture
          cd "$REPO"
          PYTHONPYCACHEPREFIX="$work/pycache" python3 -m py_compile \
            src/deploy/raspi/etr_sd_factory_fast.py \
            src/deploy/raspi/etr_sd_factory_state.py \
            src/deploy/raspi/etr_sd_factory_usb_resume.py \
            src/deploy/raspi/etr_sd_factory_preparation_recovery.py \
            src/deploy/raspi/etr_sd_factory_worker.py \
            > "$work/pycompile.txt" 2>&1
          PYTHONDONTWRITEBYTECODE=1 "$REPO/.venv/bin/python" -m unittest discover \
            -s tests -p 'test_sd_factory*.py' -v > "$work/tests.txt" 2>&1
          cat "$work/tests.txt"

      - name: Installer uniquement les services de la fabrique résiliente
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-cleanup.sh" /usr/local/bin/etr-sd-factory-cleanup
          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-launch.sh" /usr/local/bin/etr-sd-factory-launch.sh
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory-worker.service" /etc/systemd/system/etr-sd-factory-worker.service
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory.service" /etc/systemd/system/etr-sd-factory.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true
          systemd-analyze verify /etc/systemd/system/etr-sd-factory-worker.service /etc/systemd/system/etr-sd-factory.service
          sudo systemctl restart etr-sd-factory.service

      - name: Récupérer le lecteur sur le même port bleu avant le départ
        id: reader
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-resilient-manufacture
          source "$HOME/.profile" 2>/dev/null || true
          sudo env PYTHONPATH="$REPO" PYTHONDONTWRITEBYTECODE=1 \
            EXPECTED_SIZE="$EXPECTED_SIZE" \
            "$REPO/.venv/bin/python" - <<'PY' > "$work/reader-recovery.txt" 2>&1
          import json
          import os
          import re
          from pathlib import Path

          from src.deploy.raspi.etr_sd_factory_preparation_recovery import (
              PhysicalTargetIdentity,
              inspect_physical_target,
              recover_physical_target,
              target_capacity_matches,
          )

          expected = int(os.environ['EXPECTED_SIZE'])

          def read(path: Path) -> str:
              try:
                  return path.read_text(encoding='ascii', errors='ignore').strip()
              except OSError:
                  return ''

          def size(path: str) -> int:
              import subprocess
              result = subprocess.run(
                  ['/usr/sbin/blockdev', '--getsize64', path],
                  text=True, capture_output=True, check=False, timeout=5,
              )
              value = result.stdout.strip()
              return int(value) if value.isdigit() else 0

          candidates = []
          for entry in sorted(Path('/sys/class/block').glob('sd*')):
              if not re.fullmatch(r'sd[a-z]+', entry.name):
                  continue
              path = f'/dev/{entry.name}'
              if size(path) == expected:
                  candidates.append(path)

          messages = []
          if len(candidates) == 1:
              identity = inspect_physical_target(candidates[0], expected_size=expected)
              recovered = candidates[0]
              if not target_capacity_matches(identity, recovered):
                  recovered = recover_physical_target(
                      identity,
                      progress=lambda value: (messages.append(value), print(value, flush=True)),
                      attempt=1,
                      maximum=2,
                      timeout_seconds=90,
                      stable_seconds=5,
                  )
          else:
              usb_nodes = []
              for node in Path('/sys/bus/usb/devices').glob('*'):
                  vid = read(node / 'idVendor').lower()
                  pid = read(node / 'idProduct').lower()
                  if (vid, pid) in {('14cd', '1212'), ('1908', '0226')}:
                      usb_nodes.append((node, vid, pid))
              if len(usb_nodes) != 1:
                  raise SystemExit(
                      f'Lecteur microSD ambigu ou absent : nodes={[(n.name,v,p) for n,v,p in usb_nodes]}, '
                      f'candidates={candidates}'
                  )
              node, vid, pid = usb_nodes[0]
              identity = PhysicalTargetIdentity(
                  disk_path='/dev/sda',
                  disk_size=expected,
                  usb_node=node.name,
                  vendor_id=vid,
                  product_id=pid,
                  serial=read(node / 'serial'),
                  model='USB microSD reader',
              )
              recovered = recover_physical_target(
                  identity,
                  progress=lambda value: (messages.append(value), print(value, flush=True)),
                  attempt=1,
                  maximum=2,
                  timeout_seconds=90,
                  stable_seconds=5,
              )

          verified = inspect_physical_target(recovered, expected_size=expected)
          if not target_capacity_matches(verified, recovered):
              raise SystemExit('Le lecteur est revenu mais sa capacité reste instable')
          result = {
              'path': recovered,
              'size': verified.disk_size,
              'usbNode': verified.usb_node,
              'vendorId': verified.vendor_id,
              'productId': verified.product_id,
              'serial': verified.serial,
              'messages': messages,
          }
          print('RESULT_JSON=' + json.dumps(result, ensure_ascii=False), flush=True)
          PY
          cat "$work/reader-recovery.txt"
          grep '^RESULT_JSON=' "$work/reader-recovery.txt" | tail -n1 | sed 's/^RESULT_JSON=//' > "$work/reader.json"
          target=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-resilient-manufacture/reader.json"))["path"])')
          [ "$(sudo blockdev --getsize64 "$target")" = "$EXPECTED_SIZE" ]
          echo "target=$target" >> "$GITHUB_OUTPUT"
          lsusb > "$work/lsusb-ready.txt" || true
          lsusb -t > "$work/lsusb-tree-ready.txt" || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > "$work/lsblk-ready.txt"

      - name: Créer un nouveau travail et démarrer le moteur
        id: start
        shell: bash
        env:
          TARGET: ${{ steps.reader.outputs.target }}
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-resilient-manufacture
          sudo systemctl stop etr-sd-factory-worker.service 2>/dev/null || true
          sudo sync
          sudo rm -rf /run/etr-sd-factory/job-* /run/etr-sd-factory/repo-snapshot-*
          sudo rm -f /var/lib/etr-core/sd-factory-request.json \
                       /var/lib/etr-core/sd-factory-state.json \
                       /var/lib/etr-core/sd-factory-rsync.log
          cd "$REPO"
          sudo .venv/bin/python - "$TARGET" <<'PY' > /tmp/etr-sd-resilient-manufacture/request.json
          import json
          import sys
          import uuid
          from src.deploy.raspi import etr_sd_factory_core as core
          from src.deploy.raspi.etr_sd_factory_state import write_request

          target = sys.argv[1]
          devices = core.lsblk_data()
          source = core.source_disk(devices)
          matches = [
              disk for disk in core.candidate_disks(devices, source)
              if disk.path == target and disk.size == 31268536320
          ]
          if len(matches) != 1:
              raise SystemExit(
                  'La cible a changé avant le lancement : '
                  + repr([(d.path, d.size, d.transport, d.removable) for d in core.candidate_disks(devices, source)])
              )
          disk = matches[0]
          request = {
              'job_id': str(uuid.uuid4()),
              'device': disk.path,
              'disk_label': disk.label,
              'size_bytes': disk.size,
              'copy_wifi': bool(core.active_wifi_profile()),
          }
          write_request(request)
          print(json.dumps(request, ensure_ascii=False, indent=2))
          PY
          job_id=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-resilient-manufacture/request.json"))["job_id"])')
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          sudo systemctl reset-failed etr-sd-factory-worker.service 2>/dev/null || true
          sudo systemctl start --no-block etr-sd-factory-worker.service

      - name: Suivre exactement ce travail jusqu'au résultat final
        id: monitor
        shell: bash
        env:
          EXPECTED_JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-resilient-manufacture
          : > "$work/status-history.txt"
          terminal=false
          final_status=""
          saw_precopy_pause=false
          saw_precopy_restart=false
          saw_copy=false
          saw_copy_pause=false
          saw_fsck=false
          saw_copy_resume=false

          for attempt in $(seq 1 1320); do
            service=$(sudo systemctl show -p ActiveState --value etr-sd-factory-worker.service 2>/dev/null || echo unknown)
            if sudo test -s /var/lib/etr-core/sd-factory-state.json; then
              sudo cat /var/lib/etr-core/sd-factory-state.json > "$work/state.json"
              job=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-resilient-manufacture/state.json")).get("job_id", ""))')
              status=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-resilient-manufacture/state.json")).get("status", ""))')
              progress=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-resilient-manufacture/state.json")).get("progress_percent", ""))')
              printf '%s service=%s job=%s status=%s progress=%s\n' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$service" "$job" "$status" "$progress" \
                >> "$work/status-history.txt"
              if [ "$job" = "$EXPECTED_JOB_ID" ]; then
                case "$status" in
                  paused_usb_setup) saw_precopy_pause=true ;;
                  restarting_preparation) saw_precopy_restart=true ;;
                  copying_root|copying_boot|configuring|verifying|syncing|finalizing|ready) saw_copy=true ;;
                  paused_usb) saw_copy_pause=true ;;
                  checking_filesystem) saw_fsck=true ;;
                  resuming_copy) saw_copy_resume=true ;;
                  ready|failed|cancelled|interrupted)
                    terminal=true
                    final_status="$status"
                    break
                    ;;
                esac
              fi
            fi
            sleep 5
          done

          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          echo "final_status=$final_status" >> "$GITHUB_OUTPUT"
          echo "saw_precopy_pause=$saw_precopy_pause" >> "$GITHUB_OUTPUT"
          echo "saw_precopy_restart=$saw_precopy_restart" >> "$GITHUB_OUTPUT"
          echo "saw_copy=$saw_copy" >> "$GITHUB_OUTPUT"
          echo "saw_copy_pause=$saw_copy_pause" >> "$GITHUB_OUTPUT"
          echo "saw_fsck=$saw_fsck" >> "$GITHUB_OUTPUT"
          echo "saw_copy_resume=$saw_copy_resume" >> "$GITHUB_OUTPUT"
          sudo cat /var/lib/etr-core/sd-factory-state.json 2>/dev/null || true
          [ "$terminal" = true ]

          if [ "$final_status" = ready ]; then
            python3 - <<'PY'
          import json
          state=json.load(open('/tmp/etr-sd-resilient-manufacture/state.json',encoding='utf-8'))
          assert state.get('verification') == 'passed', state
          assert state.get('ready_to_remove') is True, state
          assert state.get('safe_to_remove') is True, state
          PY
          else
            exit 1
          fi

      - name: Publier la preuve finale et retirer ce workflow ponctuel
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          JOB_ID: ${{ steps.start.outputs.job_id }}
          TARGET: ${{ steps.reader.outputs.target }}
          TERMINAL: ${{ steps.monitor.outputs.terminal }}
          FINAL_STATUS: ${{ steps.monitor.outputs.final_status }}
          SAW_PRECOPY_PAUSE: ${{ steps.monitor.outputs.saw_precopy_pause }}
          SAW_PRECOPY_RESTART: ${{ steps.monitor.outputs.saw_precopy_restart }}
          SAW_COPY: ${{ steps.monitor.outputs.saw_copy }}
          SAW_COPY_PAUSE: ${{ steps.monitor.outputs.saw_copy_pause }}
          SAW_FSCK: ${{ steps.monitor.outputs.saw_fsck }}
          SAW_COPY_RESUME: ${{ steps.monitor.outputs.saw_copy_resume }}
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-resilient-manufacture
          start_epoch=$(cat "$work/start-epoch" 2>/dev/null || echo 0)
          sudo cat /var/lib/etr-core/sd-factory-state.json > "$work/state.json" 2>/dev/null || printf '{}\n' > "$work/state.json"
          sudo cat /var/lib/etr-core/sd-factory-rsync.log > "$work/rsync.log" 2>/dev/null || : > "$work/rsync.log"
          sudo systemctl status etr-sd-factory-worker.service --no-pager -l > "$work/worker.txt" 2>&1 || true
          sudo journalctl -u etr-sd-factory-worker.service --since "@${start_epoch}" --no-pager > "$work/journal.txt" 2>&1 || true
          sudo journalctl -k --since "@${start_epoch}" --no-pager > "$work/kernel.txt" 2>&1 || true
          pgrep -af 'etr_sd_factory_worker|[r]sync.*/run/etr-sd-factory/' > "$work/processes.txt" || true
          lsusb > "$work/lsusb-after.txt" || true
          lsusb -t > "$work/lsusb-tree-after.txt" || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > "$work/lsblk-after.txt"

          python3 - <<'PY' > /tmp/etr-sd-resilient-manufacture.json
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          base=Path('/tmp/etr-sd-resilient-manufacture')
          def data(name):
              try:return json.loads((base/name).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(name,limit=50000):
              try:return (base/name).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          state=data('state.json')
          kernel=text('kernel.txt')
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'workflowStatus':os.getenv('JOB_STATUS'),
              'installedCommit':text('installed-commit.txt').strip() or None,
              'jobId':os.getenv('JOB_ID') or None,
              'target':os.getenv('TARGET') or None,
              'terminal':os.getenv('TERMINAL') == 'true',
              'finalStatus':os.getenv('FINAL_STATUS') or state.get('status'),
              'sawPrecopyPause':os.getenv('SAW_PRECOPY_PAUSE') == 'true',
              'sawPrecopyRestart':os.getenv('SAW_PRECOPY_RESTART') == 'true',
              'reachedCopy':os.getenv('SAW_COPY') == 'true',
              'sawCopyPause':os.getenv('SAW_COPY_PAUSE') == 'true',
              'sawFilesystemCheck':os.getenv('SAW_FSCK') == 'true',
              'sawCopyResume':os.getenv('SAW_COPY_RESUME') == 'true',
              'state':state,
              'capacityResetDetected':bool(re.search(r'capacity change from .* to 0|access beyond end of device',kernel,re.I)),
              'ioErrorDetected':bool(re.search(r'I/O error|Input/output error|Buffer I/O error|Device offlined',kernel,re.I)),
              'tests':text('tests.txt'),
              'statusHistory':text('status-history.txt'),
              'readerRecovery':text('reader-recovery.txt'),
              'reader':data('reader.json'),
              'request':data('request.json'),
              'worker':text('worker.txt'),
              'processes':text('processes.txt'),
              'journal':text('journal.txt'),
              'kernel':kernel,
              'rsyncLogTail':text('rsync.log'),
              'lsusbBefore':text('lsusb-before.txt'),
              'lsusbReady':text('lsusb-ready.txt'),
              'lsusbAfter':text('lsusb-after.txt'),
              'lsusbTreeAfter':text('lsusb-tree-after.txt'),
              'lsblkBefore':text('lsblk-before.txt'),
              'lsblkReady':text('lsblk-ready.txt'),
              'lsblkAfter':text('lsblk-after.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-resilient-manufacture.json

          rm -rf /tmp/etr-sd-resilient-report
          git clone --depth 1 --branch "$REPORT_BRANCH" \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/etr-sd-resilient-report
          cd /tmp/etr-sd-resilient-report
          mkdir -p .github/deployment
          cp /tmp/etr-sd-resilient-manufacture.json .github/deployment/etr-sd-resilient-manufacture.json
          rm -f .github/workflows/etr-sd-resilient-manufacture-once.yml
          git config user.name 'EtR resilient SD manufacture'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-resilient-manufacture.json \
                  .github/workflows/etr-sd-resilient-manufacture-once.yml
          git commit -m 'chore: record resilient SD manufacture [skip ci]'
          git pull --rebase origin "$REPORT_BRANCH"
          git push origin HEAD:"$REPORT_BRANCH"

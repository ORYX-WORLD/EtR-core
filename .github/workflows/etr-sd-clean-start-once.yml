name: Démarrer une fabrication microSD propre une seule fois

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-sd-clean-start-once.yml

concurrency:
  group: etr-sd-clean-start-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  start:
    name: Installer l'orchestrateur et relancer la carte
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 15
    steps:
      - name: Actualiser la version installée
        shell: bash
        run: |
          set -euo pipefail
          repo=/home/oryx/EtR-core
          sudo -u oryx -H git -C "$repo" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$repo" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$repo" stash push --include-untracked -m "Sauvegarde avant relance fabrique $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$repo" fetch origin main
          sudo -u oryx -H git -C "$repo" checkout main
          sudo -u oryx -H git -C "$repo" pull --ff-only origin main
          sudo -u oryx -H git -C "$repo" rev-parse HEAD

      - name: Installer le moteur persistant et nettoyer l'ancien essai
        shell: bash
        run: |
          set -euo pipefail
          repo=/home/oryx/EtR-core
          sudo systemctl disable --now etr-sd-factory-auto.service 2>/dev/null || true
          sudo systemctl stop etr-sd-factory.service etr-sd-factory-worker.service 2>/dev/null || true
          sudo sync
          findmnt -rn -o TARGET | awk '/^\/run\/etr-sd-factory\// {print length($0),$0}' | sort -rn | cut -d' ' -f2- | while read -r target; do
            sudo umount "$target" 2>/dev/null || sudo umount -l "$target" 2>/dev/null || true
          done
          for device in /dev/sda1 /dev/sda2; do
            if [ -b "$device" ] && findmnt -rn -S "$device" >/dev/null; then
              sudo umount "$device" 2>/dev/null || sudo umount -l "$device" 2>/dev/null || true
            fi
          done
          sudo rm -rf /run/etr-sd-factory/job-* /run/etr-sd-factory/repo-snapshot-*
          sudo install -m 755 "$repo/src/deploy/raspi/etr-sd-factory-cleanup.sh" /usr/local/bin/etr-sd-factory-cleanup
          sudo install -m 644 "$repo/src/deploy/raspi/etr-sd-factory-worker.service" /etc/systemd/system/etr-sd-factory-worker.service
          sudo install -m 644 "$repo/src/deploy/raspi/etr-sd-factory.service" /etc/systemd/system/etr-sd-factory.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true

      - name: Créer une demande unique pour la carte USB détectée
        id: request
        shell: bash
        run: |
          set -euo pipefail
          sudo /home/oryx/EtR-core/.venv/bin/python - <<'PY' > /tmp/etr-sd-clean-request.json
          import json, uuid
          from src.deploy.raspi import etr_sd_factory_core as core
          from src.deploy.raspi.etr_sd_factory_state import REQUEST_PATH, STATE_PATH, write_request

          devices=core.lsblk_data()
          source=core.source_disk(devices)
          candidates=core.candidate_disks(devices, source)
          if len(candidates) != 1:
              raise SystemExit(f'Une seule microSD USB est requise, détectées: {[d.path for d in candidates]}')
          disk=candidates[0]
          if disk.path != '/dev/sda':
              raise SystemExit(f'Cible inattendue: {disk.path}')
          if disk.size != 31268536320:
              raise SystemExit(f'Capacité inattendue pour la carte neuve: {disk.size}')
          STATE_PATH.unlink(missing_ok=True)
          REQUEST_PATH.unlink(missing_ok=True)
          payload={
              'job_id':str(uuid.uuid4()),
              'device':disk.path,
              'disk_label':disk.label,
              'size_bytes':disk.size,
              'copy_wifi':bool(core.active_wifi_profile()),
          }
          write_request(payload)
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY
          sudo cat /tmp/etr-sd-clean-request.json
          job_id=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-clean-request.json"))["job_id"])')
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Démarrer le moteur puis rattacher la fenêtre de suivi
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start etr-sd-factory-worker.service
          sudo systemctl restart etr-sd-factory.service
          state_ready=false
          for attempt in $(seq 1 90); do
            if sudo test -s /var/lib/etr-core/sd-factory-state.json; then
              sudo cp /var/lib/etr-core/sd-factory-state.json /tmp/etr-sd-clean-state.json
              if python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-sd-clean-state.json', encoding='utf-8'))
          expected={'validating','ticket','unmounting','partitioning','formatting','mounting','copying_root','copying_boot','configuring','verifying','syncing','finalizing','ready'}
          raise SystemExit(0 if data.get('status') in expected and data.get('status') not in {'failed','cancelled','interrupted'} else 1)
          PY
              then
                state_ready=true
                break
              fi
            fi
            sleep 1
          done
          echo "state_ready=$state_ready" >> "$GITHUB_OUTPUT"
          [ "$state_ready" = true ] || {
            sudo systemctl status etr-sd-factory-worker.service --no-pager -l || true
            sudo journalctl -u etr-sd-factory-worker.service -n 120 --no-pager || true
            sudo cat /var/lib/etr-core/sd-factory-state.json 2>/dev/null || true
            exit 1
          }
          sudo cat /var/lib/etr-core/sd-factory-state.json
          sudo systemctl status etr-sd-factory-worker.service --no-pager -l || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL

      - name: Publier la preuve et retirer ce workflow ponctuel
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
          STATE_READY: ${{ steps.engine.outputs.state_ready }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo cp /var/lib/etr-core/sd-factory-state.json /tmp/etr-sd-clean-state.json 2>/dev/null || printf '{}' > /tmp/etr-sd-clean-state.json
          sudo systemctl status etr-sd-factory-worker.service --no-pager -l > /tmp/etr-sd-clean-worker.txt 2>&1 || true
          sudo journalctl -u etr-sd-factory-worker.service -n 120 --no-pager > /tmp/etr-sd-clean-journal.txt 2>&1 || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-clean-lsblk.txt
          python3 - <<'PY' > /tmp/etr-sd-clean-start.json
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def text(path, limit=16000):
              try:return Path(path).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          try: state=json.loads(Path('/tmp/etr-sd-clean-state.json').read_text(encoding='utf-8'))
          except Exception: state={}
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'jobId':os.getenv('JOB_ID') or None,
              'stateReady':os.getenv('STATE_READY') == 'true',
              'state':state,
              'worker':text('/tmp/etr-sd-clean-worker.txt'),
              'journal':text('/tmp/etr-sd-clean-journal.txt'),
              'lsblk':text('/tmp/etr-sd-clean-lsblk.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-clean-start.json
          rm -rf /tmp/etr-sd-clean-report-repo
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-clean-report-repo
          cd /tmp/etr-sd-clean-report-repo
          mkdir -p .github/deployment
          cp /tmp/etr-sd-clean-start.json .github/deployment/etr-sd-clean-start.json
          rm -f .github/workflows/etr-sd-clean-start-once.yml
          git config user.name 'EtR SD clean start'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-clean-start.json .github/workflows/etr-sd-clean-start-once.yml
          git commit -m 'chore: record clean SD start and remove one-shot workflow [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

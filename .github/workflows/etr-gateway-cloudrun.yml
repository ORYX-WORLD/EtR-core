name: Tester et déployer la passerelle EtR

on:
  workflow_dispatch:
    inputs:
      region:
        description: Région Cloud Run
        required: false
        default: europe-west1
  pull_request:
    paths:
      - gateway/**
      - .github/workflows/etr-gateway-cloudrun.yml
  push:
    branches: [main]
    paths:
      - gateway/**
      - .github/workflows/etr-gateway-cloudrun.yml

concurrency:
  group: etr-gateway-cloudrun-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  id-token: write

jobs:
  test_and_deploy:
    name: Tester la passerelle et déployer après fusion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROJECT_ID: oryx-froid-industriel
      REGION: ${{ inputs.region || 'europe-west1' }}
      SERVICE_NAME: etr-remote-gateway

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Installer, construire et tester
        working-directory: gateway
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:novnc
          npm test
          node --check server.mjs
          node --check enrollment.mjs
          node --check enrollment-http.mjs
          node --check device-bootstrap.mjs
          grep -Fq '/api/enrollment/signing-health' enrollment-http.mjs
          grep -Fq 'auth.createCustomToken' enrollment-http.mjs

      - name: Construire et démarrer l'image Docker exacte
        working-directory: gateway
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t etr-gateway-ci:${GITHUB_SHA} .
          docker run --rm -d \
            --name etr-gateway-ci \
            -p 127.0.0.1:18080:8080 \
            -e FIREBASE_PROJECT_ID=oryx-froid-industriel \
            -e FIREBASE_DATABASE_URL=https://example-default-rtdb.europe-west1.firebasedatabase.app \
            -e ALLOWED_ORIGINS=https://oryx-froid-industriel.web.app \
            etr-gateway-ci:${GITHUB_SHA}
          cleanup() {
            docker logs etr-gateway-ci 2>&1 || true
            docker stop etr-gateway-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz > /tmp/etr-docker-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ] || { echo "::error::L'image Docker ne démarre pas"; exit 1; }
          python3 -m json.tool /tmp/etr-docker-health.json
          python3 -c 'import json; data=json.load(open("/tmp/etr-docker-health.json")); assert data.get("ok") is True; assert data.get("enrollment")=="v1"'
          for module in server.mjs firebase-token-verifier.mjs enrollment.mjs enrollment-http.mjs device-bootstrap.mjs; do
            docker exec etr-gateway-ci test -s "/app/${module}"
          done

      - name: Authentification Google Cloud
        id: google_auth
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Installer Google Cloud CLI
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v3

      - name: Construire et déployer
        id: deploy_gateway
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          test -n "${RUNTIME_SERVICE_ACCOUNT:-}"
          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            iamcredentials.googleapis.com \
            --project="$PROJECT_ID"
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --source=gateway \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=1 \
            --concurrency=80 \
            --timeout=3600 \
            --set-env-vars="ALLOWED_ORIGINS=https://oryx-froid-industriel.web.app,FIREBASE_PROJECT_ID=oryx-froid-industriel,FIREBASE_DATABASE_URL=https://oryx-froid-industriel-default-rtdb.europe-west1.firebasedatabase.app,ETR_GITHUB_REPOSITORY=ORYX-WORLD/EtR-core" \
            --quiet
          url=$(gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format='value(status.url)')
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Passerelle déployée : $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier les routes publiées
        id: verify_gateway
        if: github.event_name != 'pull_request' && steps.deploy_gateway.outcome == 'success'
        shell: bash
        env:
          GATEWAY_URL: ${{ steps.deploy_gateway.outputs.url }}
        run: |
          set -euo pipefail
          test -n "$GATEWAY_URL"
          mkdir -p /tmp/etr-gateway-check

          health_status=000
          for attempt in $(seq 1 18); do
            health_status=$(curl -sS -o /tmp/etr-gateway-check/health.json -w '%{http_code}' "$GATEWAY_URL/healthz" || echo 000)
            if [ "$health_status" = "200" ]; then break; fi
            sleep 5
          done
          echo "health_status=$health_status"
          cat /tmp/etr-gateway-check/health.json 2>/dev/null | python3 -m json.tool || cat /tmp/etr-gateway-check/health.json 2>/dev/null || true

          request_status=$(curl -sS -o /tmp/etr-gateway-check/request.json -w '%{http_code}' \
            -X POST "$GATEWAY_URL/api/enrollment/request" -H 'Content-Type: application/json' -d '{}' || echo 000)
          echo "request_status=$request_status"
          cat /tmp/etr-gateway-check/request.json 2>/dev/null | python3 -m json.tool || cat /tmp/etr-gateway-check/request.json 2>/dev/null || true

          bootstrap_status=$(curl -sS -o /tmp/etr-gateway-check/bootstrap.json -w '%{http_code}' \
            -X POST "$GATEWAY_URL/api/enrollment/bootstrap" -H 'Content-Type: application/json' -d '{}' || echo 000)
          echo "bootstrap_status=$bootstrap_status"
          cat /tmp/etr-gateway-check/bootstrap.json 2>/dev/null | python3 -m json.tool || cat /tmp/etr-gateway-check/bootstrap.json 2>/dev/null || true

          GATEWAY_URL="$GATEWAY_URL" \
          HEALTH_STATUS="$health_status" \
          REQUEST_STATUS="$request_status" \
          BOOTSTRAP_STATUS="$bootstrap_status" \
          python3 - <<'PY'
          import json, os
          def body(name):
              try:
                  return json.load(open(f'/tmp/etr-gateway-check/{name}.json', encoding='utf-8'))
              except Exception:
                  return None
          diagnostic={
              'url': os.environ['GATEWAY_URL'],
              'healthStatus': int(os.environ['HEALTH_STATUS']),
              'requestStatus': int(os.environ['REQUEST_STATUS']),
              'bootstrapStatus': int(os.environ['BOOTSTRAP_STATUS']),
              'healthBody': body('health'),
              'requestBody': body('request'),
              'bootstrapBody': body('bootstrap'),
          }
          json.dump(diagnostic, open('/tmp/etr-gateway-verification.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          health=diagnostic['healthBody'] or {}
          assert diagnostic['healthStatus']==200, diagnostic
          assert health.get('ok') is True and health.get('enrollment')=='v1', diagnostic
          assert diagnostic['requestStatus']==400, diagnostic
          assert diagnostic['bootstrapStatus']==401, diagnostic
          assert (diagnostic['bootstrapBody'] or {}).get('code')=='github_oidc_missing', diagnostic
          PY
          echo "url=$GATEWAY_URL" >> "$GITHUB_OUTPUT"

      - name: Vérifier la signature des identités techniques
        id: verify_signing
        if: github.event_name != 'pull_request' && steps.verify_gateway.outcome == 'success'
        shell: bash
        env:
          GATEWAY_URL: ${{ steps.deploy_gateway.outputs.url }}
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=etr-bootstrap"
          curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" > /tmp/etr-signing-oidc.json
          oidc_token=$(python3 -c 'import json; print(json.load(open("/tmp/etr-signing-oidc.json"))["value"])')
          rm -f /tmp/etr-signing-oidc.json
          test -n "$oidc_token"
          status=$(curl -sS -o /tmp/etr-signing-health.json -w '%{http_code}' \
            -X POST "${GATEWAY_URL}/api/enrollment/signing-health" \
            -H "Authorization: Bearer ${oidc_token}" \
            -H 'Content-Type: application/json' \
            -d '{}')
          unset oidc_token
          cat /tmp/etr-signing-health.json | python3 -m json.tool
          [ "$status" = "200" ] || { echo "::error::Signature Firebase impossible : HTTP $status"; exit 1; }
          python3 -c 'import json; data=json.load(open("/tmp/etr-signing-health.json")); assert data=={"ok":True,"signer":"firebase-admin","algorithm":"RS256"}'

      - name: Enregistrer la preuve du déploiement
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.google_auth.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_gateway.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_gateway.outcome }}
          SIGNING_OUTCOME: ${{ steps.verify_signing.outcome }}
          GATEWAY_URL: ${{ steps.deploy_gateway.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p .github/deployment
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          outcomes = {
              "authentication": os.getenv("AUTH_OUTCOME", "skipped"),
              "deploy": os.getenv("DEPLOY_OUTCOME", "skipped"),
              "verify": os.getenv("VERIFY_OUTCOME", "skipped"),
              "firebaseSigning": os.getenv("SIGNING_OUTCOME", "skipped"),
          }
          diagnostic=None
          try:
              diagnostic=json.load(open('/tmp/etr-gateway-verification.json', encoding='utf-8'))
          except Exception:
              pass
          report = {
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "commit": os.getenv("GITHUB_SHA"),
              "status": "success" if all(value == "success" for value in outcomes.values()) else "failure",
              "project": os.getenv("PROJECT_ID"),
              "region": os.getenv("REGION"),
              "service": os.getenv("SERVICE_NAME"),
              "url": os.getenv("GATEWAY_URL") or None,
              "enrollment": "v1",
              "deviceBootstrap": "github-oidc-ed25519",
              "customTokenSigning": outcomes["firebaseSigning"] == "success",
              "outcomes": outcomes,
              "verification": diagnostic,
          }
          with open(".github/deployment/gateway-last-deploy.json", "w", encoding="utf-8") as file:
              json.dump(report, file, ensure_ascii=False, indent=2)
              file.write("\n")
          print(json.dumps(report, ensure_ascii=False))
          PY
          git config user.name "EtR gateway deployment agent"
          git config user.email "actions@users.noreply.github.com"
          git add .github/deployment/gateway-last-deploy.json
          git commit -m "chore: record EtR gateway deployment [skip ci]" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

name: Tester et déployer la passerelle EtR

on:
  workflow_dispatch:
    inputs:
      region:
        description: Région Cloud Run
        required: false
        default: europe-west1
  pull_request:
    paths:
      - gateway/**
      - .github/workflows/etr-gateway-cloudrun.yml
  push:
    branches: [main]
    paths:
      - gateway/**
      - .github/workflows/etr-gateway-cloudrun.yml

concurrency:
  group: etr-gateway-cloudrun-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  id-token: write

jobs:
  test_and_deploy:
    name: Tester la passerelle et déployer après fusion
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PROJECT_ID: oryx-froid-industriel
      REGION: ${{ inputs.region || 'europe-west1' }}
      SERVICE_NAME: etr-remote-gateway

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Installer, construire et tester
        working-directory: gateway
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:novnc
          npm test
          node --check server.mjs
          node --check enrollment.mjs
          node --check enrollment-http.mjs
          node --check device-bootstrap.mjs
          node --check firebase-device-session.mjs
          node --check admin.mjs
          node --check cloud-run-state.mjs
          grep -Fq '/api/enrollment/session-health' enrollment-http.mjs
          grep -Fq 'createFirebaseDeviceSessionIssuer' enrollment-http.mjs
          grep -Fq '/api/admin/session' admin.mjs
          grep -Fq 'ETR_ADMIN_EMAILS' admin.mjs
          ! grep -Fq 'auth.createCustomToken' enrollment-http.mjs

      - name: Construire et démarrer l'image Docker exacte
        working-directory: gateway
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -t etr-gateway-ci:${GITHUB_SHA} .
          docker run --rm -d \
            --name etr-gateway-ci \
            -p 127.0.0.1:18080:8080 \
            -e FIREBASE_PROJECT_ID=oryx-froid-industriel \
            -e FIREBASE_DATABASE_URL=https://example-default-rtdb.europe-west1.firebasedatabase.app \
            -e FIREBASE_API_KEY=ci-public-firebase-api-key-1234567890 \
            -e ALLOWED_ORIGINS=https://oryx-froid-industriel.web.app \
            -e ETR_ADMIN_EMAILS=amotard.oryx@gmail.com \
            etr-gateway-ci:${GITHUB_SHA}
          cleanup() {
            docker logs etr-gateway-ci 2>&1 || true
            docker stop etr-gateway-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz > /tmp/etr-docker-health.json; then
              ready=true
              break
            fi
            sleep 1
          done
          [ "$ready" = true ] || { echo "::error::L'image Docker ne démarre pas"; exit 1; }
          python3 -m json.tool /tmp/etr-docker-health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-docker-health.json', encoding='utf-8'))
          assert data.get('ok') is True
          assert data.get('enrollment') == 'v1'
          assert data.get('admin') == 'v1'
          PY

          for module in server.mjs firebase-token-verifier.mjs enrollment.mjs enrollment-http.mjs device-bootstrap.mjs firebase-device-session.mjs admin.mjs; do
            docker exec etr-gateway-ci test -s "/app/${module}"
          done
          admin_status=$(curl -sS -o /tmp/etr-admin-anonymous.json -w '%{http_code}' \
            http://127.0.0.1:18080/api/admin/session)
          [ "$admin_status" = "401" ] || {
            cat /tmp/etr-admin-anonymous.json
            echo "::error::La route Admin doit refuser un appel anonyme"
            exit 1
          }

      - name: Authentification Google Cloud
        id: google_auth
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Installer Google Cloud CLI
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v3

      - name: Lire la configuration Firebase Hosting publique
        id: firebase_config
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          config_url=https://oryx-froid-industriel.web.app/__/firebase/init.json
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS "$config_url" \
            > /tmp/etr-firebase-init.json
          firebase_api_key=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-firebase-init.json', encoding='utf-8'))
          key=str(data.get('apiKey') or '').strip()
          project=str(data.get('projectId') or '').strip()
          if len(key) < 20 or len(key) > 200:
              raise SystemExit('apiKey Firebase absente ou invalide')
          if project != 'oryx-froid-industriel':
              raise SystemExit(f'Projet Firebase inattendu: {project}')
          print(key)
          PY
          )
          echo "::add-mask::$firebase_api_key"
          echo "api_key=$firebase_api_key" >> "$GITHUB_OUTPUT"
          rm -f /tmp/etr-firebase-init.json

      - name: Construire, déployer et router vers la dernière révision
        id: deploy_gateway
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          RUNTIME_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          FIREBASE_API_KEY: ${{ steps.firebase_config.outputs.api_key }}
          ETR_ADMIN_EMAILS: ${{ vars.ETR_ADMIN_EMAILS || 'amotard.oryx@gmail.com' }}
        run: |
          set -euo pipefail
          test -n "${RUNTIME_SERVICE_ACCOUNT:-}"
          test ${#FIREBASE_API_KEY} -ge 20
          test -n "${ETR_ADMIN_EMAILS:-}"

          gcloud services enable \
            run.googleapis.com \
            cloudbuild.googleapis.com \
            artifactregistry.googleapis.com \
            --project="$PROJECT_ID"

          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --source=gateway \
            --service-account="$RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --min-instances=1 \
            --max-instances=1 \
            --concurrency=80 \
            --timeout=3600 \
            --set-env-vars="ALLOWED_ORIGINS=https://oryx-froid-industriel.web.app,FIREBASE_PROJECT_ID=oryx-froid-industriel,FIREBASE_DATABASE_URL=https://oryx-froid-industriel-default-rtdb.europe-west1.firebasedatabase.app,FIREBASE_API_KEY=${FIREBASE_API_KEY},ETR_GITHUB_REPOSITORY=ORYX-WORLD/EtR-core,ETR_ADMIN_EMAILS=${ETR_ADMIN_EMAILS}" \
            --quiet

          gcloud run services update-traffic "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --to-latest \
            --quiet

          gcloud run services describe "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --format=json \
            > /tmp/etr-cloud-run-service.json
          node gateway/cloud-run-state.mjs /tmp/etr-cloud-run-service.json \
            > /tmp/etr-cloud-run-state.json
          cat /tmp/etr-cloud-run-state.json | python3 -m json.tool

          url=$(python3 -c 'import json; print(json.load(open("/tmp/etr-cloud-run-state.json"))["url"])')
          revision=$(python3 -c 'import json; print(json.load(open("/tmp/etr-cloud-run-state.json"))["revision"])')
          traffic_percent=$(python3 -c 'import json; print(json.load(open("/tmp/etr-cloud-run-state.json"))["trafficPercent"])')
          test -n "$url"
          test -n "$revision"
          [ "$traffic_percent" = "100" ]

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "traffic_percent=$traffic_percent" >> "$GITHUB_OUTPUT"
          echo "Passerelle déployée : $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Révision active à 100 % : $revision" >> "$GITHUB_STEP_SUMMARY"

      - name: Vérifier les routes publiées
        id: verify_gateway
        if: github.event_name != 'pull_request' && steps.deploy_gateway.outcome == 'success'
        shell: bash
        env:
          GATEWAY_URL: ${{ steps.deploy_gateway.outputs.url }}
          GATEWAY_REVISION: ${{ steps.deploy_gateway.outputs.revision }}
        run: |
          set -euo pipefail
          test -n "$GATEWAY_URL"
          test -n "$GATEWAY_REVISION"
          mkdir -p /tmp/etr-gateway-check

          health_status=000
          for attempt in $(seq 1 36); do
            health_status=$(curl -sS -o /tmp/etr-gateway-check/health.json -w '%{http_code}' \
              "$GATEWAY_URL/healthz" || echo 000)
            if [ "$health_status" = "200" ] && python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-gateway-check/health.json', encoding='utf-8'))
          assert data.get('ok') is True
          assert data.get('enrollment') == 'v1'
          assert data.get('admin') == 'v1'
          PY
            then
              break
            fi
            sleep 5
          done
          [ "$health_status" = "200" ] || {
            cat /tmp/etr-gateway-check/health.json 2>/dev/null || true
            echo "::error::La dernière révision Cloud Run ne publie pas /healthz"
            exit 1
          }

          request_status=$(curl -sS -o /tmp/etr-gateway-check/request.json -w '%{http_code}' \
            -X POST "$GATEWAY_URL/api/enrollment/request" \
            -H 'Content-Type: application/json' -d '{}' || echo 000)
          bootstrap_status=$(curl -sS -o /tmp/etr-gateway-check/bootstrap.json -w '%{http_code}' \
            -X POST "$GATEWAY_URL/api/enrollment/bootstrap" \
            -H 'Content-Type: application/json' -d '{}' || echo 000)
          admin_status=$(curl -sS -o /tmp/etr-gateway-check/admin.json -w '%{http_code}' \
            "$GATEWAY_URL/api/admin/session" || echo 000)

          echo "revision=$GATEWAY_REVISION"
          echo "health_status=$health_status"
          echo "request_status=$request_status"
          echo "bootstrap_status=$bootstrap_status"
          echo "admin_status=$admin_status"
          for file in health request bootstrap admin; do
            cat "/tmp/etr-gateway-check/${file}.json" 2>/dev/null \
              | python3 -m json.tool \
              || cat "/tmp/etr-gateway-check/${file}.json" 2>/dev/null \
              || true
          done

          GATEWAY_URL="$GATEWAY_URL" \
          GATEWAY_REVISION="$GATEWAY_REVISION" \
          HEALTH_STATUS="$health_status" \
          REQUEST_STATUS="$request_status" \
          BOOTSTRAP_STATUS="$bootstrap_status" \
          ADMIN_STATUS="$admin_status" \
          python3 - <<'PY'
          import json, os
          def body(name):
              try:
                  return json.load(open(f'/tmp/etr-gateway-check/{name}.json', encoding='utf-8'))
              except Exception:
                  return None
          diagnostic={
              'url': os.environ['GATEWAY_URL'],
              'revision': os.environ['GATEWAY_REVISION'],
              'serviceVerifiedBy': 'health-enrollment-and-admin-routes',
              'healthStatus': int(os.environ['HEALTH_STATUS']),
              'healthEndpointSupported': os.environ['HEALTH_STATUS']=='200',
              'requestStatus': int(os.environ['REQUEST_STATUS']),
              'bootstrapStatus': int(os.environ['BOOTSTRAP_STATUS']),
              'adminStatus': int(os.environ['ADMIN_STATUS']),
              'healthBody': body('health'),
              'requestBody': body('request'),
              'bootstrapBody': body('bootstrap'),
              'adminBody': body('admin'),
          }
          json.dump(diagnostic, open('/tmp/etr-gateway-verification.json','w',encoding='utf-8'), ensure_ascii=False, indent=2)
          assert diagnostic['healthStatus'] == 200, diagnostic
          assert (diagnostic['healthBody'] or {}).get('ok') is True, diagnostic
          assert (diagnostic['healthBody'] or {}).get('enrollment') == 'v1', diagnostic
          assert (diagnostic['healthBody'] or {}).get('admin') == 'v1', diagnostic
          assert diagnostic['requestStatus'] == 400, diagnostic
          assert (diagnostic['requestBody'] or {}).get('code') == 'invalid_serial', diagnostic
          assert diagnostic['bootstrapStatus'] == 401, diagnostic
          assert (diagnostic['bootstrapBody'] or {}).get('code') == 'github_oidc_missing', diagnostic
          assert diagnostic['adminStatus'] == 401, diagnostic
          assert (diagnostic['adminBody'] or {}).get('code') == 'auth/id-token-missing', diagnostic
          PY
          echo "url=$GATEWAY_URL" >> "$GITHUB_OUTPUT"

      - name: Vérifier l'émission d'une session Firebase appareil
        id: verify_session
        if: github.event_name != 'pull_request' && steps.verify_gateway.outcome == 'success'
        shell: bash
        env:
          GATEWAY_URL: ${{ steps.deploy_gateway.outputs.url }}
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=etr-bootstrap"
          curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" \
            > /tmp/etr-session-oidc.json
          oidc_token=$(python3 -c 'import json; print(json.load(open("/tmp/etr-session-oidc.json"))["value"])')
          rm -f /tmp/etr-session-oidc.json
          test -n "$oidc_token"
          status=$(curl -sS -o /tmp/etr-session-health.json -w '%{http_code}' \
            -X POST "${GATEWAY_URL}/api/enrollment/session-health" \
            -H "Authorization: Bearer ${oidc_token}" \
            -H 'Content-Type: application/json' \
            -d '{}')
          unset oidc_token
          cat /tmp/etr-session-health.json | python3 -m json.tool
          [ "$status" = "200" ] || {
            echo "::error::Émission de session Firebase impossible : HTTP $status"
            exit 1
          }
          python3 -c 'import json; data=json.load(open("/tmp/etr-session-health.json")); assert data=={"ok":True,"mode":"firebase-password-session","tokenExchange":True}'

      - name: Enregistrer la preuve du déploiement
        if: always() && github.event_name != 'pull_request'
        shell: bash
        env:
          AUTH_OUTCOME: ${{ steps.google_auth.outcome }}
          FIREBASE_CONFIG_OUTCOME: ${{ steps.firebase_config.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy_gateway.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_gateway.outcome }}
          SESSION_OUTCOME: ${{ steps.verify_session.outcome }}
          GATEWAY_URL: ${{ steps.deploy_gateway.outputs.url }}
          GATEWAY_REVISION: ${{ steps.deploy_gateway.outputs.revision }}
          TRAFFIC_PERCENT: ${{ steps.deploy_gateway.outputs.traffic_percent }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-gateway-proof
          python3 - <<'PY' > /tmp/etr-gateway-proof/gateway-last-deploy.json
          import json, os
          from datetime import datetime, timezone
          outcomes = {
              'authentication': os.getenv('AUTH_OUTCOME', 'skipped'),
              'firebaseConfig': os.getenv('FIREBASE_CONFIG_OUTCOME', 'skipped'),
              'deploy': os.getenv('DEPLOY_OUTCOME', 'skipped'),
              'verify': os.getenv('VERIFY_OUTCOME', 'skipped'),
              'firebaseSession': os.getenv('SESSION_OUTCOME', 'skipped'),
          }
          diagnostic=None
          try:
              diagnostic=json.load(open('/tmp/etr-gateway-verification.json', encoding='utf-8'))
          except Exception:
              pass
          report = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'commit': os.getenv('GITHUB_SHA'),
              'status': 'success' if all(value == 'success' for value in outcomes.values()) else 'failure',
              'project': os.getenv('PROJECT_ID'),
              'region': os.getenv('REGION'),
              'service': os.getenv('SERVICE_NAME'),
              'url': os.getenv('GATEWAY_URL') or None,
              'revision': os.getenv('GATEWAY_REVISION') or None,
              'trafficPercent': int(os.getenv('TRAFFIC_PERCENT') or 0),
              'enrollment': 'v1',
              'admin': 'v1',
              'adminRouteVerified': bool(diagnostic and diagnostic.get('adminStatus') == 401),
              'adminBootstrap': 'verified-email-allowlist',
              'deviceBootstrap': 'github-oidc-ed25519',
              'deviceSessionIssuance': outcomes['firebaseSession'] == 'success',
              'authMode': 'password_session',
              'customTokenSigning': False,
              'firebaseConfigSource': 'firebase-hosting-reserved-url',
              'outcomes': outcomes,
              'verification': diagnostic,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          cat /tmp/etr-gateway-proof/gateway-last-deploy.json

          git fetch origin main
          git checkout -B proof-gateway origin/main
          mkdir -p .github/deployment
          cp /tmp/etr-gateway-proof/gateway-last-deploy.json \
            .github/deployment/gateway-last-deploy.json
          git config user.name "EtR gateway deployment agent"
          git config user.email "actions@users.noreply.github.com"
          git add .github/deployment/gateway-last-deploy.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record EtR gateway deployment [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

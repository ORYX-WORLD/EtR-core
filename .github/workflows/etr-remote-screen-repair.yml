name: Réparer et valider l'écran distant EtR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gateway/**
      - src/remote_screen_agent.py
      - src/remote_screen_identity.py
      - src/remote_screen_runtime.py
      - src/deploy/raspi/etr-vnc.service
      - src/deploy/raspi/etr-remote-screen.service
      - src/deploy/raspi/repair_remote_screen.sh
      - .github/workflows/etr-remote-screen-repair.yml

# Compatibilité avec l'ancien nom de workflow. Le contrôle physique de référence
# est désormais le workflow rapide : il sonde une route applicative réellement
# servie, résout deviceAccess et n'immobilise pas le runner sur /healthz.
concurrency:
  group: etr-remote-screen-repair-physical
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  dispatch-fast-repair:
    name: Déclencher la réparation physique de référence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lancer le contrôle ARM64
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run etr-remote-screen-repair-fast.yml --ref main

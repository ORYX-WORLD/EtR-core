name: Suivre la fabrication microSD résiliente sans l'interrompre

on:
  push:
    branches:
      - ops/deploy-sd-usb-resume
    paths:
      - .github/workflows/etr-sd-usb-resume-monitor-once.yml

concurrency:
  group: etr-sd-usb-resume-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 30
    env:
      EXPECTED_JOB_ID: 15dc4b0b-1338-4b13-b975-0e8a33dd60dd
      REPORT_BRANCH: ops/deploy-sd-usb-resume

    steps:
      - name: Attendre que le moteur publie le nouvel état
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-usb-resume-monitor
          rm -rf "$work"
          mkdir -p "$work"
          date +%s > "$work/start-epoch"
          matched=false
          terminal=false
          observed=""
          : > "$work/history.txt"

          for attempt in $(seq 1 360); do
            service=$(sudo systemctl show -p ActiveState --value etr-sd-factory-worker.service 2>/dev/null || echo unknown)
            if sudo test -s /var/lib/etr-core/sd-factory-state.json; then
              sudo cat /var/lib/etr-core/sd-factory-state.json > "$work/state.json"
              job=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-usb-resume-monitor/state.json")).get("job_id", ""))')
              observed=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-usb-resume-monitor/state.json")).get("status", ""))')
              printf '%s service=%s job=%s status=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$service" "$job" "$observed" >> "$work/history.txt"
              if [ "$job" = "$EXPECTED_JOB_ID" ]; then
                matched=true
                case "$observed" in
                  ready|failed|cancelled|interrupted) terminal=true ;;
                esac
                break
              fi
            fi
            sleep 2
          done
          echo "matched=$matched" >> "$GITHUB_OUTPUT"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          echo "observed=$observed" >> "$GITHUB_OUTPUT"
          [ "$matched" = true ]

      - name: Mesurer la progression réelle pendant une minute
        if: steps.observe.outputs.matched == 'true' && steps.observe.outputs.terminal != 'true'
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-usb-resume-monitor
          for attempt in $(seq 1 12); do
            sleep 5
            service=$(sudo systemctl show -p ActiveState --value etr-sd-factory-worker.service 2>/dev/null || echo unknown)
            sudo cat /var/lib/etr-core/sd-factory-state.json > "$work/state.json"
            job=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-usb-resume-monitor/state.json")).get("job_id", ""))')
            status=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-usb-resume-monitor/state.json")).get("status", ""))')
            progress=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-usb-resume-monitor/state.json")).get("progress_percent", ""))')
            printf '%s service=%s job=%s status=%s progress=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$service" "$job" "$status" "$progress" >> "$work/history.txt"
            [ "$job" = "$EXPECTED_JOB_ID" ] || exit 1
            case "$status" in
              ready|failed|cancelled|interrupted) break ;;
            esac
          done

      - name: Publier l'état sans toucher au moteur
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          MATCHED: ${{ steps.observe.outputs.matched }}
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-usb-resume-monitor
          start_epoch=$(cat "$work/start-epoch" 2>/dev/null || echo 0)
          sudo cat /var/lib/etr-core/sd-factory-state.json > "$work/state.json" 2>/dev/null || printf '{}\n' > "$work/state.json"
          sudo cat /var/lib/etr-core/sd-factory-rsync.log > "$work/rsync.log" 2>/dev/null || : > "$work/rsync.log"
          sudo systemctl status etr-sd-factory-worker.service --no-pager -l > "$work/worker.txt" 2>&1 || true
          sudo journalctl -u etr-sd-factory-worker.service --since "@${start_epoch}" --no-pager > "$work/journal.txt" 2>&1 || true
          sudo journalctl -k --since "@${start_epoch}" --no-pager > "$work/kernel.txt" 2>&1 || true
          pgrep -af 'etr_sd_factory_worker|[r]sync.*/run/etr-sd-factory/' > "$work/processes.txt" || true
          lsusb > "$work/lsusb.txt" || true
          lsusb -t > "$work/lsusb-tree.txt" || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > "$work/lsblk.txt"

          python3 - <<'PY' > /tmp/etr-sd-usb-resume-live.json
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          base=Path('/tmp/etr-sd-usb-resume-monitor')
          def data(name):
              try:return json.loads((base/name).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(name,limit=30000):
              try:return (base/name).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          state=data('state.json')
          kernel=text('kernel.txt')
          history=text('history.txt')
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'monitorStatus':os.getenv('JOB_STATUS'),
              'expectedJobMatched':os.getenv('MATCHED') == 'true',
              'state':state,
              'progressObserved':history,
              'resumeStateObserved':bool(re.search(r'status=(paused_usb|checking_filesystem|resuming_copy)',history)),
              'capacityResetDetected':bool(re.search(r'capacity change from .* to 0|access beyond end of device',kernel,re.I)),
              'ioErrorDetected':bool(re.search(r'I/O error|Input/output error|Buffer I/O error',kernel,re.I)),
              'worker':text('worker.txt'),
              'processes':text('processes.txt'),
              'journal':text('journal.txt'),
              'kernel':kernel,
              'rsyncLogTail':text('rsync.log'),
              'lsusb':text('lsusb.txt'),
              'lsusbTree':text('lsusb-tree.txt'),
              'lsblk':text('lsblk.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-usb-resume-live.json

          rm -rf /tmp/etr-sd-usb-resume-monitor-report
          git clone --depth 1 --branch "$REPORT_BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-usb-resume-monitor-report
          cd /tmp/etr-sd-usb-resume-monitor-report
          mkdir -p .github/deployment
          cp /tmp/etr-sd-usb-resume-live.json .github/deployment/etr-sd-usb-resume-live.json
          rm -f .github/workflows/etr-sd-usb-resume-monitor-once.yml
          git config user.name 'EtR SD USB resume monitor'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-usb-resume-live.json .github/workflows/etr-sd-usb-resume-monitor-once.yml
          git commit -m 'chore: record live SD USB resume state [skip ci]'
          git pull --rebase origin "$REPORT_BRANCH"
          git push origin HEAD:"$REPORT_BRANCH"

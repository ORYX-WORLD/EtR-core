name: Relancer définitivement la fabrication microSD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-sd-final-restart-once.yml

concurrency:
  group: etr-sd-final-restart-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  restart:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 18
    steps:
      - name: Actualiser le dépôt installé
        shell: bash
        run: |
          set -euo pipefail
          repo=/home/oryx/EtR-core
          sudo -u oryx -H git -C "$repo" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$repo" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$repo" stash push --include-untracked -m "Sauvegarde avant fabrication finale $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$repo" fetch origin main
          sudo -u oryx -H git -C "$repo" checkout main
          sudo -u oryx -H git -C "$repo" pull --ff-only origin main
          sudo -u oryx -H git -C "$repo" rev-parse HEAD | tee /tmp/etr-sd-final-restart-commit.txt

      - name: Valider le snapshot sous l'identité oryx
        shell: bash
        run: |
          set -euo pipefail
          cd /home/oryx/EtR-core
          sudo .venv/bin/python -u - <<'PY' > /tmp/etr-sd-final-snapshot.txt 2>&1
          import shutil
          from src.deploy.raspi import etr_sd_factory_fast as fast
          snapshot=fast._repository_snapshot()
          try:
              assert (snapshot/'.git').is_dir()
              assert (snapshot/'src/deploy/raspi/etr_sd_factory_worker.py').is_file()
              print('snapshot=ok')
              print(snapshot)
          finally:
              shutil.rmtree(snapshot.parent, ignore_errors=True)
          PY
          cat /tmp/etr-sd-final-snapshot.txt

      - name: Installer et remettre à zéro uniquement la fabrique
        shell: bash
        run: |
          set -euo pipefail
          repo=/home/oryx/EtR-core
          sudo systemctl disable --now etr-sd-factory-auto.service 2>/dev/null || true
          sudo systemctl stop etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true
          sudo sync
          findmnt -rn -o TARGET | awk '/^\/run\/etr-sd-factory\/job-[^/]+\/(root|boot)$/ {print length($0),$0}' | sort -rn | cut -d' ' -f2- | while read -r target; do
            sudo umount "$target" 2>/dev/null || sudo umount -l "$target" 2>/dev/null || true
          done
          for device in /dev/sda1 /dev/sda2; do
            if [ -b "$device" ] && findmnt -rn -S "$device" >/dev/null; then
              sudo umount "$device" 2>/dev/null || sudo umount -l "$device" 2>/dev/null || true
            fi
          done
          sudo rm -rf /run/etr-sd-factory/job-* /run/etr-sd-factory/repo-snapshot-*
          sudo rm -f /var/lib/etr-core/sd-factory-request.json /var/lib/etr-core/sd-factory-state.json /var/lib/etr-core/sd-factory-rsync.log
          sudo install -m 755 "$repo/src/deploy/raspi/etr-sd-factory-cleanup.sh" /usr/local/bin/etr-sd-factory-cleanup
          sudo install -m 644 "$repo/src/deploy/raspi/etr-sd-factory-worker.service" /etc/systemd/system/etr-sd-factory-worker.service
          sudo install -m 644 "$repo/src/deploy/raspi/etr-sd-factory.service" /etc/systemd/system/etr-sd-factory.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true
          ! findmnt -rn -S /dev/sda1 >/dev/null
          ! findmnt -rn -S /dev/sda2 >/dev/null

      - name: Créer la demande contrôlée
        id: request
        shell: bash
        run: |
          set -euo pipefail
          cd /home/oryx/EtR-core
          sudo .venv/bin/python - <<'PY' > /tmp/etr-sd-final-request.json
          import json, uuid
          from src.deploy.raspi import etr_sd_factory_core as core
          from src.deploy.raspi.etr_sd_factory_state import write_request
          devices=core.lsblk_data()
          source=core.source_disk(devices)
          candidates=core.candidate_disks(devices, source)
          if len(candidates) != 1:
              raise SystemExit(f'Cible ambiguë: {[d.path for d in candidates]}')
          disk=candidates[0]
          if (disk.path, disk.size) != ('/dev/sda', 31268536320):
              raise SystemExit(f'Cible inattendue: {disk.path}, {disk.size}')
          request={
              'job_id':str(uuid.uuid4()),
              'device':disk.path,
              'disk_label':disk.label,
              'size_bytes':disk.size,
              'copy_wifi':bool(core.active_wifi_profile()),
          }
          write_request(request)
          print(json.dumps(request,ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-final-request.json
          echo "job_id=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-final-request.json"))["job_id"])')" >> "$GITHUB_OUTPUT"

      - name: Lancer le moteur et rouvrir la fenêtre de suivi
        id: start
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start --no-block etr-sd-factory-worker.service
          sudo systemctl restart etr-sd-factory.service
          accepted=false
          for attempt in $(seq 1 120); do
            if sudo test -s /var/lib/etr-core/sd-factory-state.json; then
              sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-final-live-state.json
              status=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-final-live-state.json")).get("status", ""))')
              case "$status" in
                failed|cancelled|interrupted)
                  cat /tmp/etr-sd-final-live-state.json
                  exit 1
                  ;;
                ticket|unmounting|partitioning|formatting|mounting|copying_root|copying_boot|configuring|verifying|syncing|finalizing|ready)
                  accepted=true
                  break
                  ;;
              esac
            fi
            sleep 1
          done
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          [ "$accepted" = true ]
          sudo cat /var/lib/etr-core/sd-factory-state.json

      - name: Confirmer que le moteur reste sain pendant 75 secondes
        id: persistence
        shell: bash
        run: |
          set -euo pipefail
          sleep 75
          sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-final-live-state-after.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-sd-final-live-state-after.json',encoding='utf-8'))
          status=str(data.get('status') or '')
          assert status not in {'failed','cancelled','interrupted'}, data
          assert data.get('job_id'), data
          print(json.dumps(data,ensure_ascii=False,indent=2))
          PY
          echo "status=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-final-live-state-after.json"))["status"])')" >> "$GITHUB_OUTPUT"

      - name: Publier la preuve puis retirer le workflow ponctuel
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          JOB_ID: ${{ steps.request.outputs.job_id }}
          ACCEPTED: ${{ steps.start.outputs.accepted }}
          LIVE_STATUS: ${{ steps.persistence.outputs.status }}
        run: |
          set -euo pipefail
          sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-final-restart-state.json 2>/dev/null || printf '{}\n' > /tmp/etr-sd-final-restart-state.json
          sudo cat /var/lib/etr-core/sd-factory-rsync.log > /tmp/etr-sd-final-restart-rsync.log 2>/dev/null || : > /tmp/etr-sd-final-restart-rsync.log
          sudo systemctl status etr-sd-factory-worker.service --no-pager -l > /tmp/etr-sd-final-restart-worker.txt 2>&1 || true
          sudo journalctl -u etr-sd-factory-worker.service -n 200 --no-pager > /tmp/etr-sd-final-restart-journal.txt 2>&1 || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-final-restart-lsblk.txt
          python3 - <<'PY' > /tmp/etr-sd-final-restart.json
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def data(path):
              try:return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(path,limit=30000):
              try:return Path(path).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'jobId':os.getenv('JOB_ID') or None,
              'accepted':os.getenv('ACCEPTED') == 'true',
              'liveStatus':os.getenv('LIVE_STATUS') or None,
              'installedCommit':Path('/tmp/etr-sd-final-restart-commit.txt').read_text().strip() if Path('/tmp/etr-sd-final-restart-commit.txt').exists() else None,
              'snapshotPreflight':text('/tmp/etr-sd-final-snapshot.txt'),
              'state':data('/tmp/etr-sd-final-restart-state.json'),
              'rsyncLogTail':text('/tmp/etr-sd-final-restart-rsync.log'),
              'worker':text('/tmp/etr-sd-final-restart-worker.txt'),
              'journal':text('/tmp/etr-sd-final-restart-journal.txt'),
              'lsblk':text('/tmp/etr-sd-final-restart-lsblk.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-final-restart.json
          rm -rf /tmp/etr-sd-final-restart-repo
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-final-restart-repo
          cd /tmp/etr-sd-final-restart-repo
          mkdir -p .github/deployment
          cp /tmp/etr-sd-final-restart.json .github/deployment/etr-sd-final-restart.json
          rm -f .github/workflows/etr-sd-final-restart-once.yml
          git config user.name 'EtR SD final restart'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-final-restart.json .github/workflows/etr-sd-final-restart-once.yml
          git commit -m 'chore: record final SD restart and remove one-shot workflow [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

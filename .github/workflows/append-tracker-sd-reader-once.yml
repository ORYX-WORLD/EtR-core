name: Compléter le suivi du mode prudent microSD

on:
  push:
    branches:
      - fix/sd-reader-conservative-retry
    paths:
      - .github/workflows/append-tracker-sd-reader-once.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sd-reader-conservative-retry
          fetch-depth: 0

      - name: Ajouter l'entrée de suivi et retirer ce workflow ponctuel
        shell: bash
        run: |
          set -euo pipefail
          marker='| ETR-040 | Lecteur microSD USB instable |'
          if ! grep -Fq "$marker" docs/PROJECT_TRACKER.md; then
            cat >> docs/PROJECT_TRACKER.md <<'EOF'
          | ETR-040 | Lecteur microSD USB instable | Le lecteur SY-T18 a remis sa capacité à zéro pendant une écriture soutenue, provoquant des erreurs E/S et une carte incomplète | P0 | Nouvelle tentative prudente en PR | Le noyau a enregistré des pertes d'écriture et des changements de capacité de 31,3 Go à 0 ; l'utilisateur demande néanmoins un nouvel essai avec le même lecteur | Débit rsync limité à 2 Mio/s, exclusion des documentations et caches non nécessaires, surveillance de capacité toutes les 2 s et arrêt immédiat si le support disparaît | Effacer, reformater et réécrire une seule carte ; valider uniquement l'état final ready après contrôle et démontage |
          EOF
          fi
          rm -f .github/workflows/append-tracker-sd-reader-once.yml
          git config user.name 'EtR tracker automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/PROJECT_TRACKER.md .github/workflows/append-tracker-sd-reader-once.yml
          git commit -m 'docs: consigner le mode prudent du lecteur microSD'
          git push origin HEAD:fix/sd-reader-conservative-retry

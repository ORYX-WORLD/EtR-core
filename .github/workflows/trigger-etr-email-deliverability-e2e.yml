name: Déclencher le test réel des e-mails EtR

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-etr-email-deliverability-e2e.yml
  workflow_dispatch:

concurrency:
  group: trigger-etr-email-deliverability-e2e
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    name: Lancer le parcours humain et l'e-mail réel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Déclencher le workflow humain vérifié
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run etr-remote-viewer-human-live-e2e.yml --ref main

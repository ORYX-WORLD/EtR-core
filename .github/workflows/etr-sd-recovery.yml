name: Récupérer la microSD du banc EtR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-sd-recovery.yml
      - src/deploy/raspi/etr_sd_recovery.sh
      - src/deploy/raspi/etr-sd-recovery.service

concurrency:
  group: etr-sd-recovery
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover:
    name: Installer le service et traiter la carte insérée
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 35

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Actualiser le dépôt installé
        shell: bash
        run: |
          set -euo pipefail
          install_dir=/home/oryx/EtR-core
          sudo -u oryx -H git -C "$install_dir" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$install_dir" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$install_dir" stash push --include-untracked -m "Sauvegarde avant récupération microSD $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$install_dir" fetch origin main
          sudo -u oryx -H git -C "$install_dir" checkout main
          sudo -u oryx -H git -C "$install_dir" pull --ff-only origin main

      - name: Installer le service de récupération
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 755 /home/oryx/EtR-core/src/deploy/raspi/etr_sd_recovery.sh /usr/local/sbin/etr-sd-recovery
          sudo install -m 644 /home/oryx/EtR-core/src/deploy/raspi/etr-sd-recovery.service /etc/systemd/system/etr-sd-recovery.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed etr-sd-recovery.service 2>/dev/null || true
          test -x /usr/local/sbin/etr-sd-recovery
          systemd-analyze verify /etc/systemd/system/etr-sd-recovery.service

      - name: Lancer la tentative contrôlée
        id: recovery
        shell: bash
        run: |
          set +e
          sudo systemctl stop etr-sd-factory.service 2>/dev/null
          sudo rm -f /var/lib/etr-core/sd-recovery-last.json
          sudo systemctl start etr-sd-recovery.service
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          sudo systemctl status etr-sd-recovery.service --no-pager -l || true
          sudo journalctl -u etr-sd-recovery.service -n 160 --no-pager > /tmp/etr-sd-recovery-journal.txt || true
          sudo cat /var/lib/etr-core/sd-recovery-last.json > /tmp/etr-sd-recovery-result.json || {
            printf '%s\n' '{"status":"failure","code":"report_missing","message":"Le service n’a pas produit de rapport."}' > /tmp/etr-sd-recovery-result.json
          }
          cat /tmp/etr-sd-recovery-result.json | python3 -m json.tool
          sudo systemctl reset-failed etr-sd-recovery.service 2>/dev/null || true
          sudo systemctl start etr-sd-factory.service 2>/dev/null || true

      - name: Publier le résultat sans secret
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          SERVICE_EXIT_CODE: ${{ steps.recovery.outputs.exit_code }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/etr-sd-recovery-last.json
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          try:
              result=json.loads(Path('/tmp/etr-sd-recovery-result.json').read_text(encoding='utf-8'))
          except Exception:
              result={"status":"failure","code":"result_unreadable","message":"Rapport local illisible"}
          try:
              journal=Path('/tmp/etr-sd-recovery-journal.txt').read_text(encoding='utf-8',errors='replace')[-12000:]
          except OSError:
              journal=''
          report={
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "jobStatus": os.environ.get('JOB_STATUS'),
              "serviceExitCode": int(os.environ.get('SERVICE_EXIT_CODE') or 999),
              "result": result,
              "journalTail": journal,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          cat /tmp/etr-sd-recovery-last.json
          git fetch origin main
          git checkout -B sd-recovery-report origin/main
          mkdir -p .github/deployment
          cp /tmp/etr-sd-recovery-last.json .github/deployment/etr-sd-recovery-last.json
          git config user.name "EtR SD recovery"
          git config user.email "actions@users.noreply.github.com"
          git add .github/deployment/etr-sd-recovery-last.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record EtR SD recovery [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Mesurer la copie microSD en cours

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-sd-copy-monitor.yml

concurrency:
  group: etr-sd-copy-monitor
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  monitor:
    name: Mesurer rsync sans interrompre la fabrique
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Mesurer la copie active
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-sd-copy-monitor
          python3 - <<'PY' > /tmp/etr-sd-copy-monitor/sample1.json
          import json, os, pathlib, subprocess, time
          def cmd(args):
              return subprocess.run(args, text=True, capture_output=True, check=False).stdout.strip()
          pids=[]
          for line in cmd(['pgrep','-af','/usr/bin/rsync']).splitlines():
              if not line.strip(): continue
              pid, _, command=line.partition(' ')
              if pid.isdigit() and 'etr-sd-factory' in command:
                  pids.append((int(pid), command))
              elif pid.isdigit() and '/run/etr-sd-factory/' in command:
                  pids.append((int(pid), command))
          if not pids:
              for line in cmd(['pgrep','-af','/usr/bin/rsync']).splitlines():
                  pid, _, command=line.partition(' ')
                  if pid.isdigit(): pids.append((int(pid), command))
          processes=[]
          for pid, command in pids:
              io={}
              try:
                  for row in pathlib.Path(f'/proc/{pid}/io').read_text().splitlines():
                      key,val=row.split(':',1); io[key]=int(val.strip())
              except Exception: pass
              elapsed=cmd(['ps','-o','etimes=','-p',str(pid)]).strip()
              processes.append({'pid':pid,'command':command,'elapsedSeconds':int(elapsed or 0),'io':io})
          mounts=[]
          root=pathlib.Path('/run/etr-sd-factory')
          if root.exists():
              for job in sorted(root.glob('job-*')):
                  for name in ('root','boot'):
                      path=job/name
                      if path.exists():
                          source=cmd(['findmnt','-n','-o','SOURCE',str(path)])
                          used=cmd(['du','-sx','-B1',str(path)]).split('\t',1)[0]
                          free=cmd(['df','-B1','--output=size,used,avail,pcent',str(path)]).splitlines()
                          mounts.append({'path':str(path),'source':source or None,'duBytes':int(used or 0),'df':free[-1].split() if free else []})
          print(json.dumps({'sampledAtEpoch':time.time(),'processes':processes,'mounts':mounts},indent=2))
          PY
          sleep 12
          python3 - <<'PY' > /tmp/etr-sd-copy-monitor/sample2.json
          import json, os, pathlib, subprocess, time
          first=json.load(open('/tmp/etr-sd-copy-monitor/sample1.json'))
          def cmd(args): return subprocess.run(args,text=True,capture_output=True,check=False).stdout.strip()
          processes=[]
          for previous in first.get('processes',[]):
              pid=previous['pid']; io={}
              try:
                  for row in pathlib.Path(f'/proc/{pid}/io').read_text().splitlines():
                      key,val=row.split(':',1); io[key]=int(val.strip())
              except Exception: pass
              elapsed=cmd(['ps','-o','etimes=','-p',str(pid)]).strip()
              processes.append({'pid':pid,'alive':bool(elapsed),'elapsedSeconds':int(elapsed or 0),'io':io})
          mounts=[]
          root=pathlib.Path('/run/etr-sd-factory')
          if root.exists():
              for job in sorted(root.glob('job-*')):
                  for name in ('root','boot'):
                      path=job/name
                      if path.exists():
                          source=cmd(['findmnt','-n','-o','SOURCE',str(path)])
                          used=cmd(['du','-sx','-B1',str(path)]).split('\t',1)[0]
                          mounts.append({'path':str(path),'source':source or None,'duBytes':int(used or 0)})
          print(json.dumps({'sampledAtEpoch':time.time(),'processes':processes,'mounts':mounts},indent=2))
          PY
          sudo systemctl status etr-sd-factory.service --no-pager -l > /tmp/etr-sd-copy-monitor/service.txt 2>&1 || true
          sudo journalctl -u etr-sd-factory.service -n 80 --no-pager > /tmp/etr-sd-copy-monitor/journal.txt 2>&1 || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-copy-monitor/lsblk.txt

      - name: Publier le diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/etr-sd-copy-live.json
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          s1=json.load(open('/tmp/etr-sd-copy-monitor/sample1.json'))
          s2=json.load(open('/tmp/etr-sd-copy-monitor/sample2.json'))
          dt=max(0.001,s2['sampledAtEpoch']-s1['sampledAtEpoch'])
          by_pid={p['pid']:p for p in s2.get('processes',[])}
          rates=[]
          for p1 in s1.get('processes',[]):
              p2=by_pid.get(p1['pid'],{})
              io1=p1.get('io',{}); io2=p2.get('io',{})
              rates.append({
                  'pid':p1['pid'],
                  'elapsedSeconds':p2.get('elapsedSeconds',p1.get('elapsedSeconds')),
                  'writeBytesPerSecond':max(0,(io2.get('write_bytes',0)-io1.get('write_bytes',0))/dt),
                  'readBytesPerSecond':max(0,(io2.get('read_bytes',0)-io1.get('read_bytes',0))/dt),
                  'command':p1.get('command'),
              })
          m1={m['path']:m for m in s1.get('mounts',[])}
          growth=[]
          for m2 in s2.get('mounts',[]):
              before=m1.get(m2['path'],{})
              delta=m2.get('duBytes',0)-before.get('duBytes',0)
              growth.append({'path':m2['path'],'source':m2.get('source'),'bytesPresent':m2.get('duBytes',0),'growthBytesPerSecond':max(0,delta/dt)})
          def text(name):
              try:return Path('/tmp/etr-sd-copy-monitor/'+name).read_text(encoding='utf-8',errors='replace')[-10000:]
              except OSError:return ''
          report={
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'active':bool(rates),
              'sampleSeconds':round(dt,1),
              'processRates':rates,
              'mountGrowth':growth,
              'service':text('service.txt'),
              'journal':text('journal.txt'),
              'lsblk':text('lsblk.txt'),
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-copy-live.json
          git fetch origin main
          git checkout -B sd-copy-live-report origin/main
          mkdir -p .github/deployment
          cp /tmp/etr-sd-copy-live.json .github/deployment/etr-sd-copy-live.json
          git config user.name 'EtR SD copy monitor'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-copy-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record live EtR SD copy [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Diagnostiquer l'erreur rsync microSD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-sd-rsync-error-diagnostic.yml

concurrency:
  group: etr-sd-rsync-error-diagnostic
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    name: Relire la carte sans la modifier
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 25
    steps:
      - name: Vérifier que la copie est arrêtée
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/etr-sd-rsync-diagnostic /run/etr-sd-diagnostic
          mkdir -p /tmp/etr-sd-rsync-diagnostic /run/etr-sd-diagnostic/root
          pgrep -af 'etr_sd_factory|[r]sync.*?/run/etr-sd-factory/' > /tmp/etr-sd-rsync-diagnostic/processes.txt || true
          if pgrep -af '[r]sync.*?/run/etr-sd-factory/' >/dev/null; then
            echo '::error::Une copie rsync est encore active; diagnostic annulé sans toucher à la carte.'
            exit 1
          fi
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-rsync-diagnostic/lsblk.txt
          sudo journalctl -u etr-sd-factory-auto.service -u etr-sd-factory.service --since '2026-08-03 15:00:00' --no-pager > /tmp/etr-sd-rsync-diagnostic/journal.txt 2>&1 || true
          sudo dmesg --ctime | tail -n 400 > /tmp/etr-sd-rsync-diagnostic/dmesg.txt 2>&1 || true
          test -b /dev/sda2
          if findmnt -rn -S /dev/sda2 >/dev/null; then
            echo '::error::La partition cible est encore montée; diagnostic interrompu sans la modifier.'
            exit 1
          fi

      - name: Rejouer uniquement la comparaison rsync en lecture seule
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          mounted=false
          cleanup() {
            if [ "$mounted" = true ]; then sudo umount /run/etr-sd-diagnostic/root || true; fi
          }
          trap cleanup EXIT
          sudo mount -o ro,noload /dev/sda2 /run/etr-sd-diagnostic/root
          mounted=true
          set +e
          timeout 1200 sudo /usr/bin/rsync \
            -aHAXxn --numeric-ids --no-inc-recursive --whole-file --stats \
            --exclude '/boot/***' \
            --exclude '/dev/***' \
            --exclude '/proc/***' \
            --exclude '/sys/***' \
            --exclude '/run/***' \
            --exclude '/tmp/***' \
            --exclude '/mnt/***' \
            --exclude '/media/***' \
            --exclude '/lost+found' \
            --exclude '/swapfile' \
            --exclude '/home/oryx/actions-runner/***' \
            --exclude '/home/oryx/.cache/***' \
            --exclude '/home/oryx/.config/chromium/***' \
            --exclude '/home/oryx/.config/etr-kiosk-chromium/***' \
            --exclude '/home/oryx/EtR-core/.git/***' \
            --exclude '/home/oryx/EtR-core/**/__pycache__/***' \
            --exclude '/var/lib/etr-core/***' \
            --exclude '/var/cache/apt/archives/***' \
            --exclude '/var/cache/man/***' \
            --exclude '/var/log/journal/***' \
            --exclude '/var/log/*.log' \
            --exclude '/var/log/*/*.log' \
            / /run/etr-sd-diagnostic/root/ \
            > /tmp/etr-sd-rsync-diagnostic/rsync.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          grep -Eai 'rsync:|error|failed|denied|vanished|not supported|no space|input/output|read-only' \
            /tmp/etr-sd-rsync-diagnostic/rsync.txt \
            > /tmp/etr-sd-rsync-diagnostic/rsync-errors.txt || true
          tail -n 160 /tmp/etr-sd-rsync-diagnostic/rsync.txt > /tmp/etr-sd-rsync-diagnostic/rsync-tail.txt
          cat /tmp/etr-sd-rsync-diagnostic/rsync-errors.txt
          cat /tmp/etr-sd-rsync-diagnostic/rsync-tail.txt

      - name: Construire le rapport
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          RSYNC_EXIT_CODE: ${{ steps.compare.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-sd-rsync-diagnostic
          python3 - <<'PY' > /tmp/etr-sd-rsync-diagnostic.json
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          base=Path('/tmp/etr-sd-rsync-diagnostic')
          def text(name, limit=30000):
              try:return (base/name).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          errors=text('rsync-errors.txt')
          tail=text('rsync-tail.txt')
          dmesg=text('dmesg.txt')
          report={
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'rsyncExitCode':int(os.getenv('RSYNC_EXIT_CODE') or 999),
              'rsyncErrors':errors,
              'rsyncTail':tail,
              'transientSourceChange':bool(re.search(r'vanished|No such file or directory',errors,re.I)),
              'attributeFailure':bool(re.search(r'xattr|acl|Operation not supported|Operation not permitted',errors,re.I)),
              'storageFailure':bool(re.search(r'No space left|Input/output error|critical medium error',errors+'\n'+dmesg,re.I)),
              'processes':text('processes.txt'),
              'lsblk':text('lsblk.txt'),
              'journal':text('journal.txt'),
              'dmesgTail':dmesg,
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-rsync-diagnostic.json

      - name: Publier le diagnostic
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/etr-sd-diagnostic-repo
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-diagnostic-repo
          cd /tmp/etr-sd-diagnostic-repo
          mkdir -p .github/deployment
          cp /tmp/etr-sd-rsync-diagnostic.json .github/deployment/etr-sd-rsync-diagnostic.json
          git config user.name 'EtR SD rsync diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-rsync-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record EtR SD rsync diagnostic [skip ci]'
            git push origin HEAD:main
          fi

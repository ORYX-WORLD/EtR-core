name: Détailler l'identification physique du lecteur USB

on:
  push:
    branches:
      - fix/sd-usb-identity-path
    paths:
      - .github/workflows/etr-sd-usb-identity-debug-once.yml

concurrency:
  group: etr-sd-usb-identity-debug
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  debug:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 8
    steps:
      - name: Cloner et exécuter le diagnostic sans écrire sur la carte
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/etr-sd-usb-id-debug-source /tmp/etr-sd-usb-id-debug
          mkdir -p /tmp/etr-sd-usb-id-debug
          git clone --depth 1 --branch fix/sd-usb-identity-path \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/etr-sd-usb-id-debug-source
          set +e
          sudo env PYTHONPATH=/tmp/etr-sd-usb-id-debug-source PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 - <<'PY' > /tmp/etr-sd-usb-id-debug/python.txt 2>&1
          import json
          import os
          import traceback
          from pathlib import Path
          import src.deploy.raspi.etr_sd_factory_preparation_recovery as m

          disk='/dev/sda'
          devpath=m._output(['/usr/bin/udevadm','info','--query=path','--name',disk],timeout=8)
          node_name=m._usb_node_name_from_devpath(devpath)
          candidate=Path('/sys/bus/usb/devices')/node_name if node_name else Path('/nonexistent')
          resolved=(Path('/sys')/devpath.lstrip('/')) if devpath else Path('/nonexistent')
          report={
              'realpath':os.path.realpath(disk),
              'diskSize':m._disk_size(disk),
              'devpath':devpath,
              'nodeName':node_name,
              'candidate':str(candidate),
              'candidateExists':candidate.exists(),
              'candidateResolved':str(candidate.resolve()) if candidate.exists() else None,
              'idVendorExists':(candidate/'idVendor').exists(),
              'idVendorIsFile':(candidate/'idVendor').is_file(),
              'idVendor':m._read(candidate/'idVendor'),
              'idProductExists':(candidate/'idProduct').exists(),
              'idProductIsFile':(candidate/'idProduct').is_file(),
              'idProduct':m._read(candidate/'idProduct'),
              'sysPath':str(resolved),
              'sysPathExists':resolved.exists(),
              'directNode':str(m._usb_device_node(disk)) if m._usb_device_node(disk) else None,
          }
          try:
              value=m.inspect_physical_target(disk)
              report['identity']=value.__dict__
          except Exception as exc:
              report['exceptionType']=type(exc).__name__
              report['exception']=str(exc)
              report['traceback']=traceback.format_exc()
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          code=$?
          set -e
          echo "$code" > /tmp/etr-sd-usb-id-debug/python-exit.txt
          cat /tmp/etr-sd-usb-id-debug/python.txt
          find /sys/bus/usb/devices -maxdepth 2 \( -name idVendor -o -name idProduct -o -name serial \) \
            -printf '%p=' -exec cat {} \; > /tmp/etr-sd-usb-id-debug/sysfs-usb.txt 2>&1 || true
          ls -la /sys/bus/usb/devices/1-1.1 > /tmp/etr-sd-usb-id-debug/node-ls.txt 2>&1 || true

      - name: Publier le diagnostic et retirer ce workflow
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          base=/tmp/etr-sd-usb-id-debug
          python3 - <<'PY' > /tmp/etr-sd-usb-identity-debug.json
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          base=Path('/tmp/etr-sd-usb-id-debug')
          def data(name):
              try:return json.loads((base/name).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(name):
              try:return (base/name).read_text(encoding='utf-8',errors='replace')[-20000:]
              except OSError:return ''
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'pythonExit':int(text('python-exit.txt').strip() or 999),
              'python':data('python.txt'),
              'pythonRaw':text('python.txt'),
              'sysfsUsb':text('sysfs-usb.txt'),
              'nodeListing':text('node-ls.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-usb-identity-debug.json

          cd /tmp/etr-sd-usb-id-debug-source
          git fetch origin fix/sd-usb-identity-path
          git reset --hard origin/fix/sd-usb-identity-path
          mkdir -p .github/deployment
          cp /tmp/etr-sd-usb-identity-debug.json .github/deployment/etr-sd-usb-identity-debug.json
          rm -f .github/workflows/etr-sd-usb-identity-debug-once.yml
          git config user.name 'EtR USB identity debug'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-usb-identity-debug.json \
                  .github/workflows/etr-sd-usb-identity-debug-once.yml
          git commit -m 'chore: record detailed USB identity debug [skip ci]'
          git pull --rebase origin fix/sd-usb-identity-path
          git push origin HEAD:fix/sd-usb-identity-path

name: Réparer l'audio Bluetooth et le microphone EtR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-audio-repair.yml
      - src/deploy/raspi/etr-jbl-connect.sh
      - src/deploy/raspi/etr-jbl-connect.service
      - src/deploy/raspi/etr-audio-monitor.service

concurrency:
  group: etr-audio-repair
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repair:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Actualiser le Raspberry
        shell: bash
        run: |
          set -euo pipefail
          install_dir=/home/oryx/EtR-core
          sudo -u oryx -H git -C "$install_dir" fetch origin main
          sudo -u oryx -H git -C "$install_dir" checkout main
          sudo -u oryx -H git -C "$install_dir" pull --ff-only origin main

      - name: Établir le diagnostic matériel et logiciel initial
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/etr-audio-repair
          lsusb > /tmp/etr-audio-repair/lsusb.txt 2>&1
          arecord -l > /tmp/etr-audio-repair/arecord.txt 2>&1
          aplay -l > /tmp/etr-audio-repair/aplay.txt 2>&1
          rfkill list > /tmp/etr-audio-repair/rfkill.txt 2>&1
          bluetoothctl show > /tmp/etr-audio-repair/bluetooth-show.txt 2>&1
          bluetoothctl info 40:C1:F6:70:C0:1A > /tmp/etr-audio-repair/jbl-before.txt 2>&1
          systemctl status bluetooth.service --no-pager -l > /tmp/etr-audio-repair/bluetooth-service.txt 2>&1
          journalctl -u bluetooth.service -n 160 --no-pager > /tmp/etr-audio-repair/bluetooth-journal-before.txt 2>&1
          find /usr/lib -path '*spa-0.2*bluez*' -o -name 'libspa-bluez5.so' > /tmp/etr-audio-repair/bluez-plugin.txt 2>&1
          audio_env=(env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus)
          sudo -u oryx "${audio_env[@]}" pactl info > /tmp/etr-audio-repair/pactl-info-before.txt 2>&1
          sudo -u oryx "${audio_env[@]}" pactl list short cards > /tmp/etr-audio-repair/cards-before.txt 2>&1
          sudo -u oryx "${audio_env[@]}" pactl list short sinks > /tmp/etr-audio-repair/sinks-before.txt 2>&1
          sudo -u oryx "${audio_env[@]}" pactl list short sources > /tmp/etr-audio-repair/sources-before.txt 2>&1
          sudo -u oryx "${audio_env[@]}" wpctl status -n > /tmp/etr-audio-repair/wpctl-before.txt 2>&1
          sudo -u oryx "${audio_env[@]}" journalctl --user -u wireplumber.service -n 200 --no-pager > /tmp/etr-audio-repair/wireplumber-before.txt 2>&1
          set -e

      - name: Réparer PipeWire et l'enregistrement des profils BlueZ
        shell: bash
        run: |
          set -euo pipefail
          sudo loginctl enable-linger oryx
          sudo systemctl enable --now bluetooth.service
          sudo rfkill unblock bluetooth || true
          sudo install -d -m 755 -o oryx -g oryx /home/oryx/.config/wireplumber/wireplumber.conf.d
          cat > /tmp/51-etr-bluez.conf <<'EOF'
          monitor.bluez.properties = {
            bluez5.roles = [ a2dp_source a2dp_sink hfp_hf hfp_ag hsp_hs hsp_ag ]
            bluez5.codecs = [ sbc sbc_xq aac ]
          }
          EOF
          sudo install -m 644 -o oryx -g oryx /tmp/51-etr-bluez.conf /home/oryx/.config/wireplumber/wireplumber.conf.d/51-etr-bluez.conf
          sudo systemctl start user@1000.service
          audio_env=(env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus)
          sudo -u oryx "${audio_env[@]}" systemctl --user disable --now pulseaudio.service pulseaudio.socket 2>/dev/null || true
          sudo -u oryx "${audio_env[@]}" systemctl --user unmask pipewire.service pipewire.socket pipewire-pulse.service pipewire-pulse.socket wireplumber.service
          sudo -u oryx "${audio_env[@]}" systemctl --user enable pipewire.socket pipewire-pulse.socket wireplumber.service
          sudo -u oryx "${audio_env[@]}" systemctl --user restart pipewire.service pipewire-pulse.service wireplumber.service
          sleep 6

      - name: Reconnecter la JBL après publication des profils A2DP
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/etr-audio-repair
          sudo systemctl stop etr-jbl-connect.service 2>/dev/null
          bluetoothctl power on
          bluetoothctl agent on
          bluetoothctl default-agent
          bluetoothctl trust 40:C1:F6:70:C0:1A
          timeout 15 bluetoothctl scan on > /tmp/etr-audio-repair/scan.txt 2>&1
          for attempt in $(seq 1 5); do
            bluetoothctl --timeout 20 connect 40:C1:F6:70:C0:1A > "/tmp/etr-audio-repair/connect-${attempt}.txt" 2>&1
            code=$?
            bluetoothctl info 40:C1:F6:70:C0:1A >> "/tmp/etr-audio-repair/connect-${attempt}.txt" 2>&1
            if bluetoothctl info 40:C1:F6:70:C0:1A | grep -q 'Connected: yes'; then
              break
            fi
            sleep 4
          done
          audio_env=(env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus)
          for attempt in $(seq 1 30); do
            sudo -u oryx "${audio_env[@]}" pactl list short sinks > /tmp/etr-audio-repair/sinks-after.txt 2>&1
            sink=$(awk '$2 ~ /^bluez_output\./ {print $2; exit}' /tmp/etr-audio-repair/sinks-after.txt)
            if [ -n "$sink" ]; then
              sudo -u oryx "${audio_env[@]}" pactl set-default-sink "$sink"
              sudo -u oryx "${audio_env[@]}" pactl set-sink-volume "$sink" 35%
              break
            fi
            sleep 2
          done
          sudo systemctl restart etr-jbl-connect.service
          bluetoothctl info 40:C1:F6:70:C0:1A > /tmp/etr-audio-repair/jbl-after.txt 2>&1
          sudo -u oryx "${audio_env[@]}" pactl list short cards > /tmp/etr-audio-repair/cards-after.txt 2>&1
          sudo -u oryx "${audio_env[@]}" pactl list short sinks > /tmp/etr-audio-repair/sinks-after.txt 2>&1
          sudo -u oryx "${audio_env[@]}" pactl list short sources > /tmp/etr-audio-repair/sources-after.txt 2>&1
          sudo -u oryx "${audio_env[@]}" wpctl status -n > /tmp/etr-audio-repair/wpctl-after.txt 2>&1
          sudo -u oryx "${audio_env[@]}" journalctl --user -u wireplumber.service -n 200 --no-pager > /tmp/etr-audio-repair/wireplumber-after.txt 2>&1
          journalctl -u bluetooth.service -n 200 --no-pager > /tmp/etr-audio-repair/bluetooth-journal-after.txt 2>&1
          set -e

      - name: Relancer l'écoute microphone EtR
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl restart etr-audio-monitor.service
          sleep 8
          sudo cp /var/lib/etr-core/audio-status.json /tmp/etr-audio-repair/audio-status.json 2>/dev/null || printf '{}' > /tmp/etr-audio-repair/audio-status.json
          sudo systemctl status etr-audio-monitor.service --no-pager -l > /tmp/etr-audio-repair/audio-monitor-service.txt 2>&1 || true
          sudo journalctl -u etr-audio-monitor.service -n 100 --no-pager > /tmp/etr-audio-repair/audio-monitor-journal.txt 2>&1 || true
          curl -fsS http://127.0.0.1:8080/api/v1/audio > /tmp/etr-audio-repair/audio-api.json || true

      - name: Publier la preuve détaillée
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/etr-audio-repair-last.json
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('/tmp/etr-audio-repair')
          def text(name, limit=20000):
              try:return (root/name).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          def data(name):
              try:return json.loads((root/name).read_text(encoding='utf-8'))
              except Exception:return {}
          connects='\n\n'.join(text(f'connect-{i}.txt',5000) for i in range(1,6))
          report={
            'checkedAt':datetime.now(timezone.utc).isoformat(),
            'jobStatus':os.getenv('JOB_STATUS'),
            'lsusb':text('lsusb.txt'),
            'arecord':text('arecord.txt'),
            'aplay':text('aplay.txt'),
            'rfkill':text('rfkill.txt'),
            'bluezPlugin':text('bluez-plugin.txt'),
            'jblBefore':text('jbl-before.txt'),
            'jblAfter':text('jbl-after.txt'),
            'connectAttempts':connects,
            'cardsBefore':text('cards-before.txt'),
            'cardsAfter':text('cards-after.txt'),
            'sinksBefore':text('sinks-before.txt'),
            'sinksAfter':text('sinks-after.txt'),
            'sourcesBefore':text('sources-before.txt'),
            'sourcesAfter':text('sources-after.txt'),
            'wpctlBefore':text('wpctl-before.txt'),
            'wpctlAfter':text('wpctl-after.txt'),
            'wireplumberBefore':text('wireplumber-before.txt'),
            'wireplumberAfter':text('wireplumber-after.txt'),
            'bluetoothJournal':text('bluetooth-journal-after.txt'),
            'microphone':data('audio-status.json'),
            'audioApi':data('audio-api.json'),
            'audioMonitorService':text('audio-monitor-service.txt'),
            'audioMonitorJournal':text('audio-monitor-journal.txt'),
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-audio-repair-last.json
          git fetch origin main
          git checkout -B etr-audio-repair-report origin/main
          mkdir -p .github/deployment
          cp /tmp/etr-audio-repair-last.json .github/deployment/etr-audio-repair-last.json
          git config user.name 'EtR audio repair'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-audio-repair-last.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record EtR audio repair [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

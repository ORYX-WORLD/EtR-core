name: Récupérer réellement le lecteur hors ligne sans écrire la carte

on:
  push:
    branches:
      - fix/sd-usb-identity-path
    paths:
      - .github/workflows/etr-sd-usb-recovery-preflight3-once.yml

concurrency:
  group: etr-sd-usb-recovery-preflight3
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preflight:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Cloner la branche et capturer l'état initial
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/etr-sd-usb-recovery-preflight3-source /tmp/etr-sd-usb-recovery-preflight3
          mkdir -p /tmp/etr-sd-usb-recovery-preflight3
          git clone --depth 1 --branch fix/sd-usb-identity-path \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/etr-sd-usb-recovery-preflight3-source
          lsusb > /tmp/etr-sd-usb-recovery-preflight3/lsusb-before.txt || true
          lsusb -t > /tmp/etr-sd-usb-recovery-preflight3/tree-before.txt || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL \
            > /tmp/etr-sd-usb-recovery-preflight3/lsblk-before.txt
          sudo blockdev --getsize64 /dev/sda \
            > /tmp/etr-sd-usb-recovery-preflight3/size-before.txt 2>&1 || true

      - name: Tester l'identification et la récupération dans le sandbox du worker
        shell: bash
        run: |
          set -euo pipefail
          source=/tmp/etr-sd-usb-recovery-preflight3-source
          work=/tmp/etr-sd-usb-recovery-preflight3
          unit="etr-sd-usb-recovery-preflight3-${GITHUB_RUN_ID}"
          sudo systemd-run --quiet --wait --collect --pipe --unit="$unit" \
            -p Type=oneshot -p User=root -p Group=root \
            -p NoNewPrivileges=true -p PrivateTmp=true \
            -p ProtectHome=read-only -p ProtectSystem=strict \
            -p PrivateDevices=false \
            -p RestrictAddressFamilies='AF_UNIX AF_INET AF_INET6 AF_NETLINK' \
            /usr/bin/env PYTHONPATH="$source" PYTHONDONTWRITEBYTECODE=1 \
            /usr/bin/python3 - <<'PY' > "$work/sandbox.txt" 2>&1
          import json
          from src.deploy.raspi.etr_sd_factory_preparation_recovery import (
              inspect_physical_target,
              recover_physical_target,
              target_capacity_matches,
          )

          expected=31268536320
          identity=inspect_physical_target('/dev/sda', expected_size=expected)
          messages=[]
          before=target_capacity_matches(identity,'/dev/sda')
          path='/dev/sda'
          if not before:
              path=recover_physical_target(
                  identity,
                  progress=lambda value:(messages.append(value),print(value,flush=True)),
                  attempt=1,
                  maximum=2,
                  timeout_seconds=90,
                  stable_seconds=5,
              )
          after=target_capacity_matches(identity,path)
          result={
              'identity':identity.__dict__,
              'capacityMatchedBefore':before,
              'recoveredPath':path,
              'capacityMatchedAfter':after,
              'messages':messages,
          }
          assert identity.disk_size == expected, result
          assert identity.usb_node, result
          assert after is True, result
          print('RESULT_JSON='+json.dumps(result,ensure_ascii=False),flush=True)
          PY
          cat "$work/sandbox.txt"
          grep '^RESULT_JSON=' "$work/sandbox.txt" | tail -n1 | sed 's/^RESULT_JSON=//' > "$work/result.json"
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-sd-usb-recovery-preflight3/result.json',encoding='utf-8'))
          assert data['identity']['disk_size'] == 31268536320, data
          assert data['identity']['usb_node'], data
          assert data['capacityMatchedAfter'] is True, data
          PY
          lsusb > "$work/lsusb-after.txt" || true
          lsusb -t > "$work/tree-after.txt" || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > "$work/lsblk-after.txt"
          recovered=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-usb-recovery-preflight3/result.json"))["recoveredPath"])')
          sudo blockdev --getsize64 "$recovered" > "$work/size-after.txt"

      - name: Publier la preuve et retirer ce workflow ponctuel
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          base=/tmp/etr-sd-usb-recovery-preflight3
          python3 - <<'PY' > /tmp/etr-sd-usb-recovery-preflight3.json
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          base=Path('/tmp/etr-sd-usb-recovery-preflight3')
          def data(name):
              try:return json.loads((base/name).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(name):
              try:return (base/name).read_text(encoding='utf-8',errors='replace')[-20000:]
              except OSError:return ''
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'result':data('result.json'),
              'sandbox':text('sandbox.txt'),
              'sizeBefore':text('size-before.txt').strip() or None,
              'sizeAfter':text('size-after.txt').strip() or None,
              'lsusbBefore':text('lsusb-before.txt'),
              'lsusbAfter':text('lsusb-after.txt'),
              'treeBefore':text('tree-before.txt'),
              'treeAfter':text('tree-after.txt'),
              'lsblkBefore':text('lsblk-before.txt'),
              'lsblkAfter':text('lsblk-after.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-usb-recovery-preflight3.json

          cd /tmp/etr-sd-usb-recovery-preflight3-source
          git fetch origin fix/sd-usb-identity-path
          git reset --hard origin/fix/sd-usb-identity-path
          mkdir -p .github/deployment
          cp /tmp/etr-sd-usb-recovery-preflight3.json .github/deployment/etr-sd-usb-recovery-preflight3.json
          rm -f .github/workflows/etr-sd-usb-recovery-preflight3-once.yml
          git config user.name 'EtR USB recovery preflight 3'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-usb-recovery-preflight3.json \
                  .github/workflows/etr-sd-usb-recovery-preflight3-once.yml
          git commit -m 'chore: record real USB recovery preflight [skip ci]'
          git pull --rebase origin fix/sd-usb-identity-path
          git push origin HEAD:fix/sd-usb-identity-path

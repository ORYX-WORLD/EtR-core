name: Diagnostic Chromium EtR

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etr-contact.yml"

jobs:
  chromium:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Identifier le lancement de Chromium
        shell: bash
        run: |
          set +e
          echo "=== PROCESSUS CHROMIUM ==="
          ps -eo pid,ppid,lstart,etime,args | grep -E '[c]hromium|[c]hrome'
          echo
          echo "=== ARBORESCENCE DES PROCESSUS ==="
          command -v pstree >/dev/null && pstree -ap "$(pgrep -o chromium 2>/dev/null)" || true
          echo
          echo "=== CONFIGURATIONS DE LANCEMENT ==="
          grep -RniE 'chromium|chrome|BrowserMetrics' \
            /home/oryx/.config/lxsession \
            /home/oryx/.config/autostart \
            /home/oryx/.config/labwc \
            /home/oryx/.config/systemd \
            /home/oryx/Desktop \
            /etc/xdg/lxsession \
            /etc/xdg/autostart \
            /etc/systemd/system 2>/dev/null | head -n 200
          echo
          echo "=== SERVICE/CRON ==="
          systemctl list-units --type=service --all 2>/dev/null | grep -iE 'chrom|kiosk|browser' || true
          crontab -l 2>/dev/null || true
          echo
          echo "=== CROISSANCE BROWSERMETRICS ==="
          find /home/oryx/.config/chromium/BrowserMetrics -maxdepth 1 -type f -mmin -5 2>/dev/null | wc -l
          du -sh /home/oryx/.config/chromium/BrowserMetrics 2>/dev/null || true
          df -h /

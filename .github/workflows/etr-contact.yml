name: Vérification finale EtR

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etr-contact.yml"

jobs:
  verify:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Vérifier stockage, dépôt et service
        shell: bash
        run: |
          set +e
          echo "ETR_FINAL_CHECK"
          git -C /home/oryx/EtR-core remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          echo "=== DÉPÔT ==="
          git -C /home/oryx/EtR-core remote -v
          git -C /home/oryx/EtR-core status --short --branch
          echo
          echo "=== STOCKAGE ==="
          df -h /
          du -sh /home/oryx/.config/chromium/BrowserMetrics 2>/dev/null || true
          echo
          echo "=== ERREURS NOYAU DU DÉMARRAGE ==="
          journalctl -k -p err..alert --since boot --no-pager 2>/dev/null | tail -n 80 || true
          echo
          echo "=== FICHIER CHROMIUM RÉSIDUEL ==="
          ls -lh /home/oryx/.config/chromium/BrowserMetrics 2>&1 | tail -n 20 || true
          echo
          echo "=== SERVICE ETR ==="
          systemctl is-active etr.service
          systemctl status etr.service --no-pager -n 12

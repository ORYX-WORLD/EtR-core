name: Diagnostic EtR config

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etr-contact.yml"

jobs:
  diagnostic:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Identifier le dossier saturant la carte
        shell: bash
        run: |
          set +e
          echo "ETR_CONFIG_DIAGNOSTIC_OK"
          echo "=== ESPACE AVANT ==="
          df -h /
          echo
          echo "=== PLUS GROS DOSSIERS .CONFIG NIVEAU 1 ==="
          du -xhd1 /home/oryx/.config 2>/dev/null | sort -h | tail -n 30
          echo
          echo "=== PLUS GROS DOSSIERS .CONFIG NIVEAU 3 ==="
          du -xhd3 /home/oryx/.config 2>/dev/null | sort -h | tail -n 60
          echo
          echo "=== NOMBRE DE FICHIERS PAR DOSSIER PRINCIPAL ==="
          for d in /home/oryx/.config/*; do
            [ -d "$d" ] || continue
            printf '%s ' "$d"
            find "$d" -xdev -type f 2>/dev/null | wc -l
          done | sort -k2 -n | tail -n 30
          echo
          echo "=== FICHIERS RÉCENTS DANS LE PLUS GROS DOSSIER ==="
          find /home/oryx/.config -xdev -type f -printf '%T@ %s %p\n' 2>/dev/null | sort -nr | head -n 40
          echo
          echo "=== SERVICE ETR ==="
          systemctl is-active etr.service 2>/dev/null || true

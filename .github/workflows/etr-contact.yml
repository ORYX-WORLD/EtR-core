name: Nettoyage EtR

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etr-contact.yml"

jobs:
  cleanup:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Libérer l’espace saturé par Chromium
        shell: bash
        run: |
          set -u
          echo "ETR_CLEANUP_START"
          echo "=== AVANT ==="
          df -h /
          METRICS="/home/oryx/.config/chromium/BrowserMetrics"
          if [ -d "$METRICS" ]; then
            echo "BrowserMetrics avant : $(du -sh "$METRICS" 2>/dev/null | cut -f1)"
            find "$METRICS" -xdev -type f -delete
            find "$METRICS" -xdev -mindepth 1 -type d -empty -delete
          fi
          find /home/oryx/.config/chromium -maxdepth 1 -type f -name '.org.chromium.Chromium.*' -delete 2>/dev/null || true
          rm -f /home/oryx/actions-runner/actions-runner-linux-arm64-2.329.0.tar.gz
          rm -rf /home/oryx/.cache/pip/http-v2 2>/dev/null || true
          sync
          echo "=== APRÈS ==="
          df -h /
          echo "BrowserMetrics après : $(du -sh "$METRICS" 2>/dev/null | cut -f1 || echo absent)"
          echo "Service EtR : $(systemctl is-active etr.service 2>/dev/null || true)"
          echo "ETR_CLEANUP_DONE"

name: Diagnostic kiosque EtR

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etr-contact.yml"

jobs:
  kiosk:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Lire le service kiosque et ses erreurs
        shell: bash
        run: |
          set +e
          echo "=== UNITÉ ETR-KIOSK ==="
          systemctl cat etr-kiosk.service
          echo
          echo "=== ÉTAT ETR-KIOSK ==="
          systemctl status etr-kiosk.service --no-pager -n 80
          echo
          echo "=== JOURNAL ETR-KIOSK ==="
          journalctl -u etr-kiosk.service --since boot --no-pager -n 160
          echo
          echo "=== ÉCRAN / SESSION ==="
          ls -l /tmp/.X11-unix 2>/dev/null || true
          loginctl list-sessions 2>/dev/null || true
          systemctl is-active display-manager.service 2>/dev/null || true
          echo
          echo "=== STOCKAGE ==="
          df -h /

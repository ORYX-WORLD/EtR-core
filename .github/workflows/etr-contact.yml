name: Sécurisation et diagnostic X EtR

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etr-contact.yml"

jobs:
  display:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Arrêter la boucle et identifier le lanceur graphique
        shell: bash
        run: |
          set +e
          echo "=== ARRÊT PROVISOIRE DU KIOSQUE ==="
          sudo -n systemctl stop etr-kiosk.service
          systemctl is-active etr-kiosk.service
          echo
          echo "=== UNITÉS GRAPHIQUES / ETR ==="
          systemctl list-unit-files --no-pager | grep -Ei 'etr|xorg|lightdm|display|kiosk|framebuffer|fbcp'
          echo
          systemctl list-units --all --no-pager | grep -Ei 'etr|xorg|lightdm|display|kiosk|framebuffer|fbcp'
          echo
          echo "=== DÉPENDANCES ET CIBLES ==="
          systemctl get-default
          systemctl list-dependencies graphical.target --no-pager
          systemctl list-dependencies multi-user.target --no-pager | grep -Ei 'etr|lightdm|display|graphical'
          echo
          echo "=== JOURNAL LIGHTDM ==="
          journalctl -u lightdm.service -b --no-pager -n 100
          echo
          echo "=== LOG XORG :1 ==="
          tail -n 180 /home/oryx/.local/share/xorg/Xorg.1.log 2>/dev/null || true
          tail -n 180 /var/log/Xorg.1.log 2>/dev/null || true
          echo
          echo "=== CONFIG XORG ==="
          find /etc/X11 -maxdepth 3 -type f \( -name '*.conf' -o -name 'xorg.conf' \) -print -exec sed -n '1,240p' {} \; 2>/dev/null
          echo
          echo "=== SCRIPTS / SERVICES CONNEXES ==="
          for unit in etr-kiosk.service etr-dashboard.service lightdm.service; do
            echo "--- $unit ---"
            systemctl cat "$unit" 2>/dev/null || true
          done
          echo
          echo "=== ÉTAT APRÈS ARRÊT ==="
          df -h /
          du -sh /home/oryx/.config/chromium/BrowserMetrics 2>/dev/null || true
          systemctl is-active etr.service
          systemctl is-active etr-dashboard.service

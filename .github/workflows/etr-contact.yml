name: Vérifier la stabilité EtR

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etr-contact.yml"

permissions:
  contents: write

jobs:
  stability-check:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Contrôler EtR après stabilisation
        shell: bash
        run: |
          set +e
          sleep 20
          report="docs/raspberry/live-stability-check.txt"
          mkdir -p docs/raspberry
          overall=OK
          {
            echo "Contrôle de stabilité EtR - $(date -Is)"
            echo
            for service in etr.service etr-dashboard.service spi-desktop.service etr-kiosk.service; do
              state=$(systemctl is-active "$service" 2>/dev/null || true)
              restarts=$(systemctl show "$service" -p NRestarts --value 2>/dev/null || true)
              printf "%s : %s ; redémarrages=%s\n" "$service" "$state" "${restarts:-inconnu}"
              [ "$state" = active ] || overall=ECHEC
            done
            [ -S /tmp/.X11-unix/X1 ] && echo "Affichage X11 : OK" || { echo "Affichage X11 : ECHEC"; overall=ECHEC; }
            pgrep -u oryx -x chromium >/dev/null && echo "Chromium kiosque : OK" || { echo "Chromium kiosque : ECHEC"; overall=ECHEC; }
            nc -z 127.0.0.1 8000 >/dev/null 2>&1 && echo "Tableau de bord 8000 : OK" || { echo "Tableau de bord 8000 : ECHEC"; overall=ECHEC; }
            nc -z 127.0.0.1 8080 >/dev/null 2>&1 && echo "Service EtR 8080 : OK" || { echo "Service EtR 8080 : ECHEC"; overall=ECHEC; }
            echo
            echo "Stockage : $(df -h / | awk 'NR==2 {print $5 " utilisé, " $4 " disponible"}')"
            echo "Profil kiosque : $(du -sh /home/oryx/.cache/etr-kiosk-chromium 2>/dev/null | awk '{print $1}')"
            echo
            echo "Résultat global : $overall"
          } > "$report"
          [ "$overall" = OK ]

      - name: Publier le contrôle
        if: always()
        shell: bash
        run: |
          git config user.name "EtR Core"
          git config user.email "etr-core@users.noreply.github.com"
          git add docs/raspberry/live-stability-check.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "diag: publish EtR stability check"
          git push

name: Diagnostic détaillé kiosque EtR

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etr-contact.yml"

jobs:
  kiosk:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Lire le script et les erreurs du kiosque
        shell: bash
        run: |
          set +e
          echo "=== SCRIPT ETR-KIOSK ==="
          sed -n '1,240p' /usr/local/bin/etr-kiosk.sh
          echo
          echo "=== JOURNAL ETR-KIOSK DU DÉMARRAGE ==="
          journalctl -u etr-kiosk.service -b --no-pager -n 200
          echo
          echo "=== DASHBOARD ==="
          systemctl status etr-dashboard.service --no-pager -n 80
          systemctl cat etr-dashboard.service
          echo
          echo "=== AFFICHAGES DISPONIBLES ==="
          ls -la /tmp/.X11-unix 2>/dev/null || true
          ps -eo pid,user,args | grep -E '[X]org|[X]wayland|[w]ayfire|[l]abwc|[x]init|[f]bcp' || true
          echo
          echo "=== STOCKAGE ==="
          df -h /

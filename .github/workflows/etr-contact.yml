name: Contrôler EtR

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 3
    steps:
      - name: Vérifier les services essentiels
        shell: bash
        run: |
          set -euo pipefail
          for service in etr.service etr-dashboard.service spi-desktop.service etr-kiosk.service; do
            systemctl is-active --quiet "$service"
            echo "$service : actif"
          done
          test -S /tmp/.X11-unix/X1
          pgrep -u oryx -x chromium >/dev/null
          nc -z 127.0.0.1 8000
          nc -z 127.0.0.1 8080
          echo "EtR : contrôle réussi"

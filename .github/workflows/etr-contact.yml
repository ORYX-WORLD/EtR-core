name: Diagnostic service écran SPI EtR

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/etr-contact.yml"

jobs:
  spi:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 5
    steps:
      - name: Lire la panne du service écran SPI
        shell: bash
        run: |
          set +e
          sudo -n systemctl stop etr-kiosk.service
          echo "=== SPI-DESKTOP UNIT ==="
          systemctl cat spi-desktop.service
          echo
          echo "=== SPI-DESKTOP STATUS ==="
          systemctl status spi-desktop.service --no-pager -n 100
          echo
          echo "=== SPI-DESKTOP JOURNAL ==="
          journalctl -u spi-desktop.service -b --no-pager -n 160
          echo
          echo "=== ERREURS XORG :1 ==="
          grep -E '^\[.*\]( \(EE\)| \(WW\)|Fatal|Server terminated|Unable|No devices|no screens)' /home/oryx/.local/share/xorg/Xorg.1.log 2>/dev/null || true
          echo
          echo "=== DÉBUT ET FIN XORG :1 ==="
          sed -n '1,100p' /home/oryx/.local/share/xorg/Xorg.1.log 2>/dev/null || true
          tail -n 100 /home/oryx/.local/share/xorg/Xorg.1.log 2>/dev/null || true
          echo
          echo "=== FICHIERS SERVICE / SCRIPTS ==="
          systemctl show spi-desktop.service -p FragmentPath -p ExecStart -p User -p Group -p Environment
          unit_path="$(systemctl show spi-desktop.service -p FragmentPath --value)"
          [ -n "$unit_path" ] && sed -n '1,240p' "$unit_path"
          command -v startx || true
          command -v Xorg || true
          echo
          echo "=== ÉTAT PROTÉGÉ ==="
          systemctl is-active etr-kiosk.service
          systemctl is-active etr.service
          systemctl is-active etr-dashboard.service
          df -h /
          du -sh /home/oryx/.config/chromium/BrowserMetrics 2>/dev/null || true

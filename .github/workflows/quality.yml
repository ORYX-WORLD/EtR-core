name: Qualité et traçabilité

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Vérifier la version et les registres
        run: python3 scripts/check_project.py
      - name: Vérifier Python
        run: python3 -m py_compile src/*.py scripts/*.py
      - name: Vérifier Node.js
        run: node --check gateway/server.mjs
      - name: Vérifier les scripts shell
        run: find scripts src/deploy -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Vérifier les dépendances de la passerelle
        working-directory: gateway
        run: npm ci --ignore-scripts && npm audit --omit=dev --audit-level=critical

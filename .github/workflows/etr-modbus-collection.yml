name: EtR - collecte Modbus RTU
on:
  workflow_dispatch:
    inputs:
      install:
        description: Installer le lecteur avec collecte arrêtée
        type: boolean
        default: false
  push:
    branches: [codex/modbus-acquisition-20260909]
permissions:
  contents: read
concurrency:
  group: etr-physical-deploy
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r dashboard/requirements.txt
      - run: python -m unittest discover -s tests -q
  install:
    if: github.event_name == 'workflow_dispatch' && inputs.install
    needs: tests
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    steps:
      - name: Tester sur le Raspberry puis livrer sans activer le bus
        shell: bash
        run: |
          set -euo pipefail
          cd /home/oryx/EtR-core
          git fetch origin "$GITHUB_SHA"
          source_dir=$(mktemp -d /tmp/etr-modbus-source.XXXXXX)
          git archive "$GITHUB_SHA" | tar -x -C "$source_dir"
          cd "$source_dir"
          PYTHONDONTWRITEBYTECODE=1 /home/oryx/EtR-core/.venv/bin/python -m unittest tests.test_modbus_acquisition tests.test_hardware_profile tests.test_app tests.test_dashboard tests.test_sensor_acquisition -q
          sudo /usr/bin/python3 "$source_dir/src/deploy/raspi/deploy_modbus_collection.py" --commit "$GITHUB_SHA"
          sudo cat /var/lib/etr-core/modbus-deploy-proof.json > "$RUNNER_TEMP/modbus-deploy-proof.json"
      - uses: actions/upload-artifact@v4
        with:
          name: etr-modbus-deploy-proof
          path: ${{ runner.temp }}/modbus-deploy-proof.json

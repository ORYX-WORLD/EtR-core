name: Récupérer le lecteur USB et relancer la microSD

on:
  push:
    branches:
      - ops/sd-retry-current-reader
    paths:
      - .github/workflows/etr-sd-recover-reader-retry-once.yml

concurrency:
  group: etr-sd-recover-reader-retry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover-and-retry:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 100
    env:
      TARGET_DISK: /dev/sda
      TARGET_SIZE: "31268536320"
      READER_VENDOR: "14cd"
      READER_PRODUCT: "1212"
      REPO: /home/oryx/EtR-core

    steps:
      - name: Récupérer le lecteur sans le débrancher physiquement
        id: recover
        shell: bash
        run: |
          set -euo pipefail
          start_epoch=$(date +%s)
          echo "start_epoch=$start_epoch" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/etr-sd-recover-retry
          lsusb > /tmp/etr-sd-recover-retry/lsusb-before.txt || true
          lsusb -t > /tmp/etr-sd-recover-retry/lsusb-tree-before.txt || true

          sudo systemctl stop etr-sd-factory.service etr-sd-factory-worker.service 2>/dev/null || true
          sudo sync

          usb_node=""
          for node in /sys/bus/usb/devices/*; do
            [ -f "$node/idVendor" ] && [ -f "$node/idProduct" ] || continue
            vendor=$(cat "$node/idVendor" 2>/dev/null || true)
            product=$(cat "$node/idProduct" 2>/dev/null || true)
            if [ "$vendor" = "$READER_VENDOR" ] && [ "$product" = "$READER_PRODUCT" ]; then
              usb_node=$(basename "$node")
              break
            fi
          done

          if [ -n "$usb_node" ]; then
            if [ -w "/sys/bus/usb/devices/$usb_node/authorized" ]; then
              echo 0 | sudo tee "/sys/bus/usb/devices/$usb_node/authorized" >/dev/null
              sleep 3
              echo 1 | sudo tee "/sys/bus/usb/devices/$usb_node/authorized" >/dev/null
              sleep 5
            fi
            interface="${usb_node}:1.0"
            if [ -e "/sys/bus/usb/drivers/usb-storage/$interface" ]; then
              echo -n "$interface" | sudo tee /sys/bus/usb/drivers/usb-storage/unbind >/dev/null || true
              sleep 2
              echo -n "$interface" | sudo tee /sys/bus/usb/drivers/usb-storage/bind >/dev/null || true
            fi
          fi

          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --subsystem-match=usb || true
          sudo udevadm trigger --subsystem-match=block || true
          sudo udevadm settle || true

          recovered=false
          for attempt in $(seq 1 40); do
            if [ -b "$TARGET_DISK" ]; then
              size=$(sudo blockdev --getsize64 "$TARGET_DISK" 2>/dev/null || echo 0)
              if [ "$size" = "$TARGET_SIZE" ]; then
                recovered=true
                break
              fi
            fi
            sleep 1
          done

          if [ "$recovered" != true ]; then
            sudo modprobe -r usb_storage 2>/dev/null || true
            sleep 2
            sudo modprobe usb_storage
            sudo udevadm settle || true
            for attempt in $(seq 1 25); do
              if [ -b "$TARGET_DISK" ]; then
                size=$(sudo blockdev --getsize64 "$TARGET_DISK" 2>/dev/null || echo 0)
                if [ "$size" = "$TARGET_SIZE" ]; then
                  recovered=true
                  break
                fi
              fi
              sleep 1
            done
          fi

          lsusb > /tmp/etr-sd-recover-retry/lsusb-after.txt || true
          lsusb -t > /tmp/etr-sd-recover-retry/lsusb-tree-after.txt || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-recover-retry/lsblk-after.txt
          echo "recovered=$recovered" >> "$GITHUB_OUTPUT"
          [ "$recovered" = true ] || { echo "::error::Le lecteur n'est pas revenu sur /dev/sda"; exit 1; }

      - name: Installer la fabrique prudente
        shell: bash
        run: |
          set -euo pipefail
          sudo -u oryx -H git -C "$REPO" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$REPO" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$REPO" stash push --include-untracked -m "Sauvegarde avant reprise lecteur SD $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$REPO" fetch origin main
          sudo -u oryx -H git -C "$REPO" checkout main
          sudo -u oryx -H git -C "$REPO" reset --hard origin/main
          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-cleanup.sh" /usr/local/bin/etr-sd-factory-cleanup
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory-worker.service" /etc/systemd/system/etr-sd-factory-worker.service
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory.service" /etc/systemd/system/etr-sd-factory.service
          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-launch.sh" /usr/local/bin/etr-sd-factory-launch.sh
          sudo systemctl daemon-reload
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true

      - name: Étape 1 — supprimer les données
        id: erase
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop etr-sd-factory.service etr-sd-factory-worker.service 2>/dev/null || true
          sudo sync
          for device in "${TARGET_DISK}1" "${TARGET_DISK}2"; do
            if [ -b "$device" ]; then
              while read -r target; do
                [ -n "$target" ] || continue
                sudo umount "$target" 2>/dev/null || sudo umount -l "$target" 2>/dev/null || true
              done < <(findmnt -rn -S "$device" -o TARGET || true)
            fi
          done
          sudo rm -rf /run/etr-sd-factory/job-* /run/etr-sd-factory/repo-snapshot-*
          sudo rm -f /var/lib/etr-core/sd-factory-request.json /var/lib/etr-core/sd-factory-state.json /var/lib/etr-core/sd-factory-rsync.log

          echo 64 | sudo tee /sys/block/sda/queue/max_sectors_kb >/dev/null 2>&1 || true
          echo 128 | sudo tee /sys/block/sda/queue/read_ahead_kb >/dev/null 2>&1 || true
          if [ -w /sys/block/sda/device/queue_depth ]; then echo 1 | sudo tee /sys/block/sda/device/queue_depth >/dev/null || true; fi

          for attempt in $(seq 1 10); do
            size=$(sudo blockdev --getsize64 "$TARGET_DISK" 2>/dev/null || echo 0)
            [ "$size" = "$TARGET_SIZE" ] || { echo "::error::Capacité instable avant effacement : $size"; exit 1; }
            sleep 2
          done

          sudo wipefs --all --force "$TARGET_DISK"
          sudo dd if=/dev/zero of="$TARGET_DISK" bs=4M count=8 oflag=direct,dsync status=progress
          disk_mib=$((TARGET_SIZE / 1024 / 1024))
          end_seek=$((disk_mib / 4 - 8))
          sudo dd if=/dev/zero of="$TARGET_DISK" bs=4M seek="$end_seek" count=8 oflag=direct,dsync status=progress
          sudo sync
          sudo blockdev --rereadpt "$TARGET_DISK" 2>/dev/null || true
          sudo udevadm settle || true
          size=$(sudo blockdev --getsize64 "$TARGET_DISK" 2>/dev/null || echo 0)
          [ "$size" = "$TARGET_SIZE" ] || { echo "::error::Capacité instable après effacement : $size"; exit 1; }
          echo "erase=success" >> "$GITHUB_OUTPUT"

      - name: Étapes 2 et 3 — formatage puis écriture
        id: factory
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO"
          sudo .venv/bin/python - <<'PY' > /tmp/etr-sd-recover-retry/request.json
          import json, uuid
          from src.deploy.raspi import etr_sd_factory_core as core
          from src.deploy.raspi.etr_sd_factory_state import write_request
          devices=core.lsblk_data(); source=core.source_disk(devices)
          matches=[d for d in core.candidate_disks(devices, source) if d.path == '/dev/sda' and d.size == 31268536320]
          if len(matches) != 1:
              raise SystemExit(f'Cible non sûre: {[(d.path,d.size) for d in core.candidate_disks(devices, source)]}')
          disk=matches[0]
          request={'job_id':str(uuid.uuid4()),'device':disk.path,'disk_label':disk.label,'size_bytes':disk.size,'copy_wifi':bool(core.active_wifi_profile())}
          write_request(request)
          print(json.dumps(request,ensure_ascii=False,indent=2))
          PY
          job_id=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-recover-retry/request.json"))["job_id"])')
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          sudo systemctl start --no-block etr-sd-factory-worker.service
          sudo systemctl restart etr-sd-factory.service

          formatting_seen=false; writing_seen=false; terminal=false; final_status=""
          for attempt in $(seq 1 1080); do
            if sudo test -s /var/lib/etr-core/sd-factory-state.json; then
              sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-recover-retry/state.json
              status=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-recover-retry/state.json")).get("status", ""))')
              case "$status" in
                formatting|mounting) formatting_seen=true ;;
                copying_root|copying_boot|configuring|verifying|syncing|finalizing) writing_seen=true ;;
                ready|failed|cancelled|interrupted) terminal=true; final_status="$status"; break ;;
              esac
            fi
            sleep 5
          done
          echo "formatting_seen=$formatting_seen" >> "$GITHUB_OUTPUT"
          echo "writing_seen=$writing_seen" >> "$GITHUB_OUTPUT"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          echo "final_status=$final_status" >> "$GITHUB_OUTPUT"
          sudo cat /var/lib/etr-core/sd-factory-state.json 2>/dev/null || true
          [ "$terminal" = true ] && [ "$formatting_seen" = true ] && [ "$writing_seen" = true ] && [ "$final_status" = ready ]

      - name: Publier la preuve et retirer le workflow
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          START_EPOCH: ${{ steps.recover.outputs.start_epoch }}
          RECOVERED: ${{ steps.recover.outputs.recovered }}
          ERASE_STATUS: ${{ steps.erase.outputs.erase }}
          JOB_ID: ${{ steps.factory.outputs.job_id }}
          FORMATTING_SEEN: ${{ steps.factory.outputs.formatting_seen }}
          WRITING_SEEN: ${{ steps.factory.outputs.writing_seen }}
          TERMINAL: ${{ steps.factory.outputs.terminal }}
          FINAL_STATUS: ${{ steps.factory.outputs.final_status }}
        run: |
          set -euo pipefail
          sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-recover-retry/final-state.json 2>/dev/null || printf '{}\n' > /tmp/etr-sd-recover-retry/final-state.json
          sudo cat /var/lib/etr-core/sd-factory-rsync.log > /tmp/etr-sd-recover-retry/rsync.log 2>/dev/null || : > /tmp/etr-sd-recover-retry/rsync.log
          sudo journalctl -u etr-sd-factory-worker.service --since "@${START_EPOCH:-0}" --no-pager > /tmp/etr-sd-recover-retry/journal.txt 2>&1 || true
          sudo journalctl -k --since "@${START_EPOCH:-0}" --no-pager > /tmp/etr-sd-recover-retry/kernel.txt 2>&1 || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-recover-retry/lsblk-final.txt

          python3 - <<'PY' > /tmp/etr-sd-current-reader-retry.json
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          def data(path):
              try:return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(path, limit=30000):
              try:return Path(path).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          kernel=text('/tmp/etr-sd-recover-retry/kernel.txt')
          state=data('/tmp/etr-sd-recover-retry/final-state.json')
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'readerRecovered':os.getenv('RECOVERED') == 'true',
              'eraseStatus':os.getenv('ERASE_STATUS') or None,
              'jobId':os.getenv('JOB_ID') or None,
              'formattingSeen':os.getenv('FORMATTING_SEEN') == 'true',
              'writingSeen':os.getenv('WRITING_SEEN') == 'true',
              'terminal':os.getenv('TERMINAL') == 'true',
              'finalStatus':os.getenv('FINAL_STATUS') or state.get('status'),
              'state':state,
              'capacityResetDetected':bool(re.search(r'capacity change from .* to 0|access beyond end of device',kernel,re.I)),
              'ioErrorDetected':bool(re.search(r'I/O error|Input/output error|Buffer I/O error',kernel,re.I)),
              'lsusbBefore':text('/tmp/etr-sd-recover-retry/lsusb-before.txt'),
              'lsusbAfter':text('/tmp/etr-sd-recover-retry/lsusb-after.txt'),
              'lsusbTreeBefore':text('/tmp/etr-sd-recover-retry/lsusb-tree-before.txt'),
              'lsusbTreeAfter':text('/tmp/etr-sd-recover-retry/lsusb-tree-after.txt'),
              'lsblkAfterRecovery':text('/tmp/etr-sd-recover-retry/lsblk-after.txt'),
              'lsblkFinal':text('/tmp/etr-sd-recover-retry/lsblk-final.txt'),
              'journal':text('/tmp/etr-sd-recover-retry/journal.txt'),
              'kernel':kernel,
              'rsyncLogTail':text('/tmp/etr-sd-recover-retry/rsync.log'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-current-reader-retry.json

          rm -rf /tmp/etr-sd-retry-report-repo
          git clone --depth 1 --branch ops/sd-retry-current-reader "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-retry-report-repo
          cd /tmp/etr-sd-retry-report-repo
          mkdir -p .github/deployment
          cp /tmp/etr-sd-current-reader-retry.json .github/deployment/etr-sd-current-reader-retry.json
          rm -f .github/workflows/etr-sd-recover-reader-retry-once.yml
          git config user.name 'EtR SD reader recovery retry'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-current-reader-retry.json .github/workflows/etr-sd-recover-reader-retry-once.yml
          git commit -m 'chore: record reader recovery retry and remove one-shot workflow [skip ci]'
          git push origin HEAD:ops/sd-retry-current-reader

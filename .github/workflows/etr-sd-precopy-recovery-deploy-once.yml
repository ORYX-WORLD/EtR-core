name: Déployer et éprouver la reprise USB complète de la fabrique

on:
  push:
    branches:
      - ops/deploy-sd-precopy-recovery
    paths:
      - .github/workflows/etr-sd-precopy-recovery-deploy-once.yml

concurrency:
  group: etr-sd-precopy-recovery-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy-manufacture:
    name: Installer, fabriquer et suivre jusqu'au résultat final
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 100
    env:
      REPO: /home/oryx/EtR-core
      REPORT_BRANCH: ops/deploy-sd-precopy-recovery
      EXPECTED_SIZE: "31268536320"

    steps:
      - name: Préparer les preuves sans interrompre un travail actif
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-precopy-recovery
          rm -rf "$work"
          mkdir -p "$work/pycache"
          date +%s > "$work/start-epoch"
          lsusb > "$work/lsusb-before.txt" || true
          lsusb -t > "$work/lsusb-tree-before.txt" || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > "$work/lsblk-before.txt"

          active=$(sudo systemctl show -p ActiveState --value etr-sd-factory-worker.service 2>/dev/null || echo inactive)
          printf '%s\n' "$active" > "$work/worker-before.txt"
          if [[ "$active" =~ ^(active|activating|reloading|deactivating)$ ]]; then
            echo "::error::Une fabrication est déjà active ($active). Aucun arrêt forcé."
            exit 1
          fi
          sudo systemctl stop etr-sd-factory.service 2>/dev/null || true
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true

      - name: Actualiser le dépôt installé sur la version fusionnée
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-precopy-recovery
          sudo -u oryx -H git -C "$REPO" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$REPO" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$REPO" stash push --include-untracked \
              -m "Sauvegarde avant reprise USB complète $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$REPO" fetch origin main
          sudo -u oryx -H git -C "$REPO" checkout main
          sudo -u oryx -H git -C "$REPO" reset --hard origin/main
          sudo -u oryx -H git -C "$REPO" rev-parse HEAD > "$work/installed-commit.txt"

      - name: Compiler et exécuter les tests microSD sans modifier le dépôt
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-precopy-recovery
          cd "$REPO"
          PYTHONPYCACHEPREFIX="$work/pycache" python3 -m py_compile \
            src/deploy/raspi/etr_sd_factory_fast.py \
            src/deploy/raspi/etr_sd_factory_state.py \
            src/deploy/raspi/etr_sd_factory_usb_resume.py \
            src/deploy/raspi/etr_sd_factory_preparation_recovery.py \
            src/deploy/raspi/etr_sd_factory_worker.py \
            > "$work/pycompile.txt" 2>&1
          PYTHONDONTWRITEBYTECODE=1 "$REPO/.venv/bin/python" -m unittest discover \
            -s tests -p 'test_sd_factory*.py' -v > "$work/tests.txt" 2>&1
          cat "$work/pycompile.txt"
          cat "$work/tests.txt"

      - name: Installer uniquement les services de la fabrique
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-cleanup.sh" /usr/local/bin/etr-sd-factory-cleanup
          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-launch.sh" /usr/local/bin/etr-sd-factory-launch.sh
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory-worker.service" /etc/systemd/system/etr-sd-factory-worker.service
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory.service" /etc/systemd/system/etr-sd-factory.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true
          systemd-analyze verify /etc/systemd/system/etr-sd-factory-worker.service /etc/systemd/system/etr-sd-factory.service
          sudo systemctl restart etr-sd-factory.service

      - name: Récupérer le lecteur sur le même port USB avant le départ si nécessaire
        id: reader
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-precopy-recovery

          find_card() {
            cd "$REPO"
            sudo .venv/bin/python - <<'PY'
          import json
          from src.deploy.raspi import etr_sd_factory_core as core
          expected=31268536320
          devices=core.lsblk_data()
          source=core.source_disk(devices)
          matches=[d for d in core.candidate_disks(devices, source) if d.size == expected]
          if len(matches) != 1:
              raise SystemExit(1)
          print(json.dumps({'path':matches[0].path,'size':matches[0].size,'label':matches[0].label},ensure_ascii=False))
          PY
          }

          ready=false
          for attempt in $(seq 1 15); do
            if find_card > "$work/card.json" 2>/dev/null; then ready=true; break; fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            reader_node=""
            for node in /sys/bus/usb/devices/*; do
              [ -f "$node/idVendor" ] && [ -f "$node/idProduct" ] || continue
              vid=$(cat "$node/idVendor" 2>/dev/null || true)
              pid=$(cat "$node/idProduct" 2>/dev/null || true)
              case "$vid:$pid" in
                14cd:1212|1908:0226) reader_node=$(basename "$node"); break ;;
              esac
            done
            if [ -n "$reader_node" ] && [ -w "/sys/bus/usb/devices/$reader_node/authorized" ]; then
              echo 0 | sudo tee "/sys/bus/usb/devices/$reader_node/authorized" >/dev/null
              sleep 3
              echo 1 | sudo tee "/sys/bus/usb/devices/$reader_node/authorized" >/dev/null
              sleep 5
            fi
            sudo udevadm trigger --subsystem-match=usb || true
            sudo udevadm trigger --subsystem-match=scsi || true
            sudo udevadm trigger --subsystem-match=block || true
            sudo udevadm settle || true
            for host in /sys/class/scsi_host/host*; do
              [ -w "$host/scan" ] && echo '- - -' | sudo tee "$host/scan" >/dev/null || true
            done
            for attempt in $(seq 1 45); do
              if find_card > "$work/card.json" 2>/dev/null; then ready=true; break; fi
              sleep 1
            done
          fi

          [ "$ready" = true ] || { echo "::error::La microSD de 31,3 Go n'est pas revenue sur le même port USB"; exit 1; }
          target=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-precopy-recovery/card.json"))["path"])')
          echo "target=$target" >> "$GITHUB_OUTPUT"
          cat "$work/card.json"
          lsusb > "$work/lsusb-ready.txt" || true
          lsusb -t > "$work/lsusb-tree-ready.txt" || true

      - name: Créer une demande neuve et lancer la fabrication
        id: start
        shell: bash
        env:
          TARGET: ${{ steps.reader.outputs.target }}
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-precopy-recovery
          sudo systemctl stop etr-sd-factory-worker.service 2>/dev/null || true
          sudo sync
          sudo rm -rf /run/etr-sd-factory/job-* /run/etr-sd-factory/repo-snapshot-*
          sudo rm -f /var/lib/etr-core/sd-factory-request.json \
                       /var/lib/etr-core/sd-factory-state.json \
                       /var/lib/etr-core/sd-factory-rsync.log
          cd "$REPO"
          sudo .venv/bin/python - "$TARGET" <<'PY' > /tmp/etr-sd-precopy-recovery/request.json
          import json
          import sys
          import uuid
          from src.deploy.raspi import etr_sd_factory_core as core
          from src.deploy.raspi.etr_sd_factory_state import write_request
          target=sys.argv[1]
          devices=core.lsblk_data()
          source=core.source_disk(devices)
          matches=[d for d in core.candidate_disks(devices, source) if d.path == target and d.size == 31268536320]
          if len(matches) != 1:
              raise SystemExit('La cible a changé avant le lancement')
          disk=matches[0]
          request={
              'job_id':str(uuid.uuid4()),
              'device':disk.path,
              'disk_label':disk.label,
              'size_bytes':disk.size,
              'copy_wifi':bool(core.active_wifi_profile()),
          }
          write_request(request)
          print(json.dumps(request,ensure_ascii=False,indent=2))
          PY
          job_id=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-precopy-recovery/request.json"))["job_id"])')
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          sudo systemctl reset-failed etr-sd-factory-worker.service 2>/dev/null || true
          sudo systemctl start --no-block etr-sd-factory-worker.service

      - name: Suivre exactement ce travail jusqu'à un résultat terminal
        id: monitor
        shell: bash
        env:
          EXPECTED_JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-precopy-recovery
          : > "$work/status-history.txt"
          terminal=false
          final_status=""
          saw_precopy_pause=false
          saw_precopy_restart=false
          saw_copy=false
          saw_copy_pause=false
          saw_copy_resume=false

          for attempt in $(seq 1 1080); do
            service=$(sudo systemctl show -p ActiveState --value etr-sd-factory-worker.service 2>/dev/null || echo unknown)
            if sudo test -s /var/lib/etr-core/sd-factory-state.json; then
              sudo cat /var/lib/etr-core/sd-factory-state.json > "$work/state.json"
              job=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-precopy-recovery/state.json")).get("job_id", ""))')
              status=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-precopy-recovery/state.json")).get("status", ""))')
              progress=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-precopy-recovery/state.json")).get("progress_percent", ""))')
              printf '%s service=%s job=%s status=%s progress=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$service" "$job" "$status" "$progress" >> "$work/status-history.txt"
              if [ "$job" = "$EXPECTED_JOB_ID" ]; then
                case "$status" in
                  paused_usb_setup) saw_precopy_pause=true ;;
                  restarting_preparation) saw_precopy_restart=true ;;
                  copying_root|copying_boot|configuring|verifying|syncing|finalizing|ready) saw_copy=true ;;
                  paused_usb|checking_filesystem) saw_copy_pause=true ;;
                  resuming_copy) saw_copy_resume=true ;;
                  failed|cancelled|interrupted)
                    terminal=true
                    final_status="$status"
                    break
                    ;;
                esac
                if [ "$status" = ready ]; then
                  terminal=true
                  final_status=ready
                  break
                fi
              fi
            fi
            sleep 5
          done

          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          echo "final_status=$final_status" >> "$GITHUB_OUTPUT"
          echo "saw_precopy_pause=$saw_precopy_pause" >> "$GITHUB_OUTPUT"
          echo "saw_precopy_restart=$saw_precopy_restart" >> "$GITHUB_OUTPUT"
          echo "saw_copy=$saw_copy" >> "$GITHUB_OUTPUT"
          echo "saw_copy_pause=$saw_copy_pause" >> "$GITHUB_OUTPUT"
          echo "saw_copy_resume=$saw_copy_resume" >> "$GITHUB_OUTPUT"
          sudo cat /var/lib/etr-core/sd-factory-state.json 2>/dev/null || true
          [ "$terminal" = true ]

      - name: Publier la preuve finale et retirer le workflow ponctuel
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          JOB_ID: ${{ steps.start.outputs.job_id }}
          TARGET: ${{ steps.reader.outputs.target }}
          TERMINAL: ${{ steps.monitor.outputs.terminal }}
          FINAL_STATUS: ${{ steps.monitor.outputs.final_status }}
          SAW_PRECOPY_PAUSE: ${{ steps.monitor.outputs.saw_precopy_pause }}
          SAW_PRECOPY_RESTART: ${{ steps.monitor.outputs.saw_precopy_restart }}
          SAW_COPY: ${{ steps.monitor.outputs.saw_copy }}
          SAW_COPY_PAUSE: ${{ steps.monitor.outputs.saw_copy_pause }}
          SAW_COPY_RESUME: ${{ steps.monitor.outputs.saw_copy_resume }}
        run: |
          set -euo pipefail
          work=/tmp/etr-sd-precopy-recovery
          start_epoch=$(cat "$work/start-epoch" 2>/dev/null || echo 0)
          sudo cat /var/lib/etr-core/sd-factory-state.json > "$work/state.json" 2>/dev/null || printf '{}\n' > "$work/state.json"
          sudo cat /var/lib/etr-core/sd-factory-rsync.log > "$work/rsync.log" 2>/dev/null || : > "$work/rsync.log"
          sudo systemctl status etr-sd-factory-worker.service --no-pager -l > "$work/worker.txt" 2>&1 || true
          sudo journalctl -u etr-sd-factory-worker.service --since "@${start_epoch}" --no-pager > "$work/journal.txt" 2>&1 || true
          sudo journalctl -k --since "@${start_epoch}" --no-pager > "$work/kernel.txt" 2>&1 || true
          pgrep -af 'etr_sd_factory_worker|[r]sync.*/run/etr-sd-factory/' > "$work/processes.txt" || true
          lsusb > "$work/lsusb-after.txt" || true
          lsusb -t > "$work/lsusb-tree-after.txt" || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > "$work/lsblk-after.txt"

          python3 - <<'PY' > /tmp/etr-sd-precopy-recovery-deploy.json
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          base=Path('/tmp/etr-sd-precopy-recovery')
          def data(name):
              try:return json.loads((base/name).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(name,limit=40000):
              try:return (base/name).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          state=data('state.json')
          kernel=text('kernel.txt')
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'workflowStatus':os.getenv('JOB_STATUS'),
              'installedCommit':text('installed-commit.txt').strip() or None,
              'jobId':os.getenv('JOB_ID') or None,
              'target':os.getenv('TARGET') or None,
              'terminal':os.getenv('TERMINAL') == 'true',
              'finalStatus':os.getenv('FINAL_STATUS') or state.get('status'),
              'sawPrecopyPause':os.getenv('SAW_PRECOPY_PAUSE') == 'true',
              'sawPrecopyRestart':os.getenv('SAW_PRECOPY_RESTART') == 'true',
              'reachedCopy':os.getenv('SAW_COPY') == 'true',
              'sawCopyPause':os.getenv('SAW_COPY_PAUSE') == 'true',
              'sawCopyResume':os.getenv('SAW_COPY_RESUME') == 'true',
              'state':state,
              'capacityResetDetected':bool(re.search(r'capacity change from .* to 0|access beyond end of device',kernel,re.I)),
              'ioErrorDetected':bool(re.search(r'I/O error|Input/output error|Buffer I/O error|Device offlined',kernel,re.I)),
              'tests':text('tests.txt'),
              'statusHistory':text('status-history.txt'),
              'card':data('card.json'),
              'request':data('request.json'),
              'worker':text('worker.txt'),
              'processes':text('processes.txt'),
              'journal':text('journal.txt'),
              'kernel':kernel,
              'rsyncLogTail':text('rsync.log'),
              'lsusbBefore':text('lsusb-before.txt'),
              'lsusbReady':text('lsusb-ready.txt'),
              'lsusbAfter':text('lsusb-after.txt'),
              'lsusbTreeAfter':text('lsusb-tree-after.txt'),
              'lsblkBefore':text('lsblk-before.txt'),
              'lsblkAfter':text('lsblk-after.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-precopy-recovery-deploy.json

          rm -rf /tmp/etr-sd-precopy-recovery-report
          git clone --depth 1 --branch "$REPORT_BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-precopy-recovery-report
          cd /tmp/etr-sd-precopy-recovery-report
          mkdir -p .github/deployment
          cp /tmp/etr-sd-precopy-recovery-deploy.json .github/deployment/etr-sd-precopy-recovery-deploy.json
          rm -f .github/workflows/etr-sd-precopy-recovery-deploy-once.yml
          git config user.name 'EtR SD pre-copy USB recovery deployment'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-precopy-recovery-deploy.json .github/workflows/etr-sd-precopy-recovery-deploy-once.yml
          git commit -m 'chore: record complete SD USB recovery deployment [skip ci]'
          git pull --rebase origin "$REPORT_BRANCH"
          git push origin HEAD:"$REPORT_BRANCH"

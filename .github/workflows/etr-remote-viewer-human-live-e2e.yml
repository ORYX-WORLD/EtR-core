name: Valider l'écran distant avec un compte humain vérifié

# Relance explicite après déploiement du vérificateur Identity Toolkit sur la révision 00025.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - gateway/remote-screen-human-live-e2e.mjs
      - .github/workflows/etr-remote-viewer-human-live-e2e.yml

concurrency:
  group: etr-remote-viewer-human-live-e2e
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  human_live_e2e:
    name: Compte vérifié, membership, remote-session, noVNC et RFB
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIREBASE_PROJECT_ID: oryx-froid-industriel
      FIREBASE_DATABASE_URL: https://oryx-froid-industriel-default-rtdb.europe-west1.firebasedatabase.app
      GATEWAY_URL: https://etr-remote-gateway-7n72m5gopq-ew.a.run.app
      ETR_INSTALLATION_ID: etr-core
      ETR_VIEWER_ORIGIN: https://oryx-froid-industriel.web.app
      ETR_HUMAN_E2E_EMAIL_BASE: contact@corefrigeration.com

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Installer les dépendances du test
        working-directory: gateway
        run: npm install --no-audit --no-fund

      - name: Authentification Google Cloud pour le membership temporaire
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Lire la configuration Firebase publique
        id: firebase_config
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-human-e2e
          curl --retry 6 --retry-delay 3 --retry-all-errors -fsS \
            https://oryx-froid-industriel.web.app/__/firebase/init.json \
            > /tmp/etr-human-e2e/firebase-init.json
          firebase_api_key=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-human-e2e/firebase-init.json', encoding='utf-8'))
          assert data.get('projectId') == 'oryx-froid-industriel'
          key=str(data.get('apiKey') or '').strip()
          assert 20 <= len(key) <= 200
          print(key)
          PY
          )
          echo "::add-mask::$firebase_api_key"
          echo "api_key=$firebase_api_key" >> "$GITHUB_OUTPUT"
          rm -f /tmp/etr-human-e2e/firebase-init.json

      - name: Attendre un EtR permanent dans la passerelle
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 120); do
            status=$(curl -sS -o /tmp/etr-human-e2e/health-before.json -w '%{http_code}' \
              "$GATEWAY_URL/api/health" || echo 000)
            if [ "$status" = "200" ] && python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-human-e2e/health-before.json', encoding='utf-8'))
          assert data.get('ok') is True
          assert data.get('service') == 'etr-remote-gateway'
          assert int(data.get('devices', 0)) >= 1
          assert int(data.get('viewers', 0)) == 0
          assert isinstance(data.get('revision'), str) and data['revision']
          PY
            then
              ready=true
              break
            fi
            sleep 3
          done
          cat /tmp/etr-human-e2e/health-before.json 2>/dev/null | python3 -m json.tool || true
          [ "$ready" = true ] || {
            echo "::error::Aucun EtR permanent n'est prêt pour le test humain"
            exit 1
          }

      - name: Envoyer l'e-mail de vérification et tester le parcours humain réel
        id: e2e
        working-directory: gateway
        shell: bash
        env:
          FIREBASE_API_KEY: ${{ steps.firebase_config.outputs.api_key }}
        run: |
          set +e
          export ETR_HUMAN_E2E_OUTPUT=/tmp/etr-human-e2e/result.json
          node remote-screen-human-live-e2e.mjs \
            > /tmp/etr-human-e2e/stdout.txt \
            2> /tmp/etr-human-e2e/stderr.txt
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/etr-human-e2e/stdout.txt || true
          cat /tmp/etr-human-e2e/stderr.txt >&2 || true
          [ "$code" = "0" ] || exit "$code"

      - name: Vérifier la fermeture propre et la persistance du Raspberry
        if: steps.e2e.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          clean=false
          for attempt in $(seq 1 30); do
            curl -fsS "$GATEWAY_URL/api/health" > /tmp/etr-human-e2e/health-after.json
            if python3 - <<'PY'
          import json
          data=json.load(open('/tmp/etr-human-e2e/health-after.json', encoding='utf-8'))
          assert int(data.get('devices', 0)) >= 1
          assert int(data.get('viewers', 0)) == 0
          PY
            then
              clean=true
              break
            fi
            sleep 1
          done
          cat /tmp/etr-human-e2e/health-after.json | python3 -m json.tool || true
          [ "$clean" = true ] || {
            echo "::error::Le viewer humain n'a pas été fermé proprement"
            exit 1
          }

      - name: Publier la preuve humaine sans identifiant ni secret
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          E2E_EXIT_CODE: ${{ steps.e2e.outputs.exit_code }}
        run: |
          set +e
          python3 - <<'PY' > /tmp/etr-remote-viewer-human-live-e2e-last.json
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          def load(name):
              try:return json.loads(Path(name).read_text(encoding='utf-8'))
              except Exception:return None
          def safe(name, limit=4000):
              try:value=Path(name).read_text(encoding='utf-8', errors='replace')[-limit:]
              except OSError:return ''
              value=re.sub(r'[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}', '<adresse-masquee>', value)
              value=re.sub(r'(?i)(bearer\s+|idtoken[=: ]+|refreshtoken[=: ]+|access_token[=: ]+)[A-Za-z0-9._~+\-/=]+', r'\1<secret-masque>', value)
              return value
          report={
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'commit':os.getenv('GITHUB_SHA'),
              'jobStatus':os.getenv('JOB_STATUS'),
              'exitCode':int(os.getenv('E2E_EXIT_CODE') or 999),
              'gatewayUrl':os.getenv('GATEWAY_URL'),
              'installationId':os.getenv('ETR_INSTALLATION_ID'),
              'healthBefore':load('/tmp/etr-human-e2e/health-before.json'),
              'result':load('/tmp/etr-human-e2e/result.json'),
              'healthAfter':load('/tmp/etr-human-e2e/health-after.json'),
              'stderr':safe('/tmp/etr-human-e2e/stderr.txt'),
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          cat /tmp/etr-remote-viewer-human-live-e2e-last.json
          git fetch origin main
          git checkout -B remote-viewer-human-live-report origin/main
          mkdir -p .github/deployment
          cp /tmp/etr-remote-viewer-human-live-e2e-last.json \
            .github/deployment/etr-remote-viewer-human-live-e2e-last.json
          git config user.name "EtR human remote viewer E2E"
          git config user.email "actions@users.noreply.github.com"
          git add .github/deployment/etr-remote-viewer-human-live-e2e-last.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record EtR human remote viewer E2E [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

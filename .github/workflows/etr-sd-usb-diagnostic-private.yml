name: EtR - diagnostic USB confidentiel (lecture seule)
'on':
  push:
    branches: [diagnostic/sd-usb-20260906]
    paths: [.github/workflows/etr-sd-usb-diagnostic-private.yml]
permissions:
  contents: read
concurrency:
  group: etr-sd-usb-readonly-diagnostic
  cancel-in-progress: false
jobs:
  diagnose:
    name: Examiner la fabrique sans modifier les supports
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 6
    defaults:
      run:
        shell: bash
        working-directory: /tmp
    steps:
      - name: Collecter et chiffrer le diagnostic
        id: capture
        run: |
          set -euo pipefail
          umask 077
          if [ ! -d /home/oryx/EtR-core ]; then
            echo 'Expected EtR installation not found; no collection performed.'
            exit 2
          fi
          work=$(mktemp -d /tmp/etr-sd-usb-diag.XXXXXX)
          echo "workdir=$work" >> "$GITHUB_OUTPUT"
          trap 'rm -f "$work/report.json.gz" "$work/collector.err"' EXIT
          cat > "$work/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEJTCCAo2gAwIBAgIUXk6imh5idrEJH0OWEgePaJYFpFMwDQYJKoZIhvcNAQEL
          BQAwIjEgMB4GA1UEAwwXRXRSIG9uZS1zaG90IGRpYWdub3N0aWMwHhcNMjYwOTA2
          MDgwMzQ0WhcNMjYwOTA4MDgwMzQ0WjAiMSAwHgYDVQQDDBdFdFIgb25lLXNob3Qg
          ZGlhZ25vc3RpYzCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCCAYoCggGBAKzt1ui3
          7pGNr4mPX+Pd10VcO4StVJmVnBU54ylEuZgIHsiag76V8JaRxkuv2y3RWKAOzX3d
          OxDfRwgcdXm8f4n9Fvy88hCY05CnOr7DdUqJb8RIYGsiIQEzinKhKM5qfTqzFIuS
          WG9Nx9fpK52PBkQ3SYc6Q2VwacZrIjk3MoqsenYkr0//J8mK06YFnBeBQgDWjmqN
          /yosFRInGj0RWArQnbJic9ySD0D/n//B9drxCjTX8Qk5E36vtvFUW8UeI0qEgWRh
          txqpFnULwbacbrA9lmt6Oqc1xoon4K044gvKucSrrEHpP8eLhxhCR+z7RcOgLcrd
          m91j6NyOsRUwH+0wyin+oKqPxM4cSrP5bN1nTl4AAONLPsLMqDeDhKAm966NA93r
          6rFx08k452vfG/SrjcGQwnps6zcelfTjSAv6wdzVOayPgR9bngiSuVlELVVTDRlS
          n50Ibb7IhKM509brmHIuJkYyUq58Do/q+HHzK/344xhfBKB2TnOltb+sswIDAQAB
          o1MwUTAdBgNVHQ4EFgQUqZDV7lAGxhS257zwRhqq+ksiVCowHwYDVR0jBBgwFoAU
          qZDV7lAGxhS257zwRhqq+ksiVCowDwYDVR0TAQH/BAUwAwEB/zANBgkqhkiG9w0B
          AQsFAAOCAYEASIHwXIXqqC66JuO5Ij59Tv08QJhznMsK7fa26zGoP3JFx30XSrCz
          PbPmZ1RztREmCu/GOY+aXIbxRfhQsYpov6ZtZNFp2RTmRaTkkT+/Haq9uEFEkgeO
          K3SQoIlpOjgDngO/EJ1p5xVq+tvDY4cg+ccaGZ2FSDAbG6acqaH/VOYa7eoOHgEV
          jidMQJPhjjLlzt9QAcRvLJrJxDxHXgVXIyhopqM+xNt/IseLVXvF1hAZzyTpw4Vu

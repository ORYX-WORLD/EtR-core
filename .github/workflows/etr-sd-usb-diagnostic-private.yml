          zdDV23nexq3B9b2vvg+KaR+NpF0dM7LBJToMeKMpPQiw9/H4jcGgUJ3hfYFaK9F1
          MiSEHN9OaVJN
          -----END CERTIFICATE-----
          CERT
          if ! sudo -n python3 - > "$work/report.json.gz" 2> "$work/collector.err" <<'PYCOLLECT'
          import datetime, gzip, hashlib, json, os, pathlib, re, subprocess, sys
          report = {'captured_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'mode': 'read-only'}
          def run(args, limit=16000):
              try:
                  result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, errors='replace', timeout=18, env=dict(os.environ, LC_ALL='C'))
                  return {'returncode': result.returncode, 'output': result.stdout[-limit:]}
              except Exception as exc:
                  return {'error': type(exc).__name__ + ': ' + str(exc)}
          units = ['etr-sd-factory.service', 'etr-sd-factory-worker.service']
          report['services'] = run(['systemctl', 'show', *units, '-p', 'Id,LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,MainPID,ActiveEnterTimestamp,InactiveEnterTimestamp'])
          report['factory_journal'] = run(['journalctl', '-u', units[0], '-u', units[1], '--since', '4 hours ago', '-n', '180', '--no-pager', '-o', 'short-iso'], 32000)
          state_path = pathlib.Path('/var/lib/etr-core/sd-factory-state.json')
          try:
              state = json.loads(state_path.read_text())
              keys = ['schema_version', 'job_id', 'status', 'active', 'stage', 'message', 'progress_percent', 'device', 'speed', 'eta', 'precopy_recovery_attempt', 'precopy_recovery_max', 'usb_recovery_attempt', 'usb_recovery_max', 'resume_count', 'started_at', 'updated_at', 'finished_at', 'error', 'verification', 'ready_to_remove']
              report['factory_state'] = {key: state[key] for key in keys if key in state}
          except Exception as exc:
              report['factory_state'] = {'read_error': str(exc)}
          report['block_devices'] = run(['lsblk', '-b', '-J', '-o', 'NAME,PATH,TYPE,SIZE,RO,RM,TRAN,FSTYPE,MOUNTPOINT,MODEL'])
          report['root_device'] = run(['findmnt', '-n', '-o', 'SOURCE,FSTYPE,OPTIONS', '/'])
          report['free_space'] = run(['df', '-B1', '--output=source,size,used,avail,pcent,target', '/', '/tmp', '/boot/firmware'])
          report['usb_devices'] = run(['lsusb'])
          report['usb_topology'] = run(['lsusb', '-t'])
          kernel = run(['journalctl', '-k', '-b', '-n', '1200', '--no-pager', '-o', 'short-iso'], 200000)
          if 'output' in kernel:
              kernel['output'] = '\n'.join([line for line in kernel['output'].splitlines() if re.search(r'usb|sd[a-z]|mmc|voltage|I/O error|EXT4-fs|uas', line, re.I)][-150:])
          report['storage_kernel'] = kernel
          report['power'] = run(['vcgencmd', 'get_throttled'])
          report['clock'] = run(['timedatectl', 'show', '-p', 'NTPSynchronized,TimeUSec'])
          report['uptime'] = run(['uptime', '-p'])
          report['installed_commit'] = run(['git', '-c', 'safe.directory=/home/oryx/EtR-core', '-C', '/home/oryx/EtR-core', 'rev-parse', 'HEAD'])
          locks = run(['lslocks', '-n', '-o', 'COMMAND,PID,TYPE,MODE,PATH'])
          if 'output' in locks:
              locks['output'] = '\n'.join(line for line in locks['output'].splitlines() if 'etr-sd-factory' in line)
          report['factory_locks'] = locks
          report['installed_factory_files'] = {}
          for name in ['etr_sd_factory.py', 'etr_sd_factory_worker.py', 'etr_sd_factory_state.py', 'etr_sd_factory_backend.py']:
              path = pathlib.Path('/usr/local/bin') / name
              try:
                  report['installed_factory_files'][name] = {'size': path.stat().st_size, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()}
              except OSError as exc:
                  report['installed_factory_files'][name] = {'error': str(exc)}
          # Never read the request file, Wi-Fi profiles, tokens, credentials or process environments.
          serialized = json.dumps(report, ensure_ascii=True, indent=2)
          serialized = re.sub(r'(?i)(bearer\s+)[A-Za-z0-9._~+/-]+', r'\1[REDACTED]', serialized)
          sys.stdout.buffer.write(gzip.compress(serialized.encode('utf-8')))
          PYCOLLECT
          then
            echo 'Read-only collection failed. No plaintext report was published.'
            exit 3
          fi
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "$work/report.json.gz" -out "$work/report.cms" "$work/recipient.pem"
          echo "report=$work/report.cms" >> "$GITHUB_OUTPUT"
          echo 'Read-only diagnostic captured and encrypted.'
      - name: Conserver uniquement le rapport chiffre
        uses: actions/upload-artifact@v4
        with:
          name: etr-sd-usb-diagnostic-encrypted
          path: ${{ steps.capture.outputs.report }}
          retention-days: 1
          if-no-files-found: error
      - name: Effacer les fichiers temporaires du diagnostic
        if: always()
        env:
          WORKDIR: ${{ steps.capture.outputs.workdir }}
        run: |
          case "$WORKDIR" in
            /tmp/etr-sd-usb-diag.*)
              rm -f -- "$WORKDIR/report.json.gz" "$WORKDIR/collector.err" "$WORKDIR/report.cms" "$WORKDIR/recipient.pem"
              rmdir -- "$WORKDIR" || true
              ;;
          esac

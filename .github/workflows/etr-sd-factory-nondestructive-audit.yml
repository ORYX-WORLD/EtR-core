name: EtR - audit non destructif de la Fabrique SD

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: etr-sd-factory-nondestructive-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Vérifier que l'audit ne contient aucune commande destructive
        shell: bash
        run: |
          set -euo pipefail
          audit=src/deploy/raspi/etr-sd-factory-nondestructive-audit.sh
          bash -n "$audit"
          if grep -Ev '^[[:space:]]*#' "$audit" | grep -Eq '(^|[;&|[:space:]])(wipefs|sfdisk|mkfs(\.[[:alnum:]]+)?|dd|mount|umount|fsck|rsync)([;&|[:space:]]|$)'; then
            echo 'Une commande interdite est présente dans l audit' >&2
            exit 1
          fi
      - name: Exécuter les tests Fabrique sans support bloc
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_sd_factory*.py' -v
      - name: Auditer le Raspberry en lecture seule
        shell: bash
        run: bash src/deploy/raspi/etr-sd-factory-nondestructive-audit.sh
      - name: Ouvrir et prouver l'interface sans démarrer le moteur
        shell: bash
        run: |
          set -euo pipefail
          ! sudo systemctl is-active --quiet etr-sd-factory-worker.service
          ! sudo systemctl is-active --quiet etr-sd-factory-auto.service 2>/dev/null
          ! sudo test -e /var/lib/etr-core/sd-factory-request.json

          sudo systemctl start etr-sd-factory.service
          window_visible=false
          for _ in $(seq 1 40); do
            if sudo systemctl is-active --quiet etr-sd-factory.service \
              && DISPLAY=:1 XAUTHORITY=/home/oryx/.Xauthority xwininfo -root -tree 2>/dev/null \
                | grep -Eiq 'Fabrique de cartes EtR|Créer une carte microSD EtR'; then
              window_visible=true
              break
            fi
            sleep 0.5
          done

          test "$window_visible" = true
          sudo systemctl is-active --quiet etr-sd-factory.service
          ! sudo systemctl is-active --quiet etr-sd-factory-worker.service
          ! sudo test -e /var/lib/etr-core/sd-factory-request.json
          printf 'ETR_FACTORY_UI_PROOF|visible=:1|worker=inactive|request=absent\n'
      - name: Publier le diagnostic de l'interface
        if: always()
        shell: bash
        run: |
          set +e
          echo '=== etr-sd-factory.service ==='
          sudo systemctl status etr-sd-factory.service --no-pager -l
          echo '=== journal interface ==='
          sudo journalctl -u etr-sd-factory.service -n 100 --no-pager
          echo '=== processus fabrique ==='
          pgrep -a -f 'etr_sd_factory' || true
          echo '=== fenetres DISPLAY :1 ==='
          DISPLAY=:1 XAUTHORITY=/home/oryx/.Xauthority xwininfo -root -tree 2>&1 | tail -n 120
          echo '=== garde-fous destructifs ==='
          sudo systemctl is-active etr-sd-factory-worker.service || true
          sudo test -e /var/lib/etr-core/sd-factory-request.json && echo request=present || echo request=absent

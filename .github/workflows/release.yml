name: Publier une version EtR

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Valider le tag et les métadonnées
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          test "${GITHUB_REF_NAME}" = "v${version}"
          python3 scripts/check_project.py
      - name: Construire le manifeste de version
        run: python3 scripts/build_metadata.py --output .artifacts/release-manifest.json --target github-release --status released
      - uses: actions/upload-artifact@v4
        with:
          name: etr-${{ github.ref_name }}-release-manifest
          path: .artifacts/release-manifest.json
      - name: Créer la GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .artifacts/release-manifest.json --verify-tag --generate-notes

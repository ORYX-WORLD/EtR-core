name: Contrôler l'état final de la microSD EtR

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-sd-final-state.yml

concurrency:
  group: etr-sd-final-state
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  inspect:
    name: Vérifier la carte sans la modifier
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Inspecter la fabrique et la carte
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-sd-final /run/etr-sd-inspect/root /run/etr-sd-inspect/boot
          sudo systemctl status etr-sd-factory.service --no-pager -l > /tmp/etr-sd-final/service.txt 2>&1 || true
          sudo journalctl -u etr-sd-factory.service --since '2026-08-03 14:20:00' --no-pager > /tmp/etr-sd-final/journal.txt 2>&1 || true
          pgrep -af 'etr_sd_factory|/usr/bin/rsync|/usr/bin/sync' > /tmp/etr-sd-final/processes.txt || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-final/lsblk.txt
          sudo dmesg --ctime | tail -n 200 > /tmp/etr-sd-final/dmesg.txt || true

          root_mounted=false
          boot_mounted=false
          cleanup() {
            if [ "$boot_mounted" = true ]; then sudo umount /run/etr-sd-inspect/boot || true; fi
            if [ "$root_mounted" = true ]; then sudo umount /run/etr-sd-inspect/root || true; fi
          }
          trap cleanup EXIT

          if [ -b /dev/sda2 ] && ! findmnt -rn /dev/sda2 >/dev/null; then
            sudo mount -o ro,noload /dev/sda2 /run/etr-sd-inspect/root
            root_mounted=true
            ROOT=/run/etr-sd-inspect/root
          else
            ROOT=$(findmnt -rn -S /dev/sda2 -o TARGET | head -n1 || true)
          fi
          if [ -b /dev/sda1 ] && ! findmnt -rn /dev/sda1 >/dev/null; then
            sudo mount -o ro /dev/sda1 /run/etr-sd-inspect/boot
            boot_mounted=true
            BOOT=/run/etr-sd-inspect/boot
          else
            BOOT=$(findmnt -rn -S /dev/sda1 -o TARGET | head -n1 || true)
          fi

          export ROOT BOOT
          python3 - <<'PY' > /tmp/etr-sd-final/verification.json
          import json, os, pathlib, subprocess
          root=pathlib.Path(os.environ.get('ROOT') or '/')
          boot=pathlib.Path(os.environ.get('BOOT') or '/boot')
          def exists(rel, base=root): return (base/rel).exists()
          required={
            'setupScript':exists('home/oryx/EtR-core/src/deploy/raspi/setup_etr.sh'),
            'firstBootScript':exists('home/oryx/EtR-core/src/deploy/raspi/etr_factory_firstboot.py'),
            'firstBootService':exists('etc/systemd/system/etr-factory-firstboot.service'),
            'firstBootEnabled':exists('etc/systemd/system/multi-user.target.wants/etr-factory-firstboot.service'),
            'factoryTicket':exists('var/lib/etr-core/factory-ticket.json'),
            'fstab':exists('etc/fstab'),
            'cmdline':exists('cmdline.txt',boot),
          }
          forbidden={
            'firebaseAuth':exists('var/lib/etr-core/firebase-auth.json'),
            'bootstrapPrivateKey':exists('var/lib/etr-core/bootstrap-private.pem'),
            'runnerCredentials':exists('home/oryx/actions-runner/.credentials'),
          }
          ticket={}
          try:
            ticket=json.loads((root/'var/lib/etr-core/factory-ticket.json').read_text(encoding='utf-8'))
            ticket={k:('present' if k=='ticket' and v else v) for k,v in ticket.items() if k!='ticket' or v}
          except Exception: pass
          fstab=''
          cmdline=''
          try: fstab=(root/'etc/fstab').read_text(encoding='utf-8',errors='replace')
          except OSError: pass
          try: cmdline=(boot/'cmdline.txt').read_text(encoding='utf-8',errors='replace')
          except OSError: pass
          complete=all(required.values()) and not any(forbidden.values())
          print(json.dumps({
            'rootMount':str(root),
            'bootMount':str(boot),
            'required':required,
            'forbiddenPresent':forbidden,
            'factoryTicket':ticket,
            'fstab':fstab,
            'cmdline':cmdline,
            'complete':complete,
          },ensure_ascii=False,indent=2))
          PY

          sudo fsck.vfat -n /dev/sda1 > /tmp/etr-sd-final/fsck-boot.txt 2>&1 || true
          sudo e2fsck -fn /dev/sda2 > /tmp/etr-sd-final/fsck-root.txt 2>&1 || true

      - name: Publier le rapport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/etr-sd-final-state.json
          import json, re
          from datetime import datetime, timezone
          from pathlib import Path
          def text(name,limit=16000):
              try:return Path('/tmp/etr-sd-final/'+name).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          try: verification=json.loads(text('verification.json'))
          except Exception: verification={}
          journal=text('journal.txt')
          processes=text('processes.txt')
          fsck_boot=text('fsck-boot.txt')
          fsck_root=text('fsck-root.txt')
          dmesg=text('dmesg.txt')
          running=bool(re.search(r'/usr/bin/rsync|/usr/bin/sync',processes))
          medium_error=bool(re.search(r'critical medium error|I/O error|Input/output error',dmesg,re.I))
          fs_clean=('clean' in fsck_root.lower() or '0.0% non-contiguous' in fsck_root.lower()) and 'error' not in fsck_root.lower()
          status='copying' if running else ('ready' if verification.get('complete') and not medium_error else 'incomplete')
          report={
            'checkedAt':datetime.now(timezone.utc).isoformat(),
            'status':status,
            'copyProcessActive':running,
            'verification':verification,
            'mediumErrorDetected':medium_error,
            'filesystemCheckAppearsClean':fs_clean,
            'service':text('service.txt'),
            'processes':processes,
            'journal':journal,
            'lsblk':text('lsblk.txt'),
            'fsckBoot':fsck_boot,
            'fsckRoot':fsck_root,
            'dmesgTail':dmesg,
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-final-state.json
          git fetch origin main
          git checkout -B etr-sd-final-report origin/main
          mkdir -p .github/deployment
          cp /tmp/etr-sd-final-state.json .github/deployment/etr-sd-final-state.json
          git config user.name 'EtR SD final verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-final-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record EtR SD final state [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

name: Réinitialiser le hub USB du lecteur microSD

on:
  push:
    branches:
      - ops/sd-retry-current-reader
    paths:
      - .github/workflows/etr-usb-hub-reset-once.yml

concurrency:
  group: etr-usb-hub-reset
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reset:
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 8
    steps:
      - name: Réinitialiser le hub VIA sans redémarrer le Raspberry
        id: reset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-usb-hub-reset
          lsusb > /tmp/etr-usb-hub-reset/lsusb-before.txt || true
          lsusb -t > /tmp/etr-usb-hub-reset/tree-before.txt || true

          hub_node=""
          for node in /sys/bus/usb/devices/*; do
            [ -f "$node/idVendor" ] && [ -f "$node/idProduct" ] || continue
            vendor=$(cat "$node/idVendor" 2>/dev/null || true)
            product=$(cat "$node/idProduct" 2>/dev/null || true)
            if [ "$vendor" = "2109" ] && [ "$product" = "3431" ]; then
              hub_node=$(basename "$node")
              break
            fi
          done
          [ -n "$hub_node" ] || { echo "::error::Hub VIA 2109:3431 introuvable"; exit 1; }
          echo "$hub_node" > /tmp/etr-usb-hub-reset/hub-node.txt

          if [ -w "/sys/bus/usb/devices/$hub_node/authorized" ]; then
            echo 0 | sudo tee "/sys/bus/usb/devices/$hub_node/authorized" >/dev/null
            sleep 5
            echo 1 | sudo tee "/sys/bus/usb/devices/$hub_node/authorized" >/dev/null
          else
            echo -n "$hub_node" | sudo tee /sys/bus/usb/drivers/usb/unbind >/dev/null
            sleep 5
            echo -n "$hub_node" | sudo tee /sys/bus/usb/drivers/usb/bind >/dev/null
          fi

          sleep 8
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --subsystem-match=usb || true
          sudo udevadm trigger --subsystem-match=scsi || true
          sudo udevadm trigger --subsystem-match=block || true
          sudo udevadm settle || true
          for host in /sys/class/scsi_host/host*; do
            [ -w "$host/scan" ] && echo '- - -' | sudo tee "$host/scan" >/dev/null || true
          done

          found=false
          for attempt in $(seq 1 40); do
            if lsusb -d 14cd:1212 >/dev/null 2>&1; then
              for disk in /dev/sd?; do
                [ -b "$disk" ] || continue
                size=$(sudo blockdev --getsize64 "$disk" 2>/dev/null || echo 0)
                tran=$(lsblk -ndo TRAN "$disk" 2>/dev/null | xargs || true)
                if [ "$size" = "31268536320" ] && [ "$tran" = "usb" ]; then
                  printf '%s\n' "$disk" > /tmp/etr-usb-hub-reset/target.txt
                  found=true
                  break 2
                fi
              done
            fi
            sleep 1
          done
          echo "found=$found" >> "$GITHUB_OUTPUT"
          lsusb > /tmp/etr-usb-hub-reset/lsusb-after.txt || true
          lsusb -t > /tmp/etr-usb-hub-reset/tree-after.txt || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-usb-hub-reset/lsblk-after.txt
          [ "$found" = true ] || exit 1

      - name: Publier le résultat et retirer ce workflow
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          FOUND: ${{ steps.reset.outputs.found }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/etr-usb-hub-reset.json
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def text(path):
              try:return Path(path).read_text(encoding='utf-8',errors='replace')[-12000:]
              except OSError:return ''
          print(json.dumps({
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'readerFound':os.getenv('FOUND') == 'true',
              'hubNode':text('/tmp/etr-usb-hub-reset/hub-node.txt').strip() or None,
              'target':text('/tmp/etr-usb-hub-reset/target.txt').strip() or None,
              'lsusbBefore':text('/tmp/etr-usb-hub-reset/lsusb-before.txt'),
              'lsusbAfter':text('/tmp/etr-usb-hub-reset/lsusb-after.txt'),
              'treeBefore':text('/tmp/etr-usb-hub-reset/tree-before.txt'),
              'treeAfter':text('/tmp/etr-usb-hub-reset/tree-after.txt'),
              'lsblkAfter':text('/tmp/etr-usb-hub-reset/lsblk-after.txt'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-usb-hub-reset.json

          rm -rf /tmp/etr-usb-hub-reset-repo
          git clone --depth 1 --branch ops/sd-retry-current-reader "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-usb-hub-reset-repo
          cd /tmp/etr-usb-hub-reset-repo
          mkdir -p .github/deployment
          cp /tmp/etr-usb-hub-reset.json .github/deployment/etr-usb-hub-reset.json
          rm -f .github/workflows/etr-usb-hub-reset-once.yml
          git config user.name 'EtR USB hub reset'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-usb-hub-reset.json .github/workflows/etr-usb-hub-reset-once.yml
          git commit -m 'chore: record USB hub reset and remove one-shot workflow [skip ci]'
          git pull --rebase origin ops/sd-retry-current-reader
          git push origin HEAD:ops/sd-retry-current-reader

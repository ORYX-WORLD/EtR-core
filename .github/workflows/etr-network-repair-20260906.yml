name: EtR - reparation reseau et fabrique 2026-09-06

on:
  push:
    branches: [main]
    paths: [.github/workflows/etr-network-repair-20260906.yml]

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATEWAY_URL: https://etr-remote-gateway-7n72m5gopq-ew.a.run.app
      ETR_INSTALLATION_ID: etr-core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Installer Playwright
        run: |
          npm install playwright ws
          npx playwright install --with-deps chromium

      - name: Valider le tunnel VNC et preparer l acces
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=etr-bootstrap"
          curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" > /tmp/oidc.json
          token=$(python3 -c 'import json; print(json.load(open("/tmp/oidc.json"))["value"])')
          echo "::add-mask::$token"
          printf 'ETR_OIDC_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          GITHUB_OIDC_TOKEN="$token" ETR_E2E_OUTPUT=/tmp/remote-screen-preflight.json node gateway/remote-screen-live-e2e.mjs
          cat /tmp/remote-screen-preflight.json

      - name: Basculer VNC sur le vrai bureau SPI puis diagnostiquer EtR
        shell: bash
        run: |
          cat > repair.mjs <<'NODE'
          import { chromium } from 'playwright';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function ticket() {
            for (let attempt = 1; attempt <= 40; attempt += 1) {
              const response = await fetch(`${process.env.GATEWAY_URL}/api/diagnostics/remote-screen-ticket`, {
                method: 'POST',
                headers: {
                  authorization: `Bearer ${process.env.ETR_OIDC_TOKEN}`,
                  'content-type': 'application/json',
                  accept: 'application/json'
                },
                body: JSON.stringify({installationId: process.env.ETR_INSTALLATION_ID}),
                cache: 'no-store'
              });
              const body = await response.json().catch(() => ({}));
              if (response.ok && body.deviceConnected === true && body.viewerUrl) return body.viewerUrl;
              if (response.status !== 409) throw new Error(`ticket_http_${response.status}:${body.code || 'unknown'}`);
              await sleep(2000);
            }
            throw new Error('ticket_unavailable');
          }

          async function openViewer(browser) {
            const page = await browser.newPage({viewport:{width:1280,height:900}});
            await page.goto(await ticket(), {waitUntil:'domcontentloaded', timeout:30000});
            await page.waitForFunction(() => {
              const c = document.querySelector('#screen canvas, canvas');
              return Boolean(c && c.width > 20 && c.height > 20);
            }, null, {timeout:30000});
            const canvas = page.locator('#screen canvas, canvas').first();
            await canvas.click({position:{x:200,y:200}});
            return {page, canvas};
          }

          async function stats(page) {
            return page.evaluate(() => {
              const c = document.querySelector('#screen canvas, canvas');
              const ctx = c.getContext('2d', {willReadFrequently:true});
              const d = ctx.getImageData(0,0,c.width,c.height).data;
              let sum=0, bright=0, n=0;
              for (let i=0;i<d.length;i+=40) {
                const y=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
                sum+=y; if (y>55) bright++; n++;
              }
              return {mean:sum/Math.max(n,1),brightRatio:bright/Math.max(n,1),width:c.width,height:c.height};
            });
          }

          const browser = await chromium.launch({headless:true});

          // 1) La source actuelle :2 est noire mais accepte encore les entrées VNC.
          // On l'utilise une seule fois pour installer le service corrigé puis on la coupe.
          let first = await openViewer(browser);
          await first.canvas.screenshot({path:'01-before-vnc-switch.png'});
          await first.page.keyboard.press('Alt+F2');
          await sleep(700);
          const switchCmd = "bash -lc 'cd /home/oryx/EtR-core && git fetch origin main && git reset --hard origin/main && sudo -n install -m 644 src/deploy/raspi/etr-vnc.service /etc/systemd/system/etr-vnc.service && sudo -n systemctl daemon-reload && sudo -n systemctl restart etr-vnc.service'";
          await first.page.keyboard.type(switchCmd,{delay:1});
          await first.page.keyboard.press('Enter');
          await sleep(5000);
          await first.page.close().catch(() => {});

          // 2) Nouvelle connexion : elle doit maintenant montrer le vrai DISPLAY :1.
          let second = null;
          let physical = null;
          for (let attempt=1; attempt<=8; attempt++) {
            try {
              second = await openViewer(browser);
              physical = await stats(second.page);
              if (physical && (physical.mean > 3 || physical.brightRatio > 0.01)) break;
              await second.canvas.screenshot({path:`02-physical-attempt-${attempt}.png`}).catch(()=>{});
              await second.page.close().catch(()=>{});
              second = null;
            } catch {}
            await sleep(4000);
          }
          if (!second || !physical || (physical.mean <= 3 && physical.brightRatio <= 0.01)) {
            await browser.close();
            throw new Error(`physical_spi_desktop_not_visible:${JSON.stringify(physical)}`);
          }
          await second.canvas.screenshot({path:'03-physical-spi-desktop.png'});

          // 3) Maintenant seulement : installer le raccourci canonique et lancer le diagnostic.
          await second.page.keyboard.press('Alt+F2');
          await sleep(900);
          const diagCmd = "bash -lc 'cd /home/oryx/EtR-core && git fetch origin main && git reset --hard origin/main && rm -f /home/oryx/Desktop/Creer-une-carte-EtR.desktop /home/oryx/Desktop/etr-sd-factory.desktop /home/oryx/Desktop/SD-V1.1.desktop && install -m 755 src/deploy/raspi/etr-sd-factory.desktop /home/oryx/Desktop/SD-V1.1.desktop && rm -f /tmp/etr-architecture-diagnostic-gui-ready /tmp/etr-architecture-diagnostic.txt && DISPLAY=:1 XAUTHORITY=/home/oryx/.Xauthority python3 src/deploy/raspi/etr_architecture_diagnostic_gui.py'";
          await second.page.keyboard.type(diagCmd,{delay:1});
          await second.page.keyboard.press('Enter');

          let visible = false;
          for (let attempt=1; attempt<=30; attempt++) {
            await sleep(1500);
            const s = await stats(second.page);
            if (s && s.brightRatio > 0.05) { visible = true; break; }
          }
          await second.canvas.screenshot({path:'04-etr-diagnostic.png'});
          if (!visible) {
            await browser.close();
            throw new Error('etr_diagnostic_not_visible_on_physical_desktop');
          }

          console.log(JSON.stringify({physicalDesktop:true, stats:physical, diagnosticVisible:true}));
          await browser.close();
          NODE
          node ./repair.mjs

      - name: Conserver les preuves visuelles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etr-architecture-diagnostic
          path: |
            01-before-vnc-switch.png
            02-physical-attempt-*.png
            03-physical-spi-desktop.png
            04-etr-diagnostic.png
          if-no-files-found: ignore

      - name: Verifier le retour de l EtR sur la passerelle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 60); do
            if curl -fsS "$GATEWAY_URL/api/health" > /tmp/health.json && python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True
          assert int(d.get('devices',0)) >= 1
          PY
            then ok=true; break; fi
            sleep 2
          done
          cat /tmp/health.json || true
          [ "$ok" = true ]

name: EtR - reparation reseau et fabrique 2026-09-06

on:
  push:
    branches: [main]
    paths: [.github/workflows/etr-network-repair-20260906.yml]

permissions:
  contents: read
  id-token: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GATEWAY_URL: https://etr-remote-gateway-7n72m5gopq-ew.a.run.app
      ETR_INSTALLATION_ID: etr-core
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Installer Playwright
        run: |
          npm install playwright ws
          npx playwright install --with-deps chromium

      - name: Valider le tunnel VNC et preparer un acces frais
        shell: bash
        run: |
          set -euo pipefail
          oidc_url="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=etr-bootstrap"
          curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$oidc_url" > /tmp/oidc.json
          token=$(python3 -c 'import json; print(json.load(open("/tmp/oidc.json"))["value"])')
          echo "::add-mask::$token"
          printf 'ETR_OIDC_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

          GITHUB_OIDC_TOKEN="$token" \
            ETR_E2E_OUTPUT=/tmp/remote-screen-preflight.json \
            node gateway/remote-screen-live-e2e.mjs
          cat /tmp/remote-screen-preflight.json

      - name: Prouver LXDE puis installer SD V1.1 et diagnostiquer EtR
        shell: bash
        run: |
          cat > repair.mjs <<'NODE'
          import { chromium } from 'playwright';

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function issueFreshTicket() {
            let last = null;
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const response = await fetch(`${process.env.GATEWAY_URL}/api/diagnostics/remote-screen-ticket`, {
                method: 'POST',
                headers: {
                  authorization: `Bearer ${process.env.ETR_OIDC_TOKEN}`,
                  'content-type': 'application/json',
                  accept: 'application/json'
                },
                body: JSON.stringify({installationId: process.env.ETR_INSTALLATION_ID}),
                cache: 'no-store'
              });
              const body = await response.json().catch(() => ({}));
              last = {status: response.status, code: body.code || ''};
              if (response.ok && body.deviceConnected === true && body.viewerUrl) return body.viewerUrl;
              if (response.status !== 409) throw new Error(`viewer_ticket_http_${response.status}:${body.code || 'unknown'}`);
              await sleep(2000);
            }
            throw new Error(`viewer_ticket_unavailable:${JSON.stringify(last)}`);
          }

          async function canvasStats(page) {
            return await page.evaluate(() => {
              const canvas = document.querySelector('#screen canvas, canvas');
              if (!canvas || canvas.width < 20 || canvas.height < 20) return null;
              const ctx = canvas.getContext('2d', {willReadFrequently:true});
              const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
              let sum = 0;
              let bright = 0;
              let samples = 0;
              const step = 40;
              for (let i = 0; i < data.length; i += step) {
                const y = 0.2126 * data[i] + 0.7152 * data[i+1] + 0.0722 * data[i+2];
                sum += y;
                if (y > 55) bright += 1;
                samples += 1;
              }
              return {mean: sum / Math.max(samples,1), brightRatio: bright / Math.max(samples,1), width: canvas.width, height: canvas.height};
            });
          }

          function changedEnough(before, after) {
            if (!before || !after) return false;
            return Math.abs(after.mean - before.mean) >= 4 || Math.abs(after.brightRatio - before.brightRatio) >= 0.02;
          }

          const browser = await chromium.launch({headless:true});
          let page = null;
          let connected = false;
          let lastStatus = '';

          for (let attempt = 1; attempt <= 3 && !connected; attempt += 1) {
            const viewerUrl = await issueFreshTicket();
            page = await browser.newPage({viewport:{width:1280,height:900}});
            try {
              await page.goto(viewerUrl,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(() => {
                const canvas = document.querySelector('#screen canvas, canvas');
                return Boolean(canvas && canvas.width > 20 && canvas.height > 20);
              }, null, {timeout:30000});
              const canvas = page.locator('#screen canvas, canvas').first();
              await canvas.click({position:{x:200,y:200}});
              connected = true;
            } catch (error) {
              lastStatus = await page.locator('#status').textContent().catch(() => 'status-indisponible');
              await page.screenshot({path:`viewer-attempt-${attempt}.png`,fullPage:true}).catch(() => {});
              await page.close().catch(() => {});
              page = null;
              if (attempt < 3) await sleep(5000);
            }
          }

          if (!connected || !page) {
            await browser.close();
            throw new Error(`viewer_canvas_unavailable_after_retries:${lastStatus}`);
          }

          const canvas = page.locator('#screen canvas, canvas').first();
          const before = await canvasStats(page);
          await canvas.screenshot({path:'01-viewer-before.png'});

          // Première preuve : Alt+F2 doit modifier réellement l'image VNC.
          await page.keyboard.press('Alt+F2');
          await page.waitForTimeout(1800);
          const runDialog = await canvasStats(page);
          await canvas.screenshot({path:'02-lxde-run-dialog.png'});
          if (!changedEnough(before, runDialog)) {
            await browser.close();
            throw new Error(`lxde_run_dialog_not_visible:before=${JSON.stringify(before)}:after=${JSON.stringify(runDialog)}`);
          }

          const cmd = "bash -lc 'cd /home/oryx/EtR-core && git fetch origin main && git reset --hard origin/main && rm -f /home/oryx/Desktop/Creer-une-carte-EtR.desktop /home/oryx/Desktop/etr-sd-factory.desktop /home/oryx/Desktop/SD-V1.1.desktop && install -m 755 src/deploy/raspi/etr-sd-factory.desktop /home/oryx/Desktop/SD-V1.1.desktop && rm -f /tmp/etr-architecture-diagnostic-gui-ready /tmp/etr-architecture-diagnostic.txt && DISPLAY=:1 XAUTHORITY=/home/oryx/.Xauthority python3 src/deploy/raspi/etr_architecture_diagnostic_gui.py'";
          await page.keyboard.type(cmd,{delay:1});
          await page.keyboard.press('Enter');

          // Deuxième preuve : la fenêtre de diagnostic doit devenir visiblement
          // différente du dialogue Alt+F2. Un workflow vert sans cela est refusé.
          let diagnosticVisible = false;
          let diagnosticStats = null;
          for (let attempt = 1; attempt <= 30; attempt += 1) {
            await sleep(1500);
            diagnosticStats = await canvasStats(page);
            if (changedEnough(runDialog, diagnosticStats) && diagnosticStats.brightRatio > 0.05) {
              diagnosticVisible = true;
              break;
            }
          }
          await canvas.screenshot({path:'03-etr-diagnostic-visible.png'});
          if (!diagnosticVisible) {
            await browser.close();
            throw new Error(`etr_diagnostic_window_not_visible:${JSON.stringify(diagnosticStats)}`);
          }

          await page.waitForTimeout(4000);
          await canvas.screenshot({path:'etr-architecture-diagnostic.png'});
          console.log(JSON.stringify({viewer:true, lxdeRunDialog:true, etrDiagnosticVisible:true, before, runDialog, diagnosticStats}));
          await browser.close();
          NODE
          node ./repair.mjs

      - name: Conserver les preuves visuelles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etr-architecture-diagnostic
          path: |
            01-viewer-before.png
            02-lxde-run-dialog.png
            03-etr-diagnostic-visible.png
            etr-architecture-diagnostic.png
            viewer-attempt-*.png
          if-no-files-found: ignore

      - name: Verifier le retour de l EtR sur la passerelle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 60); do
            if curl -fsS "$GATEWAY_URL/api/health" > /tmp/health.json && python3 - <<'PY'
          import json
          d=json.load(open('/tmp/health.json'))
          assert d.get('ok') is True
          assert int(d.get('devices',0)) >= 1
          PY
            then ok=true; break; fi
            sleep 2
          done
          cat /tmp/health.json || true
          [ "$ok" = true ]

name: Relancer la microSD après rebranchement du lecteur

on:
  push:
    branches:
      - ops/sd-retry-current-reader
    paths:
      - .github/workflows/etr-sd-retry-replugged-once.yml

concurrency:
  group: etr-sd-retry-replugged
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manufacture:
    name: Effacer, formater, écrire et vérifier
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 100
    env:
      REPO: /home/oryx/EtR-core
      EXPECTED_SIZE: "31268536320"
      EXPECTED_USB_ID: "14cd:1212"
      REPORT_BRANCH: ops/sd-retry-current-reader

    steps:
      - name: Mettre à jour uniquement le moteur de fabrique
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-sd-replugged
          date +%s > /tmp/etr-sd-replugged/start-epoch

          sudo systemctl stop etr-sd-factory.service etr-sd-factory-worker.service 2>/dev/null || true
          sudo sync

          sudo -u oryx -H git -C "$REPO" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$REPO" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$REPO" stash push --include-untracked -m "Sauvegarde avant fabrication microSD $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$REPO" fetch origin main
          sudo -u oryx -H git -C "$REPO" checkout main
          sudo -u oryx -H git -C "$REPO" reset --hard origin/main
          sudo -u oryx -H git -C "$REPO" rev-parse HEAD > /tmp/etr-sd-replugged/installed-commit

          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-cleanup.sh" /usr/local/bin/etr-sd-factory-cleanup
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory-worker.service" /etc/systemd/system/etr-sd-factory-worker.service
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory.service" /etc/systemd/system/etr-sd-factory.service
          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-launch.sh" /usr/local/bin/etr-sd-factory-launch.sh
          sudo systemctl daemon-reload
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true
          systemd-analyze verify /etc/systemd/system/etr-sd-factory-worker.service /etc/systemd/system/etr-sd-factory.service

      - name: Identifier et verrouiller la microSD rebranchée
        id: target
        shell: bash
        run: |
          set -euo pipefail
          lsusb > /tmp/etr-sd-replugged/lsusb-before.txt
          lsusb -t > /tmp/etr-sd-replugged/lsusb-tree-before.txt
          lsusb -d "$EXPECTED_USB_ID" > /tmp/etr-sd-replugged/reader.txt
          test -s /tmp/etr-sd-replugged/reader.txt

          cd "$REPO"
          sudo .venv/bin/python - <<'PY' > /tmp/etr-sd-replugged/target.json
          import json
          from src.deploy.raspi import etr_sd_factory_core as core

          expected_size = 31268536320
          devices = core.lsblk_data()
          source = core.source_disk(devices)
          candidates = core.candidate_disks(devices, source)
          matches = [disk for disk in candidates if disk.size == expected_size and disk.path != source]
          if len(matches) != 1:
              raise SystemExit(f"Une unique microSD USB de {expected_size} octets est requise: {[(d.path, d.size, d.transport, d.removable) for d in candidates]}")
          disk = matches[0]
          if disk.transport != "usb" and not disk.removable:
              raise SystemExit(f"Le support cible n'est pas USB/amovible: {disk}")
          print(json.dumps({"path": disk.path, "size": disk.size, "label": disk.label}, ensure_ascii=False))
          PY

          target=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-replugged/target.json"))["path"])')
          size=$(sudo blockdev --getsize64 "$target")
          [ "$size" = "$EXPECTED_SIZE" ]
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$target" > /tmp/etr-sd-replugged/target-path

      - name: Étape 1 — supprimer les données existantes
        id: erase
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          for partition in "${TARGET}"?*; do
            [ -b "$partition" ] || continue
            while read -r mountpoint; do
              [ -n "$mountpoint" ] || continue
              sudo umount "$mountpoint" 2>/dev/null || sudo umount -l "$mountpoint"
            done < <(findmnt -rn -S "$partition" -o TARGET || true)
          done
          sudo sync
          sudo rm -rf /run/etr-sd-factory/job-* /run/etr-sd-factory/repo-snapshot-*
          sudo rm -f /var/lib/etr-core/sd-factory-request.json \
                       /var/lib/etr-core/sd-factory-state.json \
                       /var/lib/etr-core/sd-factory-rsync.log

          disk_name=$(basename "$TARGET")
          echo 64 | sudo tee "/sys/block/${disk_name}/queue/max_sectors_kb" >/dev/null 2>&1 || true
          echo 128 | sudo tee "/sys/block/${disk_name}/queue/read_ahead_kb" >/dev/null 2>&1 || true
          if [ -w "/sys/block/${disk_name}/device/queue_depth" ]; then
            echo 1 | sudo tee "/sys/block/${disk_name}/device/queue_depth" >/dev/null || true
          fi

          for attempt in $(seq 1 8); do
            size=$(sudo blockdev --getsize64 "$TARGET" 2>/dev/null || echo 0)
            [ "$size" = "$EXPECTED_SIZE" ] || { echo "::error::Capacité instable avant effacement: $size"; exit 1; }
            sleep 1
          done

          sudo wipefs --all --force "$TARGET"
          sudo dd if=/dev/zero of="$TARGET" bs=1M count=16 oflag=direct,dsync status=progress
          disk_mib=$((EXPECTED_SIZE / 1024 / 1024))
          sudo dd if=/dev/zero of="$TARGET" bs=1M seek=$((disk_mib - 16)) count=16 oflag=direct,dsync status=progress
          sudo sync
          sudo blockdev --rereadpt "$TARGET" 2>/dev/null || true
          sudo udevadm settle || true
          size=$(sudo blockdev --getsize64 "$TARGET" 2>/dev/null || echo 0)
          [ "$size" = "$EXPECTED_SIZE" ] || { echo "::error::Capacité instable après effacement: $size"; exit 1; }
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Étapes 2 et 3 — formater puis écrire le système EtR
        id: start
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          cd "$REPO"
          sudo .venv/bin/python - "$TARGET" <<'PY' > /tmp/etr-sd-replugged/request.json
          import json, sys, uuid
          from src.deploy.raspi import etr_sd_factory_core as core
          from src.deploy.raspi.etr_sd_factory_state import write_request

          target = sys.argv[1]
          devices = core.lsblk_data()
          source = core.source_disk(devices)
          matches = [d for d in core.candidate_disks(devices, source) if d.path == target and d.size == 31268536320]
          if len(matches) != 1:
              raise SystemExit(f"La cible a changé avant le formatage: {[(d.path, d.size) for d in core.candidate_disks(devices, source)]}")
          disk = matches[0]
          request = {
              "job_id": str(uuid.uuid4()),
              "device": disk.path,
              "disk_label": disk.label,
              "size_bytes": disk.size,
              "copy_wifi": bool(core.active_wifi_profile()),
          }
          write_request(request)
          print(json.dumps(request, ensure_ascii=False, indent=2))
          PY

          job_id=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-replugged/request.json"))["job_id"])')
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true
          sudo systemctl start --no-block etr-sd-factory-worker.service
          sudo systemctl restart etr-sd-factory.service

      - name: Confirmer le démarrage et publier un état intermédiaire
        id: live
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ steps.start.outputs.job_id }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          : > /tmp/etr-sd-replugged/status-history.txt
          accepted=false
          terminal=false
          for attempt in $(seq 1 180); do
            if sudo test -s /var/lib/etr-core/sd-factory-state.json; then
              sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-replugged/live-state.json
              status=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-replugged/live-state.json")).get("status", ""))')
              printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$status" >> /tmp/etr-sd-replugged/status-history.txt
              case "$status" in
                formatting|mounting|copying_root|copying_boot|configuring|verifying|syncing|finalizing)
                  accepted=true
                  break
                  ;;
                ready|failed|cancelled|interrupted)
                  terminal=true
                  break
                  ;;
              esac
            fi
            sleep 1
          done
          echo "accepted=$accepted" >> "$GITHUB_OUTPUT"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"

          sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-replugged/live-state.json 2>/dev/null || printf '{}\n' > /tmp/etr-sd-replugged/live-state.json
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-replugged/live-lsblk.txt
          python3 - <<'PY' > /tmp/etr-sd-current-reader-live.json
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def data(path):
              try:return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(path):
              try:return Path(path).read_text(encoding='utf-8',errors='replace')[-12000:]
              except OSError:return ''
          print(json.dumps({
              "checkedAt": datetime.now(timezone.utc).isoformat(),
              "phase": "started",
              "jobId": os.getenv("JOB_ID"),
              "target": os.getenv("TARGET"),
              "state": data('/tmp/etr-sd-replugged/live-state.json'),
              "statusHistory": text('/tmp/etr-sd-replugged/status-history.txt'),
              "lsblk": text('/tmp/etr-sd-replugged/live-lsblk.txt'),
          }, ensure_ascii=False, indent=2))
          PY

          rm -rf /tmp/etr-sd-live-repo
          git clone --depth 1 --branch "$REPORT_BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-live-repo
          cd /tmp/etr-sd-live-repo
          mkdir -p .github/deployment
          cp /tmp/etr-sd-current-reader-live.json .github/deployment/etr-sd-current-reader-live.json
          git config user.name 'EtR SD live status'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-current-reader-live.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record SD retry start [skip ci]'
            git push origin HEAD:"$REPORT_BRANCH"
          fi

          if [ "$terminal" = true ]; then
            status=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-replugged/live-state.json")).get("status", ""))')
            [ "$status" = ready ] || exit 1
          fi
          [ "$accepted" = true ] || [ "$terminal" = true ]

      - name: Attendre la vérification et le démontage final
        id: finish
        shell: bash
        run: |
          set -euo pipefail
          terminal=false
          final_status=""
          for attempt in $(seq 1 1080); do
            if sudo test -s /var/lib/etr-core/sd-factory-state.json; then
              sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-replugged/final-state.json
              status=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-replugged/final-state.json")).get("status", ""))')
              printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$status" >> /tmp/etr-sd-replugged/status-history.txt
              case "$status" in
                ready|failed|cancelled|interrupted)
                  terminal=true
                  final_status="$status"
                  break
                  ;;
              esac
            fi
            sleep 5
          done
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          echo "final_status=$final_status" >> "$GITHUB_OUTPUT"
          [ "$terminal" = true ]
          python3 - <<'PY'
          import json
          state=json.load(open('/tmp/etr-sd-replugged/final-state.json',encoding='utf-8'))
          assert state.get('status') == 'ready', state
          assert state.get('ready_to_remove') is True, state
          assert state.get('verification') == 'passed', state
          PY

      - name: Publier la preuve finale et retirer ce workflow ponctuel
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          ERASE_STATUS: ${{ steps.erase.outputs.status }}
          JOB_ID: ${{ steps.start.outputs.job_id }}
          LIVE_ACCEPTED: ${{ steps.live.outputs.accepted }}
          TERMINAL: ${{ steps.finish.outputs.terminal }}
          FINAL_STATUS: ${{ steps.finish.outputs.final_status }}
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          start_epoch=$(cat /tmp/etr-sd-replugged/start-epoch 2>/dev/null || echo 0)
          sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-replugged/final-state.json 2>/dev/null || printf '{}\n' > /tmp/etr-sd-replugged/final-state.json
          sudo cat /var/lib/etr-core/sd-factory-rsync.log > /tmp/etr-sd-replugged/rsync.log 2>/dev/null || : > /tmp/etr-sd-replugged/rsync.log
          sudo systemctl status etr-sd-factory-worker.service --no-pager -l > /tmp/etr-sd-replugged/worker.txt 2>&1 || true
          sudo journalctl -u etr-sd-factory-worker.service --since "@${start_epoch}" --no-pager > /tmp/etr-sd-replugged/journal.txt 2>&1 || true
          sudo journalctl -k --since "@${start_epoch}" --no-pager > /tmp/etr-sd-replugged/kernel.txt 2>&1 || true
          lsusb > /tmp/etr-sd-replugged/lsusb-final.txt || true
          lsusb -t > /tmp/etr-sd-replugged/lsusb-tree-final.txt || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-replugged/lsblk-final.txt

          python3 - <<'PY' > /tmp/etr-sd-current-reader-retry.json
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          def data(path):
              try:return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(path, limit=30000):
              try:return Path(path).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          kernel=text('/tmp/etr-sd-replugged/kernel.txt')
          state=data('/tmp/etr-sd-replugged/final-state.json')
          print(json.dumps({
              "checkedAt":datetime.now(timezone.utc).isoformat(),
              "jobStatus":os.getenv('JOB_STATUS'),
              "target":os.getenv('TARGET') or None,
              "eraseStatus":os.getenv('ERASE_STATUS') or None,
              "jobId":os.getenv('JOB_ID') or None,
              "liveAccepted":os.getenv('LIVE_ACCEPTED') == 'true',
              "terminal":os.getenv('TERMINAL') == 'true',
              "finalStatus":os.getenv('FINAL_STATUS') or state.get('status'),
              "state":state,
              "capacityResetDetected":bool(re.search(r'capacity change from .* to 0|access beyond end of device',kernel,re.I)),
              "ioErrorDetected":bool(re.search(r'I/O error|Input/output error|Buffer I/O error',kernel,re.I)),
              "installedCommit":text('/tmp/etr-sd-replugged/installed-commit').strip() or None,
              "statusHistory":text('/tmp/etr-sd-replugged/status-history.txt'),
              "readerBefore":text('/tmp/etr-sd-replugged/reader.txt'),
              "lsusbBefore":text('/tmp/etr-sd-replugged/lsusb-before.txt'),
              "lsusbFinal":text('/tmp/etr-sd-replugged/lsusb-final.txt'),
              "lsusbTreeFinal":text('/tmp/etr-sd-replugged/lsusb-tree-final.txt'),
              "lsblkFinal":text('/tmp/etr-sd-replugged/lsblk-final.txt'),
              "worker":text('/tmp/etr-sd-replugged/worker.txt'),
              "journal":text('/tmp/etr-sd-replugged/journal.txt'),
              "kernel":kernel,
              "rsyncLogTail":text('/tmp/etr-sd-replugged/rsync.log'),
          },ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-current-reader-retry.json

          rm -rf /tmp/etr-sd-final-repo
          git clone --depth 1 --branch "$REPORT_BRANCH" "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-final-repo
          cd /tmp/etr-sd-final-repo
          mkdir -p .github/deployment
          cp /tmp/etr-sd-current-reader-retry.json .github/deployment/etr-sd-current-reader-retry.json
          rm -f .github/workflows/etr-sd-retry-replugged-once.yml
          git config user.name 'EtR SD controlled manufacture'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-current-reader-retry.json .github/workflows/etr-sd-retry-replugged-once.yml
          git commit -m 'chore: record replugged SD manufacture and remove one-shot workflow [skip ci]'
          git pull --rebase origin "$REPORT_BRANCH"
          git push origin HEAD:"$REPORT_BRANCH"

name: Consigner la reprise USB avant copie

on:
  push:
    branches:
      - feat/sd-precopy-usb-retry
    paths:
      - .github/workflows/append-tracker-precopy-usb-retry-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sd-precopy-usb-retry
          fetch-depth: 0

      - name: Ajouter le suivi puis retirer ce workflow ponctuel
        shell: bash
        run: |
          set -euo pipefail
          marker='| ETR-043 | Récupération USB avant copie |'
          if ! grep -Fq "$marker" docs/PROJECT_TRACKER.md; then
            cat >> docs/PROJECT_TRACKER.md <<'EOF'
          | ETR-043 | Récupération USB avant copie | Le lecteur peut se mettre hors ligne dès l'écriture du secteur 0, avant que la reprise rsync ne puisse intervenir | P0 | Implémentation en PR | L'essai réel a échoué dans `wipefs` avec `Device offlined`, `I/O error dev sda sector 0` et aucun état de copie atteint | Le moteur réduit le délai SCSI à 15 s, limite la taille des requêtes, détecte le décrochage dans les phases effacement/partitionnement/formatage, réinitialise le même lecteur sur le même port USB, attend 90 s puis relance la préparation depuis l'effacement ; deux récupérations maximum | Valider en CI, déployer puis vérifier qu'un décrochage avant copie produit `paused_usb_setup`, `restarting_preparation` et finit par atteindre `copying_root` ou un échec terminal borné |
          EOF
          fi
          rm -f .github/workflows/append-tracker-precopy-usb-retry-once.yml
          git config user.name 'EtR tracker automation'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/PROJECT_TRACKER.md .github/workflows/append-tracker-precopy-usb-retry-once.yml
          git commit -m 'docs: consigner la récupération USB avant copie'
          git push origin HEAD:feat/sd-precopy-usb-retry

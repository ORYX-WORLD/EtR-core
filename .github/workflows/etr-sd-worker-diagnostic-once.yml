name: Diagnostiquer une fois le moteur microSD persistant

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/etr-sd-worker-diagnostic-once.yml

concurrency:
  group: etr-sd-worker-diagnostic-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose:
    name: Contrôler le moteur sans modifier la carte
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 12
    steps:
      - name: Actualiser le dépôt installé sans lancer de déploiement
        shell: bash
        run: |
          set -euo pipefail
          repo=/home/oryx/EtR-core
          sudo -u oryx -H git -C "$repo" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          sudo -u oryx -H git -C "$repo" fetch origin main
          sudo -u oryx -H git -C "$repo" checkout main
          sudo -u oryx -H git -C "$repo" pull --ff-only origin main
          sudo -u oryx -H git -C "$repo" rev-parse HEAD > /tmp/etr-sd-worker-installed-commit.txt

      - name: Capturer l'environnement du service et les fichiers d'état
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-sd-worker-diag
          sudo systemctl cat etr-sd-factory-worker.service > /tmp/etr-sd-worker-diag/service-cat.txt 2>&1 || true
          sudo systemctl show etr-sd-factory-worker.service > /tmp/etr-sd-worker-diag/service-show.txt 2>&1 || true
          sudo systemctl status etr-sd-factory-worker.service --no-pager -l > /tmp/etr-sd-worker-diag/service-status.txt 2>&1 || true
          sudo journalctl -u etr-sd-factory-worker.service -o short-precise --since '2026-08-03 15:40:00' --no-pager > /tmp/etr-sd-worker-diag/journal.txt 2>&1 || true
          sudo find /var/lib/etr-core -maxdepth 1 -printf '%M %u:%g %s %TY-%Tm-%TdT%TH:%TM:%TS %p\n' > /tmp/etr-sd-worker-diag/state-files.txt 2>&1 || true
          sudo find /run/etr-sd-factory -maxdepth 3 -printf '%M %u:%g %s %p\n' > /tmp/etr-sd-worker-diag/runtime-files.txt 2>&1 || true
          sudo cp /var/lib/etr-core/sd-factory-state.json /tmp/etr-sd-worker-diag/current-state.json 2>/dev/null || printf '{}\n' > /tmp/etr-sd-worker-diag/current-state.json
          sudo cp /var/lib/etr-core/sd-factory-request.json /tmp/etr-sd-worker-diag/current-request.json 2>/dev/null || printf '{}\n' > /tmp/etr-sd-worker-diag/current-request.json
          sudo cp /var/lib/etr-core/sd-factory-rsync.log /tmp/etr-sd-worker-diag/current-rsync.log 2>/dev/null || : > /tmp/etr-sd-worker-diag/current-rsync.log
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-worker-diag/lsblk.txt

      - name: Vérifier imports, constantes et écriture atomique
        shell: bash
        run: |
          set +e
          cd /home/oryx/EtR-core
          sudo .venv/bin/python -u - <<'PY' > /tmp/etr-sd-worker-diag/python-preflight.txt 2>&1
          import json
          from pathlib import Path
          from src.deploy.raspi import etr_sd_factory_core as core
          from src.deploy.raspi import etr_sd_factory_fast as fast
          from src.deploy.raspi import etr_sd_factory_state as state
          from src.deploy.raspi import etr_sd_factory_worker as worker
          print('imports=ok')
          print('state_path=', state.STATE_PATH)
          print('request_path=', state.REQUEST_PATH)
          print('lock_path=', state.LOCK_PATH)
          print('unmount_disk=', hasattr(core, 'unmount_disk'))
          print('unmount_target=', hasattr(core, 'unmount_target'))
          devices=core.lsblk_data()
          source=core.source_disk(devices)
          candidates=core.candidate_disks(devices, source)
          print('source=', source)
          print('candidates=', [(d.path,d.size,d.transport,d.removable) for d in candidates])
          probe=Path('/var/lib/etr-core/.sd-factory-write-probe.json')
          core.atomic_json(probe, {'ok': True})
          print('atomic_write=', json.loads(probe.read_text()))
          probe.unlink()
          PY
          code=$?
          echo "$code" > /tmp/etr-sd-worker-diag/python-preflight-exit.txt
          set -e

      - name: Exécuter le moteur avec une cible fictive et des chemins isolés
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /tmp/etr-sd-worker-synthetic
          sudo install -d -m 700 /tmp/etr-sd-worker-synthetic
          sudo tee /tmp/etr-sd-worker-synthetic/request.json >/dev/null <<'JSON'
          {
            "job_id": "synthetic-safe-diagnostic",
            "device": "/dev/etr-nonexistent-safe-test",
            "disk_label": "Cible fictive sans effacement",
            "size_bytes": 0,
            "copy_wifi": false
          }
          JSON
          set +e
          cd /home/oryx/EtR-core
          sudo env \
            ETR_SD_FACTORY_STATE=/tmp/etr-sd-worker-synthetic/state.json \
            ETR_SD_FACTORY_REQUEST=/tmp/etr-sd-worker-synthetic/request.json \
            ETR_SD_FACTORY_LOCK=/tmp/etr-sd-worker-synthetic/worker.lock \
            .venv/bin/python -u src/deploy/raspi/etr_sd_factory_worker.py \
            > /tmp/etr-sd-worker-diag/synthetic-stdout.txt \
            2> /tmp/etr-sd-worker-diag/synthetic-stderr.txt
          code=$?
          set -e
          echo "$code" > /tmp/etr-sd-worker-diag/synthetic-exit.txt
          sudo cp /tmp/etr-sd-worker-synthetic/state.json /tmp/etr-sd-worker-diag/synthetic-state.json 2>/dev/null || printf '{}\n' > /tmp/etr-sd-worker-diag/synthetic-state.json

      - name: Construire et publier le rapport puis retirer le workflow ponctuel
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/etr-sd-worker-diagnostic.json
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          base=Path('/tmp/etr-sd-worker-diag')
          def text(name, limit=24000):
              try:return (base/name).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          def data(name):
              try:return json.loads((base/name).read_text(encoding='utf-8'))
              except Exception:return {}
          report={
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'installedCommit':Path('/tmp/etr-sd-worker-installed-commit.txt').read_text().strip() if Path('/tmp/etr-sd-worker-installed-commit.txt').exists() else None,
              'currentState':data('current-state.json'),
              'currentRequest':data('current-request.json'),
              'currentRsyncLog':text('current-rsync.log'),
              'serviceCat':text('service-cat.txt'),
              'serviceStatus':text('service-status.txt'),
              'serviceShow':text('service-show.txt'),
              'journal':text('journal.txt'),
              'stateFiles':text('state-files.txt'),
              'runtimeFiles':text('runtime-files.txt'),
              'lsblk':text('lsblk.txt'),
              'pythonPreflightExit':int(text('python-preflight-exit.txt').strip() or 999),
              'pythonPreflight':text('python-preflight.txt'),
              'syntheticExit':int(text('synthetic-exit.txt').strip() or 999),
              'syntheticStdout':text('synthetic-stdout.txt'),
              'syntheticStderr':text('synthetic-stderr.txt'),
              'syntheticState':data('synthetic-state.json'),
          }
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          cat /tmp/etr-sd-worker-diagnostic.json
          rm -rf /tmp/etr-sd-worker-diag-repo
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/etr-sd-worker-diag-repo
          cd /tmp/etr-sd-worker-diag-repo
          mkdir -p .github/deployment
          cp /tmp/etr-sd-worker-diagnostic.json .github/deployment/etr-sd-worker-diagnostic.json
          rm -f .github/workflows/etr-sd-worker-diagnostic-once.yml
          git config user.name 'EtR SD worker diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-worker-diagnostic.json .github/workflows/etr-sd-worker-diagnostic-once.yml
          git commit -m 'chore: record SD worker diagnostic and remove one-shot workflow [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main

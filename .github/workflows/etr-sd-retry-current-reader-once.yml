name: Réessayer la microSD avec le lecteur actuel

on:
  push:
    branches:
      - ops/sd-retry-current-reader
    paths:
      - .github/workflows/etr-sd-retry-current-reader-once.yml

concurrency:
  group: etr-sd-retry-current-reader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retry:
    name: Effacer, formater puis écrire la carte
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 100
    env:
      TARGET_DISK: /dev/sda
      TARGET_SIZE: "31268536320"
      READER_USB_ID: "14cd:1212"
      REPO: /home/oryx/EtR-core

    steps:
      - name: Installer uniquement la fabrique corrigée
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop etr-sd-factory.service etr-sd-factory-worker.service 2>/dev/null || true
          sudo sync

          sudo -u oryx -H git -C "$REPO" remote set-url origin https://github.com/ORYX-WORLD/EtR-core.git
          if [ -n "$(sudo -u oryx -H git -C "$REPO" status --porcelain)" ]; then
            sudo -u oryx -H git -C "$REPO" stash push --include-untracked -m "Sauvegarde avant nouvel essai microSD $(date -u +%Y%m%dT%H%M%SZ)"
          fi
          sudo -u oryx -H git -C "$REPO" fetch origin main
          sudo -u oryx -H git -C "$REPO" checkout main
          sudo -u oryx -H git -C "$REPO" reset --hard origin/main

          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-cleanup.sh" /usr/local/bin/etr-sd-factory-cleanup
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory-worker.service" /etc/systemd/system/etr-sd-factory-worker.service
          sudo install -m 644 "$REPO/src/deploy/raspi/etr-sd-factory.service" /etc/systemd/system/etr-sd-factory.service
          sudo install -m 755 "$REPO/src/deploy/raspi/etr-sd-factory-launch.sh" /usr/local/bin/etr-sd-factory-launch.sh
          sudo systemctl daemon-reload
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true
          systemd-analyze verify /etc/systemd/system/etr-sd-factory-worker.service /etc/systemd/system/etr-sd-factory.service

      - name: Étape 1 — supprimer toutes les données et réinitialiser le lecteur
        id: erase
        shell: bash
        run: |
          set -euo pipefail
          start_epoch=$(date +%s)
          echo "start_epoch=$start_epoch" >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/etr-sd-retry

          sudo systemctl stop etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true
          sudo sync
          for device in "${TARGET_DISK}1" "${TARGET_DISK}2"; do
            if [ -b "$device" ]; then
              while read -r target; do
                [ -n "$target" ] || continue
                sudo umount "$target" 2>/dev/null || sudo umount -l "$target" 2>/dev/null || true
              done < <(findmnt -rn -S "$device" -o TARGET || true)
            fi
          done
          sudo rm -rf /run/etr-sd-factory/job-* /run/etr-sd-factory/repo-snapshot-*
          sudo rm -f /var/lib/etr-core/sd-factory-request.json \
                       /var/lib/etr-core/sd-factory-state.json \
                       /var/lib/etr-core/sd-factory-rsync.log

          usb_line=$(lsusb -d "$READER_USB_ID" | head -n 1 || true)
          if [ -n "$usb_line" ]; then
            bus=$(awk '{print $2}' <<<"$usb_line")
            dev=$(awk '{gsub(":", "", $4); print $4}' <<<"$usb_line")
            usb_path="/dev/bus/usb/${bus}/${dev}"
            sudo python3 - "$usb_path" <<'PY'
          import fcntl, os, sys, time
          path=sys.argv[1]
          fd=os.open(path, os.O_WRONLY)
          try:
              fcntl.ioctl(fd, 0x5514, 0)  # USBDEVFS_RESET
          finally:
              os.close(fd)
          time.sleep(2)
          PY
          fi

          sudo udevadm settle || true
          ready=false
          for attempt in $(seq 1 30); do
            if [ -b "$TARGET_DISK" ]; then
              size=$(sudo blockdev --getsize64 "$TARGET_DISK" 2>/dev/null || echo 0)
              if [ "$size" = "$TARGET_SIZE" ]; then
                ready=true
                break
              fi
            fi
            sleep 1
          done
          [ "$ready" = true ] || { echo "::error::Le lecteur n'est pas revenu avec la capacité attendue"; exit 1; }

          echo 64 | sudo tee "/sys/block/$(basename "$TARGET_DISK")/queue/max_sectors_kb" >/dev/null 2>&1 || true
          echo 128 | sudo tee "/sys/block/$(basename "$TARGET_DISK")/queue/read_ahead_kb" >/dev/null 2>&1 || true
          if [ -w "/sys/block/$(basename "$TARGET_DISK")/device/queue_depth" ]; then
            echo 1 | sudo tee "/sys/block/$(basename "$TARGET_DISK")/device/queue_depth" >/dev/null || true
          fi

          for attempt in $(seq 1 10); do
            size=$(sudo blockdev --getsize64 "$TARGET_DISK" 2>/dev/null || echo 0)
            [ "$size" = "$TARGET_SIZE" ] || { echo "::error::Capacité instable avant effacement : $size"; exit 1; }
            sleep 2
          done

          sudo wipefs --all --force "$TARGET_DISK"
          sudo dd if=/dev/zero of="$TARGET_DISK" bs=4M count=8 oflag=direct,dsync status=progress
          disk_mib=$((TARGET_SIZE / 1024 / 1024))
          end_seek=$((disk_mib / 4 - 8))
          sudo dd if=/dev/zero of="$TARGET_DISK" bs=4M seek="$end_seek" count=8 oflag=direct,dsync status=progress
          sudo sync
          sudo blockdev --rereadpt "$TARGET_DISK" 2>/dev/null || true
          sudo udevadm settle || true
          size=$(sudo blockdev --getsize64 "$TARGET_DISK" 2>/dev/null || echo 0)
          [ "$size" = "$TARGET_SIZE" ] || { echo "::error::Capacité instable après effacement : $size"; exit 1; }
          echo "erase=success" >> "$GITHUB_OUTPUT"

      - name: Étapes 2 et 3 — lancer formatage puis écriture EtR
        id: factory
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO"
          sudo .venv/bin/python - <<'PY' > /tmp/etr-sd-retry/request.json
          import json, uuid
          from src.deploy.raspi import etr_sd_factory_core as core
          from src.deploy.raspi.etr_sd_factory_state import write_request

          devices=core.lsblk_data()
          source=core.source_disk(devices)
          candidates=core.candidate_disks(devices, source)
          matches=[disk for disk in candidates if disk.path == '/dev/sda' and disk.size == 31268536320]
          if len(matches) != 1:
              raise SystemExit(f'Cible microSD non sûre: {[(d.path, d.size) for d in candidates]}')
          disk=matches[0]
          request={
              'job_id':str(uuid.uuid4()),
              'device':disk.path,
              'disk_label':disk.label,
              'size_bytes':disk.size,
              'copy_wifi':bool(core.active_wifi_profile()),
          }
          write_request(request)
          print(json.dumps(request, ensure_ascii=False, indent=2))
          PY

          job_id=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-retry/request.json"))["job_id"])')
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          sudo systemctl reset-failed etr-sd-factory-worker.service etr-sd-factory.service 2>/dev/null || true
          sudo systemctl start --no-block etr-sd-factory-worker.service
          sudo systemctl restart etr-sd-factory.service

          formatting_seen=false
          writing_seen=false
          terminal=false
          final_status=""
          for attempt in $(seq 1 1080); do
            if sudo test -s /var/lib/etr-core/sd-factory-state.json; then
              sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-retry/state.json
              status=$(python3 -c 'import json; print(json.load(open("/tmp/etr-sd-retry/state.json")).get("status", ""))')
              case "$status" in
                formatting|mounting) formatting_seen=true ;;
                copying_root|copying_boot|configuring|verifying|syncing|finalizing) writing_seen=true ;;
                ready|failed|cancelled|interrupted)
                  terminal=true
                  final_status="$status"
                  break
                  ;;
              esac
            fi
            sleep 5
          done

          echo "formatting_seen=$formatting_seen" >> "$GITHUB_OUTPUT"
          echo "writing_seen=$writing_seen" >> "$GITHUB_OUTPUT"
          echo "terminal=$terminal" >> "$GITHUB_OUTPUT"
          echo "final_status=$final_status" >> "$GITHUB_OUTPUT"
          sudo cat /var/lib/etr-core/sd-factory-state.json 2>/dev/null || true

          [ "$terminal" = true ] || { echo "::error::La fabrication n'a pas atteint un état terminal dans le délai"; exit 1; }
          [ "$formatting_seen" = true ] || { echo "::error::L'étape de formatage n'a pas été observée"; exit 1; }
          [ "$writing_seen" = true ] || { echo "::error::L'étape d'écriture n'a pas été observée"; exit 1; }
          [ "$final_status" = ready ] || exit 1

      - name: Publier la preuve et retirer le workflow ponctuel
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
          START_EPOCH: ${{ steps.erase.outputs.start_epoch }}
          ERASE_STATUS: ${{ steps.erase.outputs.erase }}
          JOB_ID: ${{ steps.factory.outputs.job_id }}
          FORMATTING_SEEN: ${{ steps.factory.outputs.formatting_seen }}
          WRITING_SEEN: ${{ steps.factory.outputs.writing_seen }}
          TERMINAL: ${{ steps.factory.outputs.terminal }}
          FINAL_STATUS: ${{ steps.factory.outputs.final_status }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/etr-sd-retry
          sudo cat /var/lib/etr-core/sd-factory-state.json > /tmp/etr-sd-retry/final-state.json 2>/dev/null || printf '{}\n' > /tmp/etr-sd-retry/final-state.json
          sudo cat /var/lib/etr-core/sd-factory-rsync.log > /tmp/etr-sd-retry/rsync.log 2>/dev/null || : > /tmp/etr-sd-retry/rsync.log
          sudo systemctl status etr-sd-factory-worker.service --no-pager -l > /tmp/etr-sd-retry/worker.txt 2>&1 || true
          sudo journalctl -u etr-sd-factory-worker.service --since "@${START_EPOCH:-0}" --no-pager > /tmp/etr-sd-retry/journal.txt 2>&1 || true
          sudo journalctl -k --since "@${START_EPOCH:-0}" --no-pager > /tmp/etr-sd-retry/kernel.txt 2>&1 || true
          lsblk -b -o NAME,PATH,SIZE,TYPE,FSTYPE,LABEL,MOUNTPOINTS,TRAN,RM,MODEL > /tmp/etr-sd-retry/lsblk.txt

          python3 - <<'PY' > /tmp/etr-sd-current-reader-retry.json
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          def data(path):
              try:return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:return {}
          def text(path, limit=30000):
              try:return Path(path).read_text(encoding='utf-8',errors='replace')[-limit:]
              except OSError:return ''
          kernel=text('/tmp/etr-sd-retry/kernel.txt')
          state=data('/tmp/etr-sd-retry/final-state.json')
          report={
              'checkedAt':datetime.now(timezone.utc).isoformat(),
              'jobStatus':os.getenv('JOB_STATUS'),
              'jobId':os.getenv('JOB_ID') or None,
              'eraseStatus':os.getenv('ERASE_STATUS') or None,
              'formattingSeen':os.getenv('FORMATTING_SEEN') == 'true',
              'writingSeen':os.getenv('WRITING_SEEN') == 'true',
              'terminal':os.getenv('TERMINAL') == 'true',
              'finalStatus':os.getenv('FINAL_STATUS') or state.get('status'),
              'state':state,
              'capacityResetDetected':bool(re.search(r'capacity change from .* to 0|access beyond end of device', kernel, re.I)),
              'ioErrorDetected':bool(re.search(r'I/O error|Input/output error|Buffer I/O error', kernel, re.I)),
              'worker':text('/tmp/etr-sd-retry/worker.txt'),
              'journal':text('/tmp/etr-sd-retry/journal.txt'),
              'kernel':kernel,
              'rsyncLogTail':text('/tmp/etr-sd-retry/rsync.log'),
              'lsblk':text('/tmp/etr-sd-retry/lsblk.txt'),
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY
          cat /tmp/etr-sd-current-reader-retry.json

          rm -rf /tmp/etr-sd-retry-report-repo
          git clone --depth 1 --branch ops/sd-retry-current-reader \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            /tmp/etr-sd-retry-report-repo
          cd /tmp/etr-sd-retry-report-repo
          mkdir -p .github/deployment
          cp /tmp/etr-sd-current-reader-retry.json .github/deployment/etr-sd-current-reader-retry.json
          rm -f .github/workflows/etr-sd-retry-current-reader-once.yml
          git config user.name 'EtR SD controlled retry'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/deployment/etr-sd-current-reader-retry.json .github/workflows/etr-sd-retry-current-reader-once.yml
          git commit -m 'chore: record controlled SD retry and remove one-shot workflow [skip ci]'
          git push origin HEAD:ops/sd-retry-current-reader

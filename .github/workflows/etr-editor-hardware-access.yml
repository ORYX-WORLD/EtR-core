{
  "name": "EtR - qualifier mesures et tunnel local",
  "on": {
    "push": {
      "branches": [
        "codex/editor-hardware-access-20260908"
      ],
      "paths": [
        ".github/workflows/etr-editor-hardware-access.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "qualify": {
      "runs-on": [
        "self-hosted",
        "Linux",
        "ARM64"
      ],
      "timeout-minutes": 4,
      "steps": [
        {
          "name": "Verifier identite, acquisition et acces loopback limite",
          "shell": "bash",
          "run": "set -euo pipefail\npython3 - <<'PYREMOTE'\nimport json, urllib.request, os, pathlib, pwd, subprocess\nwith urllib.request.urlopen('http://127.0.0.1:8080/api/v1/status', timeout=10) as response:\n    status=json.load(response)\nidentity=status.get('device',{}).get('installation_id')\nprint('installation_id='+str(identity))\nprint('hardware_serial='+pathlib.Path('/proc/device-tree/serial-number').read_text().strip('\\x00\\n'))\ntelemetry=status.get('telemetry',{})\nprint(json.dumps({'online':telemetry.get('online'),'updated_at':telemetry.get('updated_at'),'sensors':[{'ain':s.get('ain'),'kind':s.get('kind'),'unit':s.get('unit'),'status':s.get('status'),'has_numeric_value':isinstance(s.get('value'),(int,float))} for s in telemetry.get('sensors',[])]}))\nfor unit in ['etr.service','etr-sensor-acquisition.service','etr-firebase-bridge.service','etr-remote-screen.service','spi-desktop.service','etr-remote-desktop.service']:\n    print(unit+'='+subprocess.run(['systemctl','is-active',unit],capture_output=True,text=True).stdout.strip())\nfor d in ('1','2'):\n    result=subprocess.run(['xdpyinfo'],env={**os.environ,'DISPLAY':':'+d,'XAUTHORITY':'/home/oryx/.Xauthority'},capture_output=True,text=True)\n    print('display_'+d+'='+next((x.strip() for x in result.stdout.splitlines() if 'dimensions:' in x),'unavailable'))\nfor path in pathlib.Path('/sys/class/graphics').glob('fb*/virtual_size'):\n    print(str(path)+'='+path.read_text().strip())\nPYREMOTE\n"
        }
      ]
    }
  }
}
